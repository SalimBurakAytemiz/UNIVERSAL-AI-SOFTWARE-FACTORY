- id: UASF-REQ-0040
  title: Factory Doctor
  description: "`factory doctor` checks Node/npm/Python/Git and reports READY/MISSING/OPTIONAL/BLOCKING/HUMAN_ACTION_REQUIRED per tool."
  source_baseline: "BASELINE-V1 section 80"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/cli/commands/doctor.ts"
  test_refs:
    - "runtime/cli/__tests__/doctor.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    P2 fix (9th independent review round, "declared Node support
    conflicts with Vitest 5"): package.json's `engines.node` (previously
    ">=20") silently contradicted the locked `vitest@^5.0.0` dependency's
    own required range (`^22.12.0 || ^24.0.0 || >=26.0.0`) — the Factory
    advertised support for a runtime its own required test toolchain does
    not support. Fixed by setting `engines.node` to match Vitest 5's
    range exactly (the single source of truth for what the toolchain
    genuinely requires); CI already targeted Node 22 and needed no
    change. The Node.js check previously only
    confirmed `node --version` succeeded (presence), never that the
    RUNNING version actually satisfied `package.json`'s declared
    `engines.node` range — so `factory doctor` could report READY on a
    Node version the locked Vitest 5 test toolchain would itself refuse
    to run under, and a future dependency upgrade widening that gap would
    go completely undetected. Fixed: a new `satisfiesEngineRange()`
    (caret/`>=`/exact clause matching, OR-joined) checks the actual `node
    --version` output against `engines.node` (read from the nearest
    package.json found by walking UP from doctor.ts's own directory —
    correct whether running from source via `tsx` or from the compiled
    `dist/` CLI, where the file sits one directory level deeper). A
    version outside the declared range now reports BLOCKING with a
    message naming the declared range. Regression tests prove: the real
    environment's Node.js check is READY only because it genuinely
    satisfies the declared range (asserted via the same package.json read
    independently in the test), satisfiesEngineRange() correctly evaluates
    caret and >= clauses in isolation and against the actual declared
    range's boundaries (v22.11.0 fails just below ^22.12.0, v25.0.0 fails
    in the gap between ^24.0.0 and >=26.0.0, etc.), and — reading Vitest's
    OWN engines.node directly from node_modules — every Node version the
    Factory's declared range accepts is also accepted by Vitest's,
    proving no silent contradiction remains. Confirmed via a temporary
    revert of package.json's engines.node back to the old '>=20' value
    (keeping the new doctor.ts logic) that both the range-boundary test
    and the no-silent-contradiction test correctly fail, reproducing the
    exact historical inconsistency Codex found; restored afterward.

    P2 audit-found fix (10th independent review round follow-up, same
    "declared Node support conflicts" class): package-lock.json's root
    package entry (`packages[""].engines.node`) still carried the OLD
    ">=20" value — the 9th round's package.json edit was made directly
    without ever running `npm install` to regenerate the lockfile, so the
    lockfile itself silently contradicted package.json (a second,
    independent instance of the same bug class, this time between two
    dependency-metadata files rather than between package.json and a
    dependency's own declared range). Fixed by running `npm install`
    (added 2 already-satisfied transitive/optional entries incidentally;
    confirmed via `git diff --stat` that the only meaningful change was
    the 1-line `engines.node` fix in package-lock.json). Re-ran the full
    test suite afterward with no regressions.

    Documentation/CI alignment (10th independent review round,
    establishing Node 24 as the canonical documented baseline): Codex
    asked for ONE canonical Node support policy stated consistently
    across specification/docs/package/CI/test toolchain, preferring Node
    24 as the primary documented recommendation. `.github/workflows/ci.yml`
    changed from `node-version: "22"` to `"24"` in both jobs; README.md,
    CONTRIBUTING.md, AGENTS.md, CLAUDE.md, and
    docs/beginner/repository-map-tr.md now each state "Node.js 24.x
    (LTS) is this repository's canonical, CI-tested runtime" while
    accurately noting the broader Vitest-5-compatible range enforced by
    `engines.node` and validated by `factory doctor`; a new `.nvmrc`
    (`24`) was added for local tooling. `engines.node` itself was
    deliberately NOT narrowed to "24 only": there is no `.npmrc`/
    `engine-strict` in this repo, so it stays advisory-only regardless;
    narrowing it would falsely exclude genuinely Vitest-5-compatible
    Node 22.12+/26+ environments (including this session's own sandbox,
    Node v22.22.2, which `factory doctor` already reports READY against)
    and would make the Factory's own enforcement mechanism reject an
    environment its own locked test toolchain accepts — the opposite of
    the "no unsupported/false claim" goal this fix serves. The
    already-existing `factory doctor` Node-range check plus its CI wiring
    (`node dist/runtime/cli/index.js doctor` in the "Smoke-test CLI" step,
    non-zero exit on BLOCKING) is the deterministic compatibility
    validation Codex asked for — it already fails a future dependency
    upgrade that silently narrows/widens the genuinely-required Node
    range without a matching `engines.node` update; no additional
    parallel check was added, to avoid a second, divergent source of
    truth for the same fact. Reviewed and deliberately left unchanged:
    `@types/node` (devDependency, pinned `^22.10.2`) — this is a typings
    package for `tsc`, not a runtime-support declaration; it does not
    make any claim about which Node version the Factory runs under, so
    bumping it is a dependency-upgrade decision outside this bug class's
    scope, not a contradiction to fix.

    P2 fix (10th independent review round, "declared Node support still
    conflicts with the complete required toolchain"): the 9th round's fix
    above validated the running Node version against Vitest's OWN
    `engines.node` ONLY. Codex then reproduced a DIFFERENT locked
    dependency — a nested `eslint-visitor-keys@5.0.1` (pulled in
    transitively by `@typescript-eslint/visitor-keys`, itself required by
    `@typescript-eslint/eslint-plugin`/`parser`, i.e. the LINT half of
    `npm run lint`) — declaring `engines.node: "^20.19.0 || ^22.13.0 ||
    >=24"`, which REJECTS Node 22.12.x even though package.json's
    `engines.node` at the time still advertised `^22.12.0` support (having
    only ever been checked against Vitest). Checking one hand-picked
    dependency can never catch a DIFFERENT dependency tightening its own
    requirement — exactly the same "declared vs. actually required" gap
    as the 9th round's bug, one dependency over. Fixed two ways: (1)
    package.json's `engines.node` narrowed from `^22.12.0` to `^22.13.0`
    (the genuine intersection of Vitest's and the lint toolchain's actual
    requirements — Node 24.x/26.x+ were already unaffected), regenerated
    into package-lock.json via `npm install`; (2) a new
    `findToolchainEngineViolations(nodeVersion)` walks the ENTIRE locked
    dependency tree (`package-lock.json`'s `packages` map, not one
    hand-picked package), skipping any package pinned to a DIFFERENT OS/
    CPU than the one currently running (it will never actually install/
    load here, e.g. `@rolldown/binding-android-arm-eabi` on this Linux x64
    machine), and returns every remaining locked package whose OWN
    `engines.node` rejects the given Node version. `factory doctor`'s
    Node.js check now runs this AFTER confirming the Factory's own
    declared range is satisfied — BOTH must pass for READY. Along the way,
    `satisfiesEngineRange()` gained a real bug fix: several innocuous
    locked packages declare the bare wildcard `engines.node: "*"` (e.g.
    some nested `minimatch` copies), which is standard semver for "any
    version accepted" and is NOT a parseable version number — without
    handling it explicitly, the toolchain-wide scan crashed on
    `parseVersion("*")` on a package that imposes no real constraint at
    all. Regression tests prove: `findToolchainEngineViolations("v22.12.0")`
    reproduces the exact Codex finding (flags the nested
    eslint-visitor-keys package), the currently-declared baseline's own
    accepted boundary versions have zero toolchain violations, a version
    genuinely outside every clause still surfaces the known lint-toolchain
    violation, the REAL running environment has zero locked-toolchain
    violations (cross-checked independently of `runDoctor()`'s own
    internals), and a package pinned to a mismatched OS/CPU never
    surfaces as a violation regardless of Node version. Confirmed via a
    temporary revert of package.json's `engines.node` back to `^22.12.0`
    (keeping the new doctor.ts logic) that the boundary-range test
    correctly fails (v22.12.0 now expected to fail but the reverted range
    still accepted it), while the fixed-version-string reproduction test
    (`findToolchainEngineViolations("v22.12.0")`) already caught the
    underlying gap independent of whatever package.json currently
    declares — then restored the corrected value and re-ran `npm install`
    to keep package-lock.json in sync (avoiding the exact stale-lockfile
    bug found and fixed in the 10th round's earlier follow-up pass).
    README.md/AGENTS.md/CLAUDE.md's "22.12+" prose updated to "22.13+" to
    match.

    P1 fix (26th independent review round, finding 1, "move runtime libraries out of devDependencies"): Codex
    reproduced that `npm ci --omit=dev` (a real production-style install) removed `ajv` and `js-yaml` even
    though runtime code imports them directly (`runtime/project-genome/genome.ts` imports `ajv`,
    `runtime/cli/commands/baseline-status.ts` imports `js-yaml`) — the compiled CLI would crash with
    `MODULE_NOT_FOUND` the moment anyone installed this package the way a real deployment does, since both
    packages lived under `devDependencies` alongside genuinely dev-only tooling (`typescript`/`vitest`/`eslint`/
    `tsx`). Fixed: moved `ajv` and `js-yaml` to a new top-level `dependencies` block in package.json (keeping
    `@types/js-yaml` and the rest of the toolchain under `devDependencies`), regenerated package-lock.json
    (`npm install --package-lock-only`) so the lockfile's own per-package `dev` flags match — confirmed `ajv`,
    `js-yaml`, and their transitive deps (`fast-deep-equal`, `fast-uri`, `json-schema-traverse`, `argparse`) all
    lost `"dev": true` in the lockfile. Per "do not merely make the test environment green," added a genuine
    proof rather than a static check: `scripts/verify-production-install.mjs` (wired as `npm run
    verify:production-install`) copies the ALREADY-BUILT `dist/` output plus package.json/package-lock.json into
    an isolated temp directory, runs a REAL `npm ci --omit=dev` there, asserts `typescript`/`vitest`/`eslint` are
    genuinely absent from the resulting `node_modules/` while `ajv`/`js-yaml` are genuinely present, then
    actually RUNS the compiled CLI's `factory baseline status` (exercises the `js-yaml`-backed requirement-
    registry parser) and dynamically imports the compiled `project-genome/genome.js` to exercise the ajv-backed
    validator against both a well-formed and a malformed genome (accept + reject both verified) — all under the
    same production-only install. Verified via a temporary bypass (moving `ajv`/`js-yaml` back to
    `devDependencies` and regenerating the lockfile) — confirmed the proof script genuinely failed at the
    "runtime dependency 'ajv' is MISSING" assertion, then fully reverted and re-confirmed the proof passes.

- id: UASF-REQ-0041
  title: Baseline status command
  description: "`factory baseline status` computes requirement counts by status from the requirement registry (not prose claims)."
  source_baseline: "BASELINE-V1 section 296"
  category: P0
  priority: HIGH
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/cli/commands/baseline-status.ts"
  test_refs:
    - "runtime/cli/__tests__/baseline-status.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    P2 targeted-audit fix (8th independent review round, found while
    auditing for the same class as organization-composer's "prototype
    names crash schema-valid project families"): `summarizeRequirements()`
    counted requirements via plain-object dictionaries
    (`byStatus[req.status] = (byStatus[req.status] ?? 0) + 1`, same for
    byCategory). `RequirementRecord.status`/`.category` are typed as plain
    `string` in this function's own signature — the closed schema enum is
    enforced by a DIFFERENT layer (scripts/validate-requirements.mjs), not
    here — so a status/category value of "constructor" reads the inherited
    `Object.prototype.constructor` function (truthy, never caught by `??`)
    and `function + 1` silently becomes STRING CONCATENATION instead of
    numeric addition, corrupting the count with no error raised — directly
    undermining the "no claim without evidence" purpose of this exact
    tool (a wrong count is itself unsupported evidence). Fixed: counts are
    now accumulated in a `Map<string, number>` (never reads the prototype
    chain) and converted to the public `Record<string, number>` return
    shape only at the end via `Object.fromEntries()`, which uses
    `[[DefineOwnProperty]]` (not `[[Set]]`) and therefore creates a
    genuine own property for any key — including "__proto__" — without
    ever invoking an accessor. Regression tests prove: a status of
    "constructor" counts correctly as a number (not a string), a category
    of "__proto__" counts correctly with no prototype pollution, "toString"
    counts correctly across multiple records, prototype-named and
    ordinary values are counted independently in the same call, and no
    prototype pollution occurs from processing any of these. Confirmed
    via git-stash that all 4 of these tests fail against the pre-fix code
    with exactly the corrupted-count (string-concatenation) symptom.

- id: UASF-REQ-0042
  title: P0 end-to-end proof
  description: >
    A single test run demonstrating the P0 kernel invariants together:
    cheapest-capable routing, premium-fallback block, budget ceiling,
    event-driven activation, and cache reuse, in one coherent scenario.
    Extended by proofs/p0-integrated-flow to also prove the foundation
    modules are wired together, not just independently correct: real
    requirement-registry traceability gates a validated Project Genome,
    which drives the Organization Composer, which is persisted alongside
    a Capability-Gateway-authorized Project OS scaffold, cheapest-capable
    model routing, and durable state — all readable back after a
    simulated process restart.
  source_baseline: "BASELINE-V1 section 304, 305, 306"
  category: P0
  priority: HIGH
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/project-lifecycle/orchestrator.ts"
  test_refs:
    - "proofs/e2e-p0-kernel/proof.test.ts"
    - "proofs/p0-integrated-flow/proof.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/e2e-p0-kernel/proof.test.ts"
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    P1 fix (11th independent review round targeted audit, same class as
    runtime/models/gateway.ts's "caller context mutation can change cost
    ownership during invocation"): while auditing for other instances of
    this class, found that `bootstrapProject()` reads
    `input.modelRegistry`/`input.costEngine`/`input.budgetLimits`/
    `input.stateStore` from its `input` parameter AFTER its own first
    `await` (`gateway.authorize(...)`, which — even though the wrapped
    `scaffoldProjectOs()` call is itself synchronous — still yields at
    least one genuine microtask tick, per JS async-function semantics). A
    caller retaining a reference to `input` and scheduling a mutation via
    another microtask (e.g. `Promise.resolve().then(() => { input.costEngine
    = attackerControlled })`) could redirect this bootstrap's accounting,
    model routing, or persisted state to an entirely different,
    caller-controlled object. Fixed the same way as gateway.ts: every
    field `bootstrapProject()` needs (`genomeCandidate`, `baseDir`,
    `policy`, `modelRegistry`, `budgetLimits`, `costEngine`, `stateStore`,
    `risk`) is destructured into local `const`s as the very FIRST thing
    the function does — before `parseProjectGenome()`, before anything —
    and `input.xxx` is never read again afterward. Regression tests prove:
    mutating `input.costEngine` (via a microtask scheduled BEFORE calling
    `bootstrapProject()`, the ordering most favorable to a caller actually
    winning such a race) has zero effect on which CostEngine records the
    real, non-zero cost of a deliberately non-free test model; the same
    holds for `input.modelRegistry` (an emptied swapped-in registry would
    make routing fail entirely if it were ever consulted) and
    `input.stateStore` (a swapped-in fake store that would have recorded
    writes stays untouched). Verified via a temporary bypass (reverting
    the three post-await reads to `input.modelRegistry`/`input.costEngine`/
    `input.stateStore` directly) — confirmed exactly these 3 new tests
    fail against the bypassed code (the modelRegistry one throwing
    NoCapableModelError, the stateStore one recording 3 writes into the
    fake store instead of 0), then reverted.

    P1 fix (12th independent review round, "bootstrap retains mutable
    budget configuration across await"): Codex reproduced the 11th
    round's fix being insufficient for `budgetLimits` specifically —
    unlike `costEngine`/`modelRegistry`/`stateStore` (class instances,
    where capturing the REFERENCE into a local `const` is sufficient
    protection since the object's own internal state doesn't change based
    on which fields a caller pokes at from outside), `budgetLimits` is a
    PLAIN DATA object. Capturing its reference does nothing to stop a
    caller mutating its FIELDS: `new BudgetGuard(costEngine, budgetLimits
    ?? {})` reads `budgetLimits.perTaskUsd` (etc.) at construction time,
    which happens AFTER `bootstrapProject()`'s first `await
    gateway.authorize(...)`. A caller supplying `budgetLimits =
    {perTaskUsd: 0}`, then mutating `budgetLimits.perTaskUsd = 1` while
    that first await was pending, caused the eventual `BudgetGuard` to be
    constructed from the MUTATED $1 ceiling, silently bypassing the
    originally-intended $0 ceiling. Fixed: `budgetLimits` is now copied
    into a frozen, detached snapshot (`budgetGuardLimits = budgetLimits ?
    freezeRecord({...budgetLimits}) : {}`) at the exact same point every
    other field is captured — before the first `await` — and
    `budgetGuardLimits` (never the original `budgetLimits` reference) is
    what `BudgetGuard` is constructed from; `budgetLimits` itself is never
    read again afterward. Regression tests (orchestrator.test.ts, new
    describe block) prove: an initial $0 `perTaskUsd` ceiling mutated to
    $1 while bootstrap is pending still correctly rejects a non-free
    model's spend with `BudgetExceededError` (the exact reproduction), the
    reverse direction (an initial $1 ceiling mutated down to $0 mid-flight)
    does not retroactively block a spend the ORIGINAL $1 ceiling genuinely
    allowed, and two concurrent `bootstrapProject()` calls sharing ONE
    caller-owned `budgetLimits` object remain isolated — each uses
    whichever ceiling was in effect at its OWN synchronous entry point,
    never a value the other call's later mutation introduced. Verified via
    a temporary bypass (reverting to `new BudgetGuard(costEngine,
    budgetLimits ?? {})`, reading the unsnapshotted object directly) — ran
    the 3 new tests and confirmed exactly this predicted failure: the
    exact-reproduction test's promise resolved successfully instead of
    rejecting (the mutated $1 ceiling was consulted, so a full
    `bootstrapProject()` result — genome, scaffold, modelDecision,
    totalCostUsd: 0.6 — came back where `BudgetExceededError` should have
    been thrown), and 3 of 3 new tests failed in total (all three exercise
    this exact snapshot property from different angles); then the bypass
    was reverted and all 26 orchestrator tests re-confirmed passing.

    Targeted cross-cutting audit (12th independent review round, scoped
    to exactly this session's 5 "authorize/snapshot one value -> await ->
    reread mutable caller value" findings plus the general pattern, within
    the P0 model/budget/bootstrap execution path only): re-examined every
    async function in `runtime/models/gateway.ts`, `router.ts`,
    `registry.ts`, `runtime/budget/budget.ts`, `runtime/cost/
    cost-engine.ts`, this file's `bootstrapProject()`, `runtime/
    policy-engine/policy-engine.ts`, and `runtime/capability-gateway/
    gateway.ts`'s `authorize()` for any caller-supplied object/array read
    both before and after an `await` (or inside an awaiting loop) for a
    security/cost/ownership-relevant purpose. `registry.ts`,
    `budget.ts`'s own methods (`reserve`/`commit`/`release`/`spend`),
    `cost-engine.ts`, and `policy-engine.ts`'s `evaluate()` are all fully
    synchronous — no `await` exists inside them, so this class of race is
    structurally impossible there regardless of parameter mutability.
    `CapabilityGateway.authorize()` reads `action.actionType`/
    `.description` only on the DENY/APPROVAL_REQUIRED paths (which never
    call `execute()`); on the ALLOW path no `action` field is read again
    after `execute()` starts. No new genuine instance of the pattern was
    found in this scope beyond the 5 already fixed this round — the
    pattern is fully closed here. Per the review's explicit instruction,
    this audit did not expand into unrelated architecture work.

    P2 fix (13th independent review round, "bootstrap validates budget
    limits after filesystem mutation"): Codex reproduced `perTaskUsd: NaN`
    being ultimately rejected with `InvalidBudgetLimitError`, but only
    once `new BudgetGuard(costEngine, budgetGuardLimits)` ran — by which
    point `scaffoldProjectOs()` had ALREADY created 24 real directories on
    disk. `BudgetLimits` validation had never been anything more than an
    implicit side effect of `BudgetGuard`'s own constructor; no caller
    ever validated it eagerly, up front, before performing its own side
    effects. Fixed: `runtime/budget/budget.ts` gained an exported
    `assertValidBudgetLimits(limits)` (the SAME four `assertValidLimit()`
    calls the constructor already made, now a shared, reusable primitive
    — the constructor itself now just calls it, removing the duplication),
    and `bootstrapProject()` calls it on `budgetGuardLimits` immediately
    after the config snapshot is captured — still before
    `parseProjectGenome()`/`assertFilesystemConfinement()`/
    `gateway.authorize(() => scaffoldProjectOs(...))`, i.e. before this
    function's FIRST filesystem mutation of any kind. Regression tests
    (orchestrator.test.ts, new describe block) prove: NaN/Infinity/
    negative ceilings (across different ceiling kinds) are all rejected
    with ZERO filesystem mutations (the base temp directory stays
    completely empty — confirmed via `readdirSync`), an invalid ceiling
    among otherwise-valid ones is still caught, a genuinely valid
    `budgetLimits` object still creates the full expected project
    structure (no regression), and a caller mutating budgetLimits from
    valid to invalid WHILE bootstrap is already pending has zero effect
    (validation already ran against the ORIGINAL snapshot). Verified via a
    temporary bypass (removing the early `assertValidBudgetLimits()` call)
    — confirmed exactly the 4 exact-reproduction tests fail, each with a
    real, non-empty project directory present where zero mutations were
    expected, then reverted.

    Targeted cross-cutting audit (13th independent review round, scoped to
    exactly this session's 6 findings' root-cause classes, within the P0
    model/router/budget/bootstrap execution path only): re-examined every
    file in that path for (1) authorized identity redefined by a response/
    caller object, (2) a failure state leaving a resource releasable, (3)
    an ownership field silently dropped between layers, (4) a caller-owned
    mutable object reread after an await instead of using a pre-await
    snapshot, (5) an ownership check covering only some of a resource's
    authoritative dimensions, (6) a side effect performed before
    validating configuration whose failure would waste it. Classes 1, 2,
    4, and 5 were confirmed fully closed with no further instance in
    scope. Two genuine findings were surfaced:
    - Class 6 (genuine, FIXED): `bootstrapProject()`'s
      `router.selectModel()` (throws `NoCapableModelError` if the
      registry has no capability-matching model) and the real
      `budget.spend()` call (throws `BudgetExceededError` once the
      SPECIFIC selected model's real cost is checked against a
      perfectly-VALID-but-insufficient ceiling) both still ran AFTER
      `scaffoldProjectOs()`'s real directory creation — a rejection from
      either would still leave an orphaned, half-bootstrapped project
      directory on disk, the identical root-cause shape as the
      `budgetGuardLimits` finding above, just triggered by a legitimate
      runtime-enforcement rejection rather than malformed static config.
      Fixed conservatively: `selectModel()` (pure, no side effects, no
      policy dependency) now runs BEFORE the scaffold, and a NEW,
      NON-MUTATING `budget.assertWithinBudget()` pre-check (the existing
      check-only method BudgetGuard already exposed for exactly this
      purpose — bkz. `runtime/budget/budget.ts`) also runs before the
      scaffold using the now-known selected model's real cost. The
      AUTHORITATIVE `budget.spend()` call deliberately STAYS in its
      original position, after the policy-gated scaffold succeeds — this
      preserves the existing (if previously accidental) "a policy DENY
      blocks the spend too" property, which reordering `spend()` itself
      would have broken (a DENY would then let spend() run with nothing
      ever scaffolded). Regression tests prove: a registry with no
      capability-matching model is rejected with ZERO filesystem
      mutations, a budget too tight for the selected model's REAL (not
      malformed) cost is likewise rejected with ZERO mutations, a policy
      DENY still blocks BOTH the scaffold AND the spend (the new
      pre-check does not weaken this), and a genuinely valid,
      sufficiently-budgeted bootstrap still creates the full expected
      structure. Verified via a temporary bypass (reverting
      `selectModel()`/`assertWithinBudget()` back to their original
      post-scaffold position) — confirmed exactly the 2 exact-reproduction
      tests fail (each with a real orphaned project directory present),
      then reverted.
    - Class 3 (genuine, NOT fixed — scoping decision recorded here):
      `budget.ts`'s `CostScope`/`ReservationOwnership` and its own
      `commit()` ownership check fully support an `agentId` dimension
      (this round's finding #5 fix), but NEITHER `ModelInvocationContext`
      (gateway.ts) NOR `RoutingRequest` (router.ts) — nor
      `BootstrapProjectInput` (orchestrator.ts) — has an `agentId` field
      at all, and none of `gateway.invoke()`'s `reserve()`/`commit()`
      calls, `routeAndExecute()`, or `bootstrapProject()`'s `budget.spend()`
      call ever supply one. This makes `commit()`'s `agentId` ownership
      check a permanent no-op (`undefined === undefined`) for every
      invocation reachable through the public model-invocation/bootstrap
      path. This is DIFFERENT from the just-fixed `projectId` gap
      (finding #3): `projectId` already existed as a concept in BOTH
      `RoutingRequest` and `ModelInvocationContext` and was simply not
      threaded between them — a genuine "dropped in transit" bug fixable
      by adding one field and one pass-through line. An "agent" concept,
      by contrast, does not exist ANYWHERE in the model-invocation/
      bootstrap execution path today (only in the lower-level `CostScope`/
      `CostEntry` primitives) — introducing it end-to-end would mean
      adding a new field to two-plus public interfaces and deciding what
      an "agent" even means at the orchestration layer, which is
      architecture/feature work, not a bug fix within existing plumbing.
      Per the review's explicit instruction not to expand into unrelated
      architecture work, this was NOT fixed this round. Recorded here so
      a future session (or an explicit Founder/review request to add
      agent-scoped model invocation) does not need to re-discover it.

    P1 fix (24th independent review round, finding 6, "authorize scaffold before paid model work"): the
    `project.scaffold` policy check used to run AFTER the real, guarded model invocation — so a bootstrap that
    was never going to be authorized to scaffold (an explicit DENY, or an unresolved APPROVAL_REQUIRED) still
    incurred a genuine, paid model call and its real cost first, before being rejected and discarding the whole
    scaffold. Required ordering (baseline section 147): authorization -> model call (if actually required) ->
    filesystem mutation -> reconciliation/accounting. Fixed by evaluating the exact same `project.scaffold`
    `CapabilityGateway.authorize()` decision, via a no-op `execute`, BEFORE the model invocation — this call's
    only job is to gate progression on the same decision the real scaffold call (unchanged, still immediately
    adjacent to the actual `scaffoldProjectOs()` mutation) will use. Three new regression tests prove: a DENY on
    `project.scaffold` blocks the bootstrap with zero model invocations, zero cost recorded, and zero filesystem
    mutation, even though the model's own `model.invoke` action would independently be ALLOWED; an
    APPROVAL_REQUIRED scaffold (risk 5) behaves identically; and the ALLOWED happy path is unaffected (model
    still invoked exactly once, scaffold still created). Verified via a temporary bypass (removing the new
    pre-check) — confirmed the exact predicted 2 tests failed (model invoked once despite the scaffold being
    denied/approval-required), then reverted and re-confirmed all passing.

