- id: UASF-REQ-0036
  title: Cache / reuse layer
  description: >
    Before recomputation, check durable cache for still-valid prior results
    and reuse them instead of recomputing.
  source_baseline: "BASELINE-V1 section 77, 78, 306 (Proof G)"
  category: P0
  priority: HIGH
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/cache/cache.ts"
    - "runtime/cache/file-cache.ts"
    - "runtime/state/file-store.ts"
  test_refs:
    - "runtime/cache/__tests__/cache.test.ts"
    - "runtime/cache/__tests__/file-cache.test.ts"
  proof_refs:
    - "proofs/cache-reuse/proof.test.ts"
  security_refs: []
  notes: >
    P2 finding (Codex, 2nd round): the description says "durable cache",
    but the only implementation was runtime/cache/cache.ts, an in-memory
    Map — proving same-process reuse, not restart durability. PROOF_VERIFIED
    was overstated relative to that evidence.

    Fixed via option (A): added runtime/cache/file-cache.ts, a FileCache<T>
    backed by the existing StateStore/FileStateStore infrastructure (same
    interface as runtime/state/file-store.ts used for project state) —
    every set() persists the full entry map to a JSON file, and every
    get()/size() reads it back from disk, so no shared in-memory reference
    is required across instances. Restart-recovery proof added in
    proofs/cache-reuse/proof.test.ts: a FileCache+FileStateStore instance
    computes and persists a result inside a block scope and is then
    discarded (no reference retained), and a SECOND, independently
    constructed FileCache+FileStateStore instance pointed at the same file
    path reuses the persisted result without recomputation — genuinely
    proving restart durability, not same-instance reuse. Equivalent
    restart-recovery tests also added directly in
    runtime/cache/__tests__/file-cache.test.ts (including expired-entry
    and size() cases across the simulated restart). The original in-memory
    Cache remains available for callers that explicitly do not need
    cross-process durability (e.g. the cache-reuse proof's original
    same-process test).

    P2 fix (6th independent review round, "durable cache loses __proto__
    keys"): FileCache persisted entries as a plain JS object
    (`Record<string, CacheEntry<T>>`) and accessed them via bracket
    assignment/lookup (`all[key] = ...`, `all[key]`). Since the cache API
    accepts arbitrary string keys, `set("__proto__", value)` never created
    a real own property — `Object.prototype`'s `__proto__` accessor
    intercepted the assignment instead, so the persisted representation
    stayed silently `{}` and `get("__proto__")` always returned undefined.
    Fixed: the persisted representation is now an array of `[key, entry]`
    tuples, and the in-memory structure is a `Map<string, CacheEntry<T>>`
    — neither an array nor a Map ever routes a key through JS object
    property/accessor semantics, so `__proto__`, `constructor`, and
    `prototype` all behave as ordinary keys with no special case needed.
    Regression tests prove: `set("__proto__", ...)` persists and an
    immediate get() returns it, a new FileCache instance (same path)
    recovers it, a genuinely separate FileCache+FileStateStore instance
    (simulated separate process) recovers it, the persisted representation
    is never silently empty, no prototype pollution occurs (a fresh,
    unrelated plain object is unaffected), `constructor`/`prototype` also
    behave as ordinary keys, normal and reserved-name keys coexist
    correctly with size() reflecting all of them, and the pre-existing
    durable cross-process cache proof (proofs/cache-reuse/proof.test.ts)
    still passes unchanged. Confirmed via git-stash that 5 of the new
    tests fail against the pre-fix (plain-object) representation with
    exactly the `{}`-stays-empty symptom Codex described.

