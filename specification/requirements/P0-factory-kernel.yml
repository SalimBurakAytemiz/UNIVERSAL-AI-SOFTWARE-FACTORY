- id: UASF-REQ-0010
  title: Founder decision ledger
  description: Persist Founder decisions with id/status/supersession tracking.
  source_baseline: "BASELINE-V1 section 46"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/decisions/decision-ledger.ts"
  test_refs:
    - "runtime/decisions/__tests__/decision-ledger.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    Now persists via runtime/state/file-store.ts (saveTo/loadFrom) — no
    longer in-memory only; a round-trip through a fresh store instance is
    tested.

    P1 cross-cutting fix (3rd independent review round, found during audit
    triggered by the ApprovalWorkflow finding below): get()/allFor()
    returned the actual internal decision object, so a caller could do
    `ledger.get(id).status = "SUPERSEDED"` and bypass supersede() entirely —
    the exact same bug class as the approval-state finding, applied to "never
    silently overwrite, only supersede" instead of "never execute without
    approval". Fixed: record()/get()/allFor() now return a frozen, detached
    copy (runtime/util/immutable.ts); internal transitions still happen on
    the private authoritative object inside supersede(). Regression tests
    prove a mutation attempt on a returned decision throws (frozen) and never
    changes what get() subsequently returns. Confirmed via git-stash that
    these tests fail against the pre-fix code.

    P1 fix (5th independent review round, "repeated supersession corrupts
    decision history"): supersede() never checked that `oldDecisionId`'s
    CURRENT status was ACTIVE before transitioning it. Codex reproduced
    `A -> B` followed by `A -> C`: the second call created a brand-new C
    record (status ACTIVE, via record()) and silently overwrote A's
    `supersededBy` from B to C — leaving BOTH B and C simultaneously
    ACTIVE, each implicitly claiming to be "the" current replacement for A,
    corrupting the "exactly one current decision" invariant. Fixed:
    supersede() now throws a new DecisionAlreadySupersededError (naming the
    decision's actual current status and existing supersededBy) BEFORE any
    mutation or new record is created, unless `oldDecisionId` is currently
    ACTIVE. A decision can only evolve by superseding its CURRENT active
    replacement (A -> B -> C), never by re-replacing an already-superseded
    decision (A -> B and A -> C, branching) — the spec does not define
    branching, so this is never silently allowed. Regression tests prove:
    A -> B works, a second A -> C is rejected, the original A -> B link
    survives the rejected attempt unchanged, B remains the sole ACTIVE
    decision throughout, B -> C (evolving the current decision) works,
    the resulting A -> B -> C chain has exactly one ACTIVE decision (C),
    the rejected supersession creates no partial record (id "c" is never
    recorded at all when the first attempt used that id), and the error
    message reports the decision's real current state. Confirmed via
    git-stash that 5 of these tests fail against the pre-fix code with
    exactly the branching corruption Codex described.

