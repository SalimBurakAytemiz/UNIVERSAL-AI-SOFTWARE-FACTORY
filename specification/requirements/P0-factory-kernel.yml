  notes: >
    Includes findUnowned() enforcing baseline section 127 (every service
    should have a recorded owner); in-memory only, no real CMDB integration.

    P1 cross-cutting fix (3rd independent review round): get()/all() returned
    the internal ServiceRecord objects directly, so a caller could set
    `record.status = "DOWN"` on a returned reference and bypass
    updateStatus() entirely. Fixed: register() stores an independent copy of
    the caller's input, and get()/all() return frozen, detached snapshots
    (runtime/util/immutable.ts). Regression tests prove a mutation attempt on
    a returned record throws and that mutating the object originally passed
    to register() does not affect the catalog's own copy. Confirmed via
    git-stash that these tests fail against the pre-fix code.

