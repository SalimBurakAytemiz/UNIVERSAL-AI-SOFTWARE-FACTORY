- id: UASF-REQ-0014
  title: Technology registry (foundation)
  description: Track languages/frameworks/engines with EXPERIMENTAL..FORBIDDEN lifecycle.
  source_baseline: "BASELINE-V1 section 53, 54"
  category: P0
  priority: LOW
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/technology-registry/registry.ts"
  test_refs:
    - "runtime/technology-registry/__tests__/registry.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    FORBIDDEN/DEPRECATED technologies are excluded from recommendable() at
    the data-model level; no seeded default registry or Technology
    Decision Engine yet.

    P1 fix (4th independent review round, targeted follow-up ownership
    audit): register() stored the caller's object reference and all()
    returned internal Map values directly — a caller could mutate a
    registered (or returned) technology's `lifecycle` field from
    FORBIDDEN/DEPRECATED to something recommendable, bypassing bölüm
    53-54's "never auto-recommended" rule without going through any
    controlled transition. Fixed: register() stores an independent, frozen
    copy; all() returns frozen, detached snapshots. Regression tests prove
    mutating the object passed into register(), or a record returned by
    all(), cannot un-forbid a technology. Confirmed via git-stash that
    these tests fail on the pre-fix code.

    P1 fix (24th independent review round, "technology registry must reject uncontrolled overwrites"):
    `register()` still unconditionally accepted a SECOND call for an existing id, silently replacing the
    record wholesale — including replacing a FORBIDDEN technology with a fresh PREFERRED one, completely
    bypassing bölüm 53-54's governance without even needing the object-mutation route already closed above.
    Fixed: `register()` now throws `DuplicateTechnologyIdError` for any id collision, regardless of target
    lifecycle; the only way to change an EXISTING technology's lifecycle is the new `transitionLifecycle(id, to,
    reason)` method, which requires a non-blank `reason` (audited via an optional `AuditLog`,
    `TECHNOLOGY_LIFECYCLE_TRANSITIONED`) and refuses (`InvalidTechnologyLifecycleTransitionError`) any
    transition OUT of DEPRECATED/FORBIDDEN back to a recommendable lifecycle — a one-way governance gate,
    consistent with decision-ledger.ts's "no un-superseding" philosophy. Eight new regression tests prove: the
    exact FORBIDDEN->PREFERRED `register()` bypass is refused; any duplicate id is refused regardless of target
    lifecycle; normal forward transitions work; transitioning INTO FORBIDDEN from any prior lifecycle works;
    transitioning OUT of FORBIDDEN or DEPRECATED is refused; an unknown id and a blank reason are both refused;
    and a real transition is audited with the correct from/to/reason. Verified via a temporary bypass (disabling
    the governance transition guard) — confirmed the exact predicted 2 tests failed, then reverted and
    re-confirmed all passing.

    P1 targeted-audit fix (26th independent review round, same root class as finding 2, "cost ledger state must
    be runtime-private" — Codex's audit scope named this class explicitly): the internal `technologies` Map still
    used TypeScript's compile-time-only `private` keyword, reachable at runtime via `(registry as
    any).technologies`. Since `transitionLifecycle()`'s entire purpose is refusing to walk a DEPRECATED/FORBIDDEN
    technology back to a recommendable lifecycle, this let a consumer bypass that governance rule completely with
    no `reason`, no `InvalidTechnologyLifecycleTransitionError`, and no audit trail. Converted to a genuine
    ECMAScript `#technologies` private field. Three new regression tests prove the field is unreachable via
    property access or any reflection API, and that a plain JS consumer cannot un-forbid a technology this way.
    Verified via a temporary bypass (reverting to `private technologies`) — confirmed exactly the 3 predicted
    tests failed, then reverted and re-confirmed all tests passing.

