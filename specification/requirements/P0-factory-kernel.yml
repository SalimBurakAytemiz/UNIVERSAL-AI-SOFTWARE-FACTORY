- id: UASF-REQ-0029
  title: Cost engine
  description: Track cost per task/agent/model/provider call; no silent spending.
  source_baseline: "BASELINE-V1 section 69"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/cost/cost-engine.ts"
    - "runtime/project-lifecycle/orchestrator.ts"
  test_refs:
    - "runtime/cost/__tests__/cost-engine.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    CostEngine now takes an injectable clock (constructor `now` param) so
    tests can simulate specific timestamps, and gained totalInWindow() for
    time-scoped totals — both added to support real dailyUsd/monthlyUsd
    budget enforcement (see UASF-REQ-0030).

    BLOCKER fix (Codex, 2nd round): CostEngine.record() itself accepted
    NaN, Infinity, -Infinity, and negative amountUsd values, letting a
    direct record() call (bypassing BudgetGuard) corrupt totals or
    manufacture negative spend. Fixed: added exported
    assertValidMonetaryAmount() (rejects non-finite and negative values,
    zero is valid) and record() now calls it before pushing any entry —
    so direct CostEngine.record() calls are protected even when
    BudgetGuard is bypassed entirely. Regression tests added for NaN,
    Infinity, -Infinity, and negative amounts (each confirmed to throw
    InvalidMonetaryAmountError and leave `engine.all()` empty), plus
    direct unit tests of assertValidMonetaryAmount as the shared
    validation primitive.

- id: UASF-REQ-0030
  title: Budget engine / cost ceilings
  description: >
    Task/run/project/daily/monthly cost ceilings that stop or block
    execution before a limit is exceeded, preventing runaway spend.
  source_baseline: "BASELINE-V1 section 70, 71, 72, 306 (Proof E)"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/budget/budget.ts"
    - "runtime/cost/cost-engine.ts"
    - "runtime/audit/audit-log.ts"
  test_refs:
    - "runtime/budget/__tests__/budget.test.ts"
  proof_refs:
    - "proofs/budget-ceiling/proof.test.ts"
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Independent review (Codex) found dailyUsd/monthlyUsd were defined in
    BudgetLimits but never checked at runtime — only perTaskUsd/perRunUsd
    were enforced. Fixed: BudgetGuard now checks all four ceilings, with
    dailyUsd/monthlyUsd computed as real UTC-calendar-period windows via
    CostEngine.totalInWindow(), scoped by projectId when given. Test
    coverage added: same-period blocking, boundary (exactly-at-ceiling
    allowed, one cent over blocked), rollover (a new UTC day/month resets
    the ceiling even though lifetime spend is far higher, verified with an
    injectable clock rather than waiting on real time), per-project
    scoping, a synchronous-burst test demonstrating the check-then-record
    sequence has no `await` between the two steps (so no interleaved call
    can race past the ceiling), and an AuditLog integration recording both
    allowed and blocked budget checks as durable, hash-chained evidence
    (BudgetGuard's optional third/fourth constructor params: `now` and
    `auditLog`).

    BLOCKER fix (Codex, 2nd round): assertWithinBudget() checked the
    projected amount against ceilings arithmetically but never validated
    that the amount (or the configured limits themselves) were finite and
    non-negative — a NaN or negative projectedAmountUsd, or a NaN/negative
    limit, could bypass every ceiling check (NaN comparisons are always
    false; a negative amount can manufacture headroom). Fixed:
    assertWithinBudget() now calls assertValidMonetaryAmount() on the
    projected amount before any ceiling check, failing closed (throwing
    InvalidMonetaryAmountError, logging BUDGET_INVALID_AMOUNT_REJECTED to
    the audit trail) without mutating any state; the BudgetGuard
    constructor now validates all four limits (perTaskUsd, perRunUsd,
    dailyUsd, monthlyUsd) via a new assertValidLimit() helper, throwing
    InvalidBudgetLimitError for NaN/Infinity/-Infinity/negative ceilings.
    Regression tests added for: NaN/Infinity/-Infinity/negative spend
    amounts (each leaves total spend at 0, not NaN), a negative amount
    failing to manufacture headroom, correct enforcement continuing after
    a rejected invalid spend, NaN/Infinity/-Infinity/negative limits
    rejected at construction for all four ceiling kinds, a direct
    CostEngine.record() bypass still being protected by CostEngine's own
    validation (see UASF-REQ-0029), an exact-boundary-vs-just-over-boundary
    test, and an audit-log assertion that a rejected invalid amount is
    recorded as BUDGET_INVALID_AMOUNT_REJECTED.

