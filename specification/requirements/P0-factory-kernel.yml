- id: UASF-REQ-0016
  title: Project organization composer (foundation)
  description: Compose minimum justified project organization from Project Genome + requirements + risk + budget.
  source_baseline: "BASELINE-V1 section 34"
  category: P0
  priority: LOW
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/organization-composer/composer.ts"
    - "runtime/project-lifecycle/orchestrator.ts"
  test_refs:
    - "runtime/organization-composer/__tests__/composer.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Rule-based composition with a recorded rationale per activated team
    (tests assert unrelated teams are never added). composeOrganizationFromGenome()
    now consumes a real, validated Project Genome directly; budget input is
    still not wired in.

    P2 fix (8th independent review round, "prototype names crash
    schema-valid project families"): `BASE_TEAMS_BY_FAMILY` was a plain
    object (`Record<string, readonly string[]>`) accessed via
    `BASE_TEAMS_BY_FAMILY[input.projectFamily]`. Since the Project Genome
    schema only requires `project.family` to be ANY string,
    schema-valid-but-prototype-named values ("constructor", "toString",
    "__proto__") read an INHERITED Object.prototype value instead of
    `undefined` — truthy, so `?? DEFAULT_BASE_TEAMS` never caught it — and
    `new Set(inheritedFunctionOrObject)` (not iterable) threw a TypeError,
    crashing bootstrap. Fixed: the lookup table is now a `Map`, whose
    `.get()`/`.has()` never read the JS prototype chain, so any string key
    (including prototype names) correctly falls back to
    `DEFAULT_BASE_TEAMS` when undefined. Regression tests prove:
    "constructor", "toString", "__proto__", and "hasOwnProperty" families
    all resolve to the fallback teams without crashing, known families
    still resolve their correct specific teams (no regression), a
    prototype-named family combined with a capability requirement still
    adds the required team via the documented rule, no prototype pollution
    occurs, and a full composeOrganizationFromGenome()/parseProjectGenome()
    bootstrap with a "constructor" family completes per the fallback
    contract. Confirmed via git-stash that 7 of these tests fail against
    the pre-fix code with exactly the TypeError Codex described.

