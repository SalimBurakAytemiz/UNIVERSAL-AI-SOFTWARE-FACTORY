- id: UASF-REQ-0027
  title: Cheapest-capable-model router
  description: >
    Classify task complexity/risk/required capabilities, select the
    lowest-cost model in the registry that satisfies them; never select a
    premium model for a trivial task.
  source_baseline: "BASELINE-V1 section 62, 63, 306 (Proof A/B)"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/models/router.ts"
  test_refs:
    - "runtime/models/__tests__/router.test.ts"
  proof_refs:
    - "proofs/cheapest-capable-model/proof.test.ts"
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Independent review (Codex) found that escalation (in routeAndExecute)
    was computed from initialDecision.requiredTier (the risk-derived
    minimum) rather than initialDecision.model.tier (the model actually
    selected). When a capability requirement forces a pricier model than
    the risk floor demands, this could re-select the exact same (or an
    equally weak) model on "escalation" instead of genuinely moving up a
    tier. Fixed in runtime/models/router.ts; regression tests in
    router.test.ts construct a registry where only STANDARD/PREMIUM-tier
    models support a capability at risk 0, and assert escalation lands on
    PREMIUM (never re-selecting the STANDARD model), that premium fallback
    is still blocked by default in this scenario, and that being already
    at the top tier throws NoCapableModelError instead of looping. The
    pre-fix code was confirmed to fail these exact tests before the fix
    (reverted and re-run manually during review).

    Second-round finding (Codex): once escalation began, the escalated
    (fallback) model's response was invoked but never passed back through
    `validate()` — routeAndExecute returned it unconditionally, meaning an
    invalid response from a pricier model could bypass validation entirely.
    Fixed: routeAndExecute now validates every candidate, including every
    escalation step, in a bounded loop over TIER_ORDER; if the top tier
    (CRITICAL_REVIEW) is reached and still fails validation, it now throws
    the new EscalationExhaustedError (fail closed) rather than returning
    unvalidated output. Regression tests added: primary fails/first
    escalation passes (validate called on both, in order), primary and all
    escalations fail -> EscalationExhaustedError after validating every
    tier exactly once, an invalid PREMIUM-tier fallback cannot be accepted
    merely because it is pricier (validation only passes at CRITICAL_REVIEW),
    and premium fallback policy is still enforced before any escalation is
    attempted (PremiumFallbackBlockedError after exactly one validate call).
    Confirmed via git-stash that these tests fail against the pre-fix code.

    P1 fix (9th independent review round, "fallback execution bypasses
    policy and budget enforcement"): Codex reproduced routeAndExecute()
    invoking EVERY candidate — the initial one AND every escalation/
    fallback step — via a direct gateway.invoke() call, with NO
    PolicyEngine or BudgetGuard consultation anywhere, and no cost
    recorded for a candidate whose invocation succeeded but whose output
    later failed validate(). `allowPremiumFallback` is a routing-level
    permission flag ("fallback may be considered"), never an authorization
    substitute for the same policy/budget gate every other risky Factory
    action passes through (bölüm 147). Fixed: routeAndExecute() now takes
    REQUIRED `policy: PolicyEngine` and `budget: BudgetGuard` parameters;
    every candidate invocation goes through a new private
    invokeAuthorized() helper that (1) evaluates the SAME
    CapabilityGateway/PolicyEngine used elsewhere in the Factory (DENY/
    APPROVAL_REQUIRED throw and the provider is never called), (2) checks
    the projected cost against BudgetGuard BEFORE invoking (insufficient
    budget blocks the call with zero provider invocations), and (3)
    records the ACTUAL incurred cost via BudgetGuard.spend() immediately
    after a successful invocation — BEFORE validate() runs — so a
    candidate whose output later fails validation is still correctly
    accounted for. Regression tests prove: a policy-DENYed fallback
    candidate is never invoked, a fallback candidate requiring approval is
    not invoked without one, insufficient budget blocks a fallback BEFORE
    any provider call, the cost of a fallback invocation is recorded even
    though its output later fails validation, multiple failed fallback
    attempts cannot silently exceed the budget ceiling, and
    allowPremiumFallback=true is not itself an authorization (a
    default-deny policy blocks even the INITIAL candidate). All prior
    escalation/validation/cheapest-routing regression tests continue to
    pass unchanged (updated only to supply the now-required policy/budget
    arguments). Confirmed via a temporary bypass of the new authorization
    wrapper (keeping the new signature, since the OLD 5-argument signature
    cannot be meaningfully git-stashed against calls now using 7
    arguments) that all 6 new tests fail with exactly the bypass Codex
    described, then restored.

    P1 fix (10th independent review round, "public ModelGateway.invoke()
    bypasses enforcement"): Codex showed that protecting routeAndExecute()
    alone does not guarantee the system-wide invariant — `gateway.invoke()`
    itself was still a PUBLIC method with no policy/budget awareness at
    all, reachable directly by any caller (the e2e-p0-kernel proof did
    exactly this, calling gateway.invoke() and a separate manual
    budget.spend()). Fixed at the architecture level, not by adding
    another optional parameter: the entire guard (PolicyEngine ->
    BudgetGuard reservation -> provider call -> commit/release
    reconciliation) now lives INSIDE `ModelGateway.invoke()` itself, which
    REQUIRES a `ModelInvocationContext` (policy + budget, both
    non-optional — this does not compile without them). The raw provider
    call was moved to a true ECMAScript private method (`#rawInvoke`, not
    TypeScript's compile-time-only `private`) so it is genuinely
    inaccessible from outside the class at runtime, not just discouraged
    by convention. router.ts's `invokeAuthorized()` is now a thin adapter
    delegating to this same gateway.invoke() — there is exactly ONE path
    to a real provider in this codebase. See UASF-REQ-0024 (Model gateway)
    for the gateway-side notes and regression test list.

    P1 fix (10th independent review round, "concurrent model invocations
    can exceed budgets"): see UASF-REQ-0030 (Budget engine / cost
    ceilings)'s notes for the reservation/reconciliation model this
    router now relies on via gateway.invoke() — routeAndExecute() itself
    required no code change beyond what the paragraph above already
    describes, since the atomicity fix lives entirely in
    BudgetGuard.reserve()/commit()/release().

    P1 fix (12th independent review round, "routing retries can change
    execution ownership and fallback permission"): Codex reproduced
    `request`/`options` (both caller-owned, mutable objects) being read
    DIRECTLY across MULTIPLE `await` boundaries inside routeAndExecute() —
    the initial call read `request.taskId`/`.risk`/`.requiredCapabilities`
    and `options.allowPremiumFallback` before the first await, but the
    escalation loop (running only after that first await resolved) read
    `request`/`options` AGAIN via `selectModel(request, nextTier)` and
    `invokeAuthorized(decision, request, ...)`. A caller mutating
    `request.taskId` (A -> B) or flipping `options.allowPremiumFallback`
    (false -> true) WHILE the first candidate's provider call was still
    pending could make a subsequent escalation attempt run under a
    different task ownership than the one ever authorized, or exercise a
    fallback permission never actually granted at routing start — splitting
    cost across two owners and letting a per-task ceiling be bypassed by
    repeated calls. Fixed: `request`/`options` are captured into frozen,
    detached snapshots (`routingScope = freezeRecord({...request})`, and
    `allowPremiumFallback` normalized into a local const) as the VERY
    FIRST thing routeAndExecute() does, before `selectModel()` is even
    called the first time; every `selectModel()`/`invokeAuthorized()` call
    — initial AND every escalation step — uses ONLY `routingScope`/the
    captured boolean, never the original `request`/`options` parameters
    again. Regression tests (router.test.ts, new describe block) prove:
    mutating `request.taskId` mid-flight keeps every escalation step and
    all recorded cost under the originally-authorized task, flipping
    `options.allowPremiumFallback` from false to true mid-flight does not
    grant fallback permission that was never authorized at call start (and
    the reverse: flipping true to false does not retroactively revoke
    already-authorized fallback), mutating `request.requiredCapabilities`
    mid-flight cannot make an otherwise-ineligible cheaper candidate
    wrongly eligible, mutating `request.risk` has no effect (an
    already-safe property, since risk-based tier derivation only ever runs
    on the FIRST `selectModel()` call — escalation always passes
    `nextTier` explicitly), and two concurrent `routeAndExecute()` calls
    sharing one mutated `request` object remain fully isolated from each
    other. Verified via a temporary bypass (reverting all snapshot reads
    back to reading `request`/`options` directly at all 6 call sites) —
    confirmed exactly 4 of the 6 new tests fail (task-mutation and both
    allowPremiumFallback-flip tests, plus the requiredCapabilities-mutation
    test; the risk-mutation and concurrent-isolation tests correctly still
    passed under this bypass, since those properties were independently
    safe for reasons unrelated to this specific snapshot), then reverted.

    P1 fix (13th independent review round, "routing drops project
    ownership"): `RoutingRequest` had no `projectId` field at all — only
    `taskId` — even though `ModelInvocationContext.projectId` has always
    existed and been fully honored by `gateway.invoke()`. Codex reproduced
    a project-bearing invocation routed through `routeAndExecute()` being
    accounted under `taskId` ALONE (project silently dropped), then a
    SEPARATE direct `gateway.invoke()` call for the SAME project/task
    seeing an empty project-scoped ceiling and succeeding — both calls
    together bypassing what should have been a single shared per-task
    ceiling. Fixed: `RoutingRequest` gained an optional `projectId` field,
    captured into the SAME `routingScope` snapshot as every other routing
    field, and `invokeAuthorized()` now passes `projectId: request.projectId`
    into `ModelInvocationContext` (previously omitted entirely). Regression
    tests (router.test.ts, new describe block) prove the exact
    reproduction (a routed project P/task A invocation followed by a
    direct `gateway.invoke()` for the same project/task correctly share
    one consumed ceiling), two routed invocations for DIFFERENT projects
    sharing the SAME taskId use INDEPENDENT ceilings (routing must not
    downgrade project+task ownership into task-only ownership), project
    identity survives every escalation/retry/fallback step (all three
    tiers' cost lands under the same project), and omitting `projectId`
    (the pre-existing, still-supported project-agnostic use case) is
    unaffected. Verified via a temporary bypass (omitting `projectId` from
    the `invokeAuthorized()` call) — confirmed exactly 3 of 4 new tests
    fail (the project-agnostic backward-compat test correctly stayed
    green), then reverted.

    P1 fix (13th independent review round, "invocation payload remains
    caller-mutable during execution"): `routeAndExecute()` passed
    `invocationRequest` (the model prompt/taskType payload — a SEPARATE
    object from `request`/`routingScope`, which only carries routing
    metadata) UNSNAPSHOTTED to every `invokeAuthorized()` call, including
    every escalation/fallback step. `gateway.invoke()`'s own per-call
    snapshot (see UASF-REQ-0024) protects a SINGLE call against a
    mutation racing its own pending provider call, but not ACROSS
    retries: a caller mutating `invocationRequest.prompt` between this
    method's own sequential escalation steps could make a LATER attempt
    execute a different payload than the FIRST attempt (and the caller)
    ever authorized. Fixed: `invocationRequest` is captured into a frozen
    `invocationScope` snapshot in the SAME synchronous prefix as
    `routingScope`, before the first `selectModel()`/`invokeAuthorized()`
    call; `invocationScope` (never the original parameter) is what every
    candidate — initial, every escalation step, and fallback — receives.
    Regression tests prove: mutating `invocationRequest.prompt` while the
    initial candidate is pending has no effect on a LATER escalation
    attempt's actual payload (the escalated response reflects the
    ORIGINAL prompt, verified via `MockProvider`'s own prompt-echoing
    output), and concurrent `routeAndExecute()` calls sharing one
    caller-owned `invocationRequest` object cannot cross-contaminate their
    payloads. Verified via a temporary bypass (reverting only the
    escalation loop's second `invokeAuthorized()` call to re-read
    `invocationRequest` directly) — confirmed exactly 1 of 2 new tests
    fails (the exact-reproduction escalation test; the concurrent-isolation
    test, which never reaches the escalation loop, correctly stayed
    green), then reverted.

- id: UASF-REQ-0028
  title: Premium fallback policy (default off, evidence-based escalation)
  description: >
    AUTO_PREMIUM_FALLBACK defaults to false; escalation beyond the cheapest
    capable model requires validation failure plus policy/budget approval.
  source_baseline: "BASELINE-V1 section 64, 306 (Proof C/D)"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/models/router.ts"
  test_refs:
    - "runtime/models/__tests__/router.test.ts"
  proof_refs:
    - "proofs/premium-fallback-block/proof.test.ts"
  security_refs: []
  notes: >
    See UASF-REQ-0027's second-round note: the fallback-validation-bypass
    fix in runtime/models/router.ts (every escalated candidate, not just
    the initial one, is now passed through the caller's validate()) applies
    directly to this requirement's "escalation requires validation failure"
    guarantee — a fallback response is never trusted merely for being from
    a pricier model.

    P1 fix (9th independent review round, "fallback execution bypasses
    policy and budget enforcement"): see UASF-REQ-0027's matching note for
    full detail. This requirement's own description — "escalation ...
    requires validation failure PLUS POLICY/BUDGET APPROVAL" — was not
    actually enforced in code prior to this round: `allowPremiumFallback`
    was the ONLY gate, and it is a routing permission flag, not a policy/
    budget authorization. PROOF_VERIFIED is retained here (not
    downgraded) because the underlying code is NOW fixed and the
    regression tests genuinely prove policy/budget enforcement on every
    escalation step, per baseline section 294 ("no unsupported upgrades"
    also implies no unsupported non-corrections once real evidence exists)
    — but this gap is recorded honestly rather than silently closed.

    Re-checked per explicit instruction (10th independent review round):
    proofs/premium-fallback-block/proof.test.ts still passes unchanged and
    still constructs a genuine PolicyEngine + BudgetGuard, confirming this
    requirement's own "policy/budget approval" guarantee is unaffected by
    this round's fixes (the guard logic moved INTO gateway.invoke() itself
    — see UASF-REQ-0024 — but router.ts's routeAndExecute() still requires
    the same non-optional `policy`/`budget` parameters this proof already
    exercised; the fallback classes fixed this round were "concurrent
    invocations can race past a budget ceiling" and "a caller can bypass
    the gateway's guard entirely," neither of which this requirement's own
    proof scenario exercises). PROOF_VERIFIED remains genuinely supported;
    no status change.

- id: UASF-REQ-0029
  title: Cost engine
  description: Track cost per task/agent/model/provider call; no silent spending.
  source_baseline: "BASELINE-V1 section 69"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/cost/cost-engine.ts"
    - "runtime/project-lifecycle/orchestrator.ts"
  test_refs:
    - "runtime/cost/__tests__/cost-engine.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    CostEngine now takes an injectable clock (constructor `now` param) so
    tests can simulate specific timestamps, and gained totalInWindow() for
    time-scoped totals — both added to support real dailyUsd/monthlyUsd
    budget enforcement (see UASF-REQ-0030).

    BLOCKER fix (Codex, 2nd round): CostEngine.record() itself accepted
    NaN, Infinity, -Infinity, and negative amountUsd values, letting a
    direct record() call (bypassing BudgetGuard) corrupt totals or
    manufacture negative spend. Fixed: added exported
    assertValidMonetaryAmount() (rejects non-finite and negative values,
    zero is valid) and record() now calls it before pushing any entry —
    so direct CostEngine.record() calls are protected even when
    BudgetGuard is bypassed entirely. Regression tests added for NaN,
    Infinity, -Infinity, and negative amounts (each confirmed to throw
    InvalidMonetaryAmountError and leave `engine.all()` empty), plus
    direct unit tests of assertValidMonetaryAmount as the shared
    validation primitive.

    BLOCKER fix (Codex, 3rd round): even with amount validation on write,
    record()/all() returned the actual internal CostEntry object/array — a
    caller could mutate a returned entry's amountUsd to NaN or a negative
    value AFTER a valid spend was recorded, poisoning totals retroactively
    and bypassing the validation above entirely (NaN + x = NaN propagates
    into total()/totalFor()/totalInWindow(), and budget comparisons against
    NaN are always false). Fixed: record() and all() now return frozen,
    detached snapshots (runtime/util/immutable.ts) — the internal entries
    array always holds the ONLY reference used for totals, and mutating any
    returned copy throws instead of corrupting state. Regression tests
    prove: mutating a returned record's amountUsd to NaN/negative/Infinity
    never affects total()/totalFor(), record() and all() never return the
    same object reference twice, and all totals remain finite and
    non-negative after every mutation attempt. Confirmed via git-stash that
    these tests fail against the pre-fix code.

    P2 addition (8th independent review round, "floating-point comparisons
    reject exact budget spend" — see UASF-REQ-0030 for the full finding):
    added `exceedsMonetaryAmount(a, b)` alongside `assertValidMonetaryAmount`
    as this module's second centralized monetary primitive — a single,
    documented precision policy (integer micro-dollar units,
    `MONETARY_PRECISION_SCALE = 1_000_000`) for "does a exceed b" cumulative
    comparisons, used by every ceiling check in runtime/budget/budget.ts so
    no comparison site invents its own epsilon/tolerance. Direct unit tests
    prove 0.1+0.2 does not exceed 0.3 at this precision (despite native
    `0.1 + 0.2 > 0.3 === true`), a genuine one-unit excess is still
    detected, equal and smaller amounts never register as exceeding, and
    repeated decimal accumulation lands exactly on a whole-dollar ceiling.

    P1 fix (24th independent review round, "reservation deletion must not bypass reconciliation"): the public
    `deleteReservation(id)` method removed ANY reservation, ACTIVE or RECONCILIATION_FAILED, unconditionally —
    callable directly by any code holding a `CostEngine` reference, bypassing `BudgetGuard.commit()`/`release()`
    entirely and silently discarding the protection a RECONCILIATION_FAILED reservation exists to provide.
    Removed from the public API and replaced with two invariant-enforcing methods: `commitReservation(id, entry)`
    (validates the amount, marks RECONCILIATION_FAILED and preserves the reservation on failure, and only
    removes it once a real cost is genuinely recorded) and `releaseReservation(id)` (refuses to remove a
    RECONCILIATION_FAILED reservation, throwing `UnresolvedReconciliationError`). `BudgetGuard.commit()`/
    `release()` (runtime/budget/budget.ts) now delegate to these instead of performing the mutation themselves,
    so the protection holds regardless of caller. New regression tests directly on `CostEngine` (not only via
    `BudgetGuard`) prove: no generic `deleteReservation` remains on the public API, a failed commit protects
    (never frees) the reservation's capacity, and `releaseReservation` rejects a RECONCILIATION_FAILED
    reservation while still allowing ordinary ACTIVE release. Verified via a temporary bypass of the
    RECONCILIATION_FAILED guard — confirmed the exact predicted 13 tests (across cost-engine.test.ts AND several
    pre-existing budget.test.ts regressions from earlier rounds) failed, then reverted and re-confirmed all
    passing.

    Round 25 findings 4-5 (one consolidated closure batch — see UASF-REQ-0030 for the `BudgetGuard`-facing half
    of the same fix): (4) "reservation ownership checks must be validated inside CostEngine" — the ownership-
    mismatch check (taskId/projectId/agentId always compared; provider/modelId compared only when the
    reservation itself recorded them) used to run ONLY in `BudgetGuard.commit()`, one layer above
    `commitReservation()`; a caller holding a bare `CostEngine` reference (bypassing `BudgetGuard` entirely)
    could commit a reservation under a completely different task/project/agent than the one it actually
    protects. `ReservationOwnershipMismatchError` moved here from `budget.ts` (re-exported there for API
    stability, matching the 24th round's `UnknownReservationError`/`UnresolvedReconciliationError` pattern), now
    with an `operation: "commit" | "release"` constructor parameter so one class serves both methods; the check
    now runs INSIDE `commitReservation()` itself, marking the reservation RECONCILIATION_FAILED before throwing
    (a real provider call may already have happened under it). (5) "callers must not release someone else's
    active reservation" — `releaseReservation(id)` took only a reservation id (a predictable, sequential bearer
    token: `res-1`, `res-2`, ...) with NO ownership check at all, so any caller who merely learned another
    caller's id could release its active, in-flight reservation, freeing protected capacity that was never
    theirs. Fixed: `releaseReservation(id, callerScope: ReservationOwnership)` now REQUIRES a second, mandatory
    scope argument, validated against the reservation's own authoritative scope before any deletion — unlike a
    commit mismatch, a release mismatch does NOT mark the reservation RECONCILIATION_FAILED, since nothing was
    ever committed by the illegitimate attempt; only that caller's attempt is rejected, and the legitimate owner
    can still release/commit normally afterward. `runtime/models/gateway.ts`'s one production call site
    (`budget.release(reservation.id)` inside `invoke()`'s catch block) updated to
    `budget.release(reservation.id, reservation.scope)`. Four new regression tests directly on `CostEngine` (not
    only via `BudgetGuard`) prove: reserve under project A then commit under project B is rejected at the ledger
    level (preserving A's reservation, marking it RECONCILIATION_FAILED) even bypassing `BudgetGuard` entirely;
    and caller B, knowing only caller A's reservation id, cannot release A's reservation (A's own release/commit
    still works normally afterward, and the mismatch does not mark the reservation failed). Verified via two
    separate temporary bypasses (disabling each ownership check independently) — confirmed the exact predicted
    21 tests (finding 4, including several pre-existing round-12/13 commit-ownership regressions) and 4 tests
    (finding 5) failed respectively, then both reverted and all tests re-confirmed passing.

    P1 fix (26th independent review round, finding 2, "cost ledger state must be runtime-private"): `#entries`,
    `#reservations`, and `#reservationSeq` still used TypeScript's compile-time-only `private` keyword — reachable
    at runtime via `(engine as any).entries`/`.reservations`, letting a consumer push/delete/wipe spend entries or
    fabricate/delete reservations directly, corrupting the "no silent spending" ledger with no trace in
    `record()`/`createReservation()`. Converted all three fields to genuine ECMAScript private fields (same
    pattern as `audit-log.ts`'s `#records`). Five new regression tests prove the fields are unreachable via
    property access or any reflection API, and that a plain JS consumer cannot mutate authoritative entries or
    reservations this way. Verified via a temporary bypass (reverting to `private entries`/`reservations`) —
    confirmed exactly the predicted tests failed, then reverted and re-confirmed all tests passing.

    P1 fix (26th independent review round, finding 3, "reservation ownership evidence must not be forgeable"):
    `getReservation(id)` was a PUBLIC, unauthenticated lookup that returned a reservation's full `scope` — the
    EXACT material `commitReservation()`/`releaseReservation()`'s ownership check compares a caller's supplied
    `callerScope` against. An attacker who merely learned another caller's reservation id could call
    `getReservation()` as reconnaissance, read the true scope, and construct a passing `callerScope` argument for
    a subsequent release/commit — turning a read-only diagnostic API into an authorization bypass oracle. A
    SECOND, related channel: `ReservationOwnershipMismatchError`'s thrown message interpolated the SAME
    authoritative scope values, letting a wrong-guess attempt "probe and read the correct answer from the
    rejection" just as effectively. Fixed: `getReservation()` now returns a new `ReservationView` type (`Omit
    <LedgerReservation, "scope">`) — `id`/`amountUsd`/`status` only, scope omitted entirely; the error message
    no longer discloses the true authoritative scope (only the caller's own rejected values), with a note that
    the true scope remains cross-referenceable via the `BUDGET_RESERVATION_CREATED` audit event for a legitimate
    reviewer (a channel deliberately left open, since `AuditLog` is a separate, `#private`-protected store never
    returned to the calling/attacking code, unlike a return value or exception property). `budget.ts`'s three
    remaining scope-audit-logging call sites were updated: `commit()`'s ownership-mismatch catch drops the
    privileged read entirely; its success/general-failure paths substitute the caller's OWN already-confirmed
    `entry` fields (`confirmedScope`) instead of the privileged `reservation.scope` read (safe, since ownership
    was already validated to match `entry` before those paths run); `release()`'s `UnresolvedReconciliationError`
    catch drops the scope-like field entirely, since ownership has not yet been checked at that point. Four new
    regression tests prove: `getReservation()` no longer exposes `scope` (BLOCKER regression); neither the
    release-mismatch nor the commit-mismatch error message discloses the true scope; and a legitimate retry still
    succeeds afterward. A pre-existing test (verifying the mismatch audit event records the true scope) was
    rewritten to verify a legitimate reviewer can still recover it via the `BUDGET_RESERVATION_CREATED` event,
    joined by `reservationId`, rather than from the rejected caller's own return value. Verified via temporary
    bypasses of both the `getReservation()` redaction and the error-message redaction independently — confirmed
    the exact predicted tests failed in each case, then both reverted and all tests re-confirmed passing.

- id: UASF-REQ-0030
  title: Budget engine / cost ceilings
  description: >
    Task/run/project/daily/monthly cost ceilings that stop or block
    execution before a limit is exceeded, preventing runaway spend.
  source_baseline: "BASELINE-V1 section 70, 71, 72, 306 (Proof E)"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/budget/budget.ts"
    - "runtime/cost/cost-engine.ts"
    - "runtime/audit/audit-log.ts"
  test_refs:
    - "runtime/budget/__tests__/budget.test.ts"
  proof_refs:
    - "proofs/budget-ceiling/proof.test.ts"
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Independent review (Codex) found dailyUsd/monthlyUsd were defined in
    BudgetLimits but never checked at runtime — only perTaskUsd/perRunUsd
    were enforced. Fixed: BudgetGuard now checks all four ceilings, with
    dailyUsd/monthlyUsd computed as real UTC-calendar-period windows via
    CostEngine.totalInWindow(), scoped by projectId when given. Test
    coverage added: same-period blocking, boundary (exactly-at-ceiling
    allowed, one cent over blocked), rollover (a new UTC day/month resets
    the ceiling even though lifetime spend is far higher, verified with an
    injectable clock rather than waiting on real time), per-project
    scoping, a synchronous-burst test demonstrating the check-then-record
    sequence has no `await` between the two steps (so no interleaved call
    can race past the ceiling), and an AuditLog integration recording both
    allowed and blocked budget checks as durable, hash-chained evidence
    (BudgetGuard's optional third/fourth constructor params: `now` and
    `auditLog`).

    BLOCKER fix (Codex, 2nd round): assertWithinBudget() checked the
    projected amount against ceilings arithmetically but never validated
    that the amount (or the configured limits themselves) were finite and
    non-negative — a NaN or negative projectedAmountUsd, or a NaN/negative
    limit, could bypass every ceiling check (NaN comparisons are always
    false; a negative amount can manufacture headroom). Fixed:
    assertWithinBudget() now calls assertValidMonetaryAmount() on the
    projected amount before any ceiling check, failing closed (throwing
    InvalidMonetaryAmountError, logging BUDGET_INVALID_AMOUNT_REJECTED to
    the audit trail) without mutating any state; the BudgetGuard
    constructor now validates all four limits (perTaskUsd, perRunUsd,
    dailyUsd, monthlyUsd) via a new assertValidLimit() helper, throwing
    InvalidBudgetLimitError for NaN/Infinity/-Infinity/negative ceilings.
    Regression tests added for: NaN/Infinity/-Infinity/negative spend
    amounts (each leaves total spend at 0, not NaN), a negative amount
    failing to manufacture headroom, correct enforcement continuing after
    a rejected invalid spend, NaN/Infinity/-Infinity/negative limits
    rejected at construction for all four ceiling kinds, a direct
    CostEngine.record() bypass still being protected by CostEngine's own
    validation (see UASF-REQ-0029), an exact-boundary-vs-just-over-boundary
    test, and an audit-log assertion that a rejected invalid amount is
    recorded as BUDGET_INVALID_AMOUNT_REJECTED.

    P1 fix (4th independent review round, "limits ownership is still
    unsafe"): the constructor stored the CALLER's `limits` object by
    reference (`this.limits = limits`); validating it at construction time
    did not protect against the caller mutating that SAME object
    afterward (e.g. `originalLimits.dailyUsd = -1`), which would corrupt
    the authoritative ceilings post-validation. Fixed: the constructor now
    validates, then copies the limits into a frozen internal object
    (`freezeRecord({...limits})`) — the caller's own reference is never
    retained. Also added `getLimits()`, returning a frozen, detached
    snapshot (there was previously no way to read back configured limits
    at all). Regression tests prove: mutating the original limits object
    after construction does not change enforcement, mutating it to
    NaN/Infinity/negative afterward does not corrupt enforcement (still
    blocks correctly, and all totals remain finite/non-negative),
    `getLimits()` returns a snapshot that cannot mutate internal state and
    is never the same object reference twice, and daily/monthly
    enforcement still works end-to-end after the fix. Confirmed via
    git-stash that these tests fail on the pre-fix code.

    P1 fix (5th independent review round, "per-task budgets mix
    projects"): buildCeilingChecks()'s perTaskUsd check scoped ONLY by
    `taskId` — Codex reproduced two DIFFERENT projects using the same
    `taskId` (e.g. a shared "bootstrap" task template) sharing a single
    perTaskUsd ceiling: Project A spending its full allowance caused
    Project B's own, separate, unused allowance to be wrongly rejected.
    Scoping semantics are now explicit and documented in code: when
    `projectId` is present on the scope, the task-budget key is
    `projectId + taskId` (matching bölüm 70-72's per-project/per-task
    ceilings); when `projectId` is absent, the ceiling remains
    intentionally GLOBAL by `taskId` alone, preserving the existing,
    legitimate project-agnostic task-budget use case. Regression tests
    prove: the same taskId in two different projects gets independent
    allowances, spending in Project A does not consume Project B's
    allowance, the same project+taskId still shares one allowance,
    project-less task budgets keep their documented global semantics,
    daily/monthly/per-run budgets (never task-scoped) are unaffected, and
    invalid monetary inputs are still rejected regardless of scoping.
    Confirmed via git-stash that the "independent allowances" test fails
    against the pre-fix code with the exact reproduction Codex described.

    P2 fix (8th independent review round, "floating-point comparisons
    reject exact budget spend"): assertWithinBudget()'s ceiling check used
    a bare `check.projected > check.limit` comparison. Codex reproduced
    spending $0.10 then $0.20 against a $0.30 ceiling: binary
    floating-point addition produces `0.30000000000000004`, which the bare
    `>` comparison correctly (per IEEE-754) but WRONGLY-for-intent judged
    as exceeding the $0.30 ceiling — a spend landing EXACTLY on the
    configured limit was incorrectly blocked, across all four cumulative
    ceilings (perTaskUsd, perRunUsd, dailyUsd, monthlyUsd). Fixed with a
    single, deliberate, documented precision policy — NOT a scattered
    magic epsilon: a new `exceedsMonetaryAmount()` (runtime/cost/
    cost-engine.ts) scales both operands to integer micro-dollar units
    ($0.000001, `MONETARY_PRECISION_SCALE = 1_000_000`) via `Math.round`
    and compares the resulting INTEGERS — a comparison structurally immune
    to binary floating-point accumulation noise. All four ceiling checks
    in buildCeilingChecks()/assertWithinBudget() now route through this
    one shared function. Regression tests prove: 0.10+0.20 landing exactly
    on a 0.30 ceiling is accepted (for all four ceiling types
    individually), one precision unit ($0.000001) above the ceiling is
    still correctly rejected, ten repeated $0.10 spends land exactly on a
    $1.00 ceiling without spurious rejection, project/task scoping and
    daily/monthly rollover remain correct alongside the fix, zero/free
    spends remain valid, and NaN/Infinity/negative amounts remain
    rejected. Direct unit tests of `exceedsMonetaryAmount()` itself (see
    UASF-REQ-0029) prove the underlying comparison semantics. Confirmed
    via git-stash that 5 of the budget-level tests fail against the
    pre-fix bare-`>` code with exactly the incorrect-rejection Codex
    described. Collateral, correctness-preserving update: Proof E's
    runaway-loop test (proofs/budget-ceiling/proof.test.ts) previously
    asserted the accumulated spend was `<= 5` using RAW float equality —
    that assertion only ever passed because the OLD bug's incorrect
    rejections happened to also keep the raw sum under 5; now that an
    exact-ceiling spend is correctly accepted (raw sum
    `5.000000000000002`), the assertion was updated to `toBeCloseTo(5, 6)`
    (correct at the Factory's own documented precision) — the proof's
    actual claim (a runaway loop is stopped by the ceiling) is unchanged
    and still verified.

    P1 fix (10th independent review round, "concurrent model invocations
    can exceed budgets"): Codex reproduced two CONCURRENT $0.60 provider
    calls against a $1.00 ceiling both executing — each independently
    called the pre-check (`assertWithinBudget()`, a pure read of
    already-recorded totals) BEFORE either had recorded anything, so both
    passed; the actual `spend()` call only happened AFTER an `await`ed
    provider round-trip, by which point both providers had ALREADY been
    invoked and both real costs had ALREADY been incurred. `spend()`
    itself IS atomic (no `await` between its own check and record — see
    the note above), so it correctly rejected the SECOND `spend()` call,
    but that rejection happened AFTER the $0.60 was already spent for
    real — silently losing track of genuinely incurred cost. The root
    cause: a pre-check-only pattern (`assertWithinBudget()` alone) checks
    but never RESERVES anything, so nothing stops a second concurrent
    caller from ALSO passing the same check during the gap before either
    has recorded. Fixed with a reservation/reconciliation model, three new
    methods: `reserve(scope, amountUsd): Reservation` — evaluates ALL
    ceilings INCLUDING every other currently-open reservation and, only if
    none would be exceeded, atomically (synchronously, no `await` inside
    it, exactly like `spend()`) adds the reservation and returns an opaque
    handle; this MUST happen and complete before any provider is invoked.
    `commit(reservationId, entry)` — deletes the reservation and records
    the ACTUAL incurred cost UNCONDITIONALLY (never re-checked against
    ceilings, and never dropped even if that pushes a ceiling into overage
    on paper — "never silently discard an incurred cost because a ceiling
    was exceeded after execution"; an overage is still logged to the audit
    trail for visibility). `release(reservationId)` — the documented
    reconciliation rule for a provider call that throws: no real cost is
    assumed to have occurred, so the reservation is freed with nothing
    recorded (a real provider adapter that CAN partially bill on failure
    must instead call `commit()` with the partial amount — out of scope
    for this repository's MockProvider). Regression tests prove: two
    reservations that would jointly exceed a ceiling cannot both succeed
    (the exact reproduction), reservations are included in every ceiling's
    available-budget calculation (perTaskUsd/perRunUsd/dailyUsd/
    monthlyUsd), incurred cost is never lost, commit() records the actual
    amount even when it differs from (including exceeding) the reserved
    estimate, commit()/release() on an unknown or already-resolved
    reservation id fails closed (UnknownReservationError) rather than
    double-recording or double-releasing, release() frees budget back up
    without recording any cost, task/project isolation is preserved (one
    task's/project's reservation does not block a DIFFERENT task's/
    project's own ceiling), daily/monthly rollover remains correct with
    reservations in flight, a returned Reservation is a frozen/detached
    snapshot (same ownership-boundary pattern as every other returned
    record in this codebase), and invalid reservation amounts are rejected
    before any reservation is created. Verified via a temporary bypass
    (dropping the new `reservedTotal()` terms from every ceiling
    calculation, keeping reserve()/commit()/release()'s own bookkeeping
    intact) — confirmed exactly the 5 reservation-awareness-dependent
    tests fail against the bypassed code, then reverted. See UASF-REQ-0024
    (Model gateway) for how ModelGateway.invoke() now uses this API as the
    ONLY way any real provider call happens.

    P1 fix (11th independent review round, "failed reconciliation
    releases reservation before cost is safely recorded"): Codex
    reproduced `commit()` deleting the reservation FIRST, THEN validating
    `entry.amountUsd` — a malformed actual amount (NaN, from e.g. a
    corrupted provider response) failed validation AFTER the reservation
    was already gone, so no cost was ever recorded, but the budget
    capacity the reservation was protecting was ALSO silently restored:
    another full-ceiling reservation could immediately succeed, even
    though a real (or potentially real) provider call may already have
    happened for the first one. Fixed by reversing the order:
    `assertValidMonetaryAmount()` and `costEngine.record()` now run WHILE
    the reservation is still open; the reservation is deleted ONLY after
    both have genuinely succeeded. On failure, the reservation is
    PRESERVED (so it keeps counting via `reservedTotal()` against every
    ceiling — capacity is never silently freed), a new
    `BUDGET_RESERVATION_COMMIT_FAILED` audit event is recorded (never
    silent), and the error is re-thrown (fail closed). Because the
    reservation stays open, a caller can safely retry `commit()` with a
    corrected amount using the SAME reservation id — retry is safe by
    construction, not by convention, since nothing was deleted to make it
    unsafe. Regression tests prove: NaN/+Infinity/-Infinity/negative
    actual amounts all fail to release the reservation, another
    reservation cannot consume the still-protected capacity, retrying
    commit() with a corrected amount after a failure completes
    reconciliation exactly once, a commit-failure audit event is always
    recorded, and concurrent reservations remain safe across a
    failed-then-retried reconciliation. Verified via a temporary bypass
    (restoring the old delete-before-validate order) — confirmed exactly
    7 of 66 budget tests fail against the bypassed code (the ones
    exercising this exact property), then reverted. A narrow audit of
    every other `.delete()`/state-removal call site in `runtime/`
    (`cache.ts`'s TTL eviction on read, `runtime/state/file-store.ts`'s
    already-atomic write-then-rename) found no other instance of this
    ordering bug — `approval.ts` mutates status fields in place and never
    deletes a pending record at all, so it cannot exhibit this class.

    P1 fix (12th independent review round, "failed reconciliation
    reservations can still be released"): Codex reproduced the 11th
    round's fix (reservation PRESERVED, not deleted, on a failed commit())
    being insufficient on its own: a caller could still call `release()`
    on that same still-open reservation after the failed commit(), which
    deleted it anyway — restoring the full ceiling and letting a second
    full-ceiling reservation succeed, all while the recorded cost for the
    first attempt remained zero, even though a real (or potentially real)
    provider call may already have happened. `release()` had no concept
    of "this reservation already had a failed commit attempt" — it
    treated every open reservation identically. Fixed by introducing an
    explicit reservation lifecycle state: `ReservationStatus = "ACTIVE" |
    "RECONCILIATION_FAILED"`, stored alongside `scope`/`amountUsd` in the
    internal reservations map. `commit()`'s existing failure-catch block
    now marks `reservation.status = "RECONCILIATION_FAILED"` before
    re-throwing (in addition to preserving the reservation, from the 11th
    round). `release()` now checks this status FIRST: a
    `RECONCILIATION_FAILED` reservation is rejected with the new
    `UnresolvedReconciliationError` (a `BUDGET_RESERVATION_RELEASE_
    REJECTED_UNRESOLVED` audit event is recorded, never silent) instead of
    being deleted — the reservation keeps counting against every ceiling
    via `reservedTotal()`, and the ONLY safe path forward is retrying
    `commit()` with a corrected amount on the same reservation id (which
    was already proven safe by the 11th round's fix). Regression tests
    (budget.test.ts, new describe block) prove: the exact reproduction
    (reserve -> commit(NaN) fails -> release() is REJECTED, not silently
    accepted, and a second full-ceiling reservation is correctly blocked,
    with total recorded cost still zero), an ACTIVE reservation (no failed
    commit attempt) can still be release()d normally, a reservation that
    successfully retries commit() after an initial failure transitions out
    of the unresolved state and no longer blocks release() being called on
    a DIFFERENT, still-active reservation, every rejected release() records
    the new audit event, and an UnknownReservationError still takes
    priority for an id that was never reserved at all. Verified via a
    temporary bypass (`if (false && reservation.status ===
    "RECONCILIATION_FAILED")` in release()) — confirmed exactly 5 of the
    new tests fail against the bypassed code, then reverted.

    P1 fix (12th independent review round, "commit accepts accounting
    ownership unrelated to the reservation"): Codex reproduced `commit()`
    trusting its caller-supplied `entry.taskId`/`entry.projectId`
    completely independently of the reservation being committed against --
    reserving budget for project P/task A, then calling `commit()` with
    project Q/task B, recorded the cost under Q/B in CostEngine while the
    reservation (which had actually protected P/A's capacity) was deleted,
    silently making P/A's full capacity available again with zero cost
    ever attributed to it. A reservation's `scope` was already the
    authoritative record of what it was FOR (stored at `reserve()` time,
    already frozen) — `commit()` simply never checked its caller-supplied
    ownership against it. Fixed (validation approach, one of two options
    the review explicitly sanctioned — the other, removing the redundant
    caller-supplied ownership parameters entirely, was rejected here to
    avoid a mechanical signature change across every existing commit()
    call site for no additional security benefit): `commit()` now checks
    `entry.taskId`/`entry.projectId` against `reservation.scope` IMMEDIATELY
    after the existence check, before any mutation of state — a mismatch
    throws the new `ReservationOwnershipMismatchError` (with a
    `BUDGET_RESERVATION_OWNERSHIP_MISMATCH` audit event identifying the
    reservation's OWN authoritative owner alongside the rejected supplied
    values) and leaves the reservation, CostEngine, and every ceiling
    completely untouched. Regression tests (budget.test.ts, new describe
    block) prove: the exact reproduction (reserve P/A, commit Q/B) is
    rejected with zero cost recorded and the P/A reservation still fully
    intact (protecting its original capacity), a matching taskId with a
    mismatched projectId (and vice versa) is also rejected, an
    undefined-vs-defined projectId mismatch is rejected, a genuinely
    matching commit() (the existing, correct usage pattern) is unaffected,
    a retry after a rejected mismatched commit() can still successfully
    commit with the CORRECT matching ownership on the same reservation,
    and the ownership-mismatch audit event always identifies the
    reservation's authoritative scope, never the caller's rejected one.
    Verified via a temporary bypass (`if (false && (entry.taskId !==
    reservation.scope.taskId || entry.projectId !==
    reservation.scope.projectId))`) — confirmed exactly 8 of the new tests
    fail against the bypassed code, then reverted.

    P1 fix (13th independent review round, "ownership-mismatch failure
    leaves reservation releasable"): Codex reproduced the 12th round's
    ownership-mismatch check (previous paragraph) THROWING without first
    marking the reservation's lifecycle state — `reservation.status`
    stayed "ACTIVE" after a mismatch, so a caller catching the thrown
    `ReservationOwnershipMismatchError` could then legally call
    `release()` (which only rejects "RECONCILIATION_FAILED"), silently
    restoring the FULL protected capacity even though a real (or
    potentially real) provider call may already have occurred under the
    reservation's authoritative ownership. This is the identical
    "FAIL -> THROW -> RELEASE -> RESTORE BUDGET" fail-open shape the 12th
    round already closed for a malformed-amount commit() failure — an
    ownership mismatch is exactly the same class of "reconciliation could
    not be safely completed," and needed the SAME protection. Fixed:
    the mismatch branch now sets `reservation.status =
    "RECONCILIATION_FAILED"` BEFORE appending the audit event and
    throwing (mirroring the pre-existing amount-failure catch block
    immediately below it in the same function) — `release()`'s existing
    status check (from the 12th round) then rejects it exactly like any
    other unresolved reconciliation. Regression tests (budget.test.ts,
    new describe block) prove: the exact reproduction (reserve ->
    mismatched commit() -> catch -> release() is REJECTED, not silently
    accepted, full ceiling stays protected), a project-only mismatch also
    protects the reservation from release(), a retry with the CORRECT
    ownership after a protected mismatch still succeeds and accounts
    exactly once (retry remains safe by construction, since nothing was
    ever deleted), and the release() rejection is audited with both the
    ownership-mismatch AND the release-rejection event types. Verified
    via a temporary bypass (removing the `reservation.status =
    "RECONCILIATION_FAILED"` assignment from the mismatch branch only) —
    confirmed exactly 5 of the new tests fail (all asserting release() is
    rejected), then reverted.

    P1 fix (13th independent review round, "reservation ownership checks
    omit agent identity"): Codex reproduced a reservation belonging to
    one agent being `commit()`-ed as a DIFFERENT agent successfully,
    because the 12th round's ownership-mismatch check compared only
    `taskId`/`projectId` — never `agentId` (already a `CostScope` field
    used elsewhere in this same module) — nor `provider`/`modelId` (not
    previously part of a reservation's stored ownership at all). Required
    invariant: every ownership dimension a reservation actually captured
    at `reserve()` time must be authoritative for its own `commit()`.
    Fixed: introduced `ReservationOwnership` (`CostScope` extended with
    optional `provider`/`modelId`), so `Reservation.scope` now can record
    agentId (already supported via CostScope)/provider/modelId at
    `reserve()` time; `commit()`'s mismatch check now ALSO compares
    `entry.agentId` against `reservation.scope.agentId` (always — both
    sides default to `undefined` when omitted, so this is backward
    compatible) and `entry.provider`/`entry.modelId` against the
    reservation's own values (only enforced when the reservation itself
    recorded them, so pre-existing callers that never supplied a
    provider/modelId at `reserve()` time are unaffected). `gateway.invoke()`
    now passes `authorizedModel.provider`/`.modelId` to `budget.reserve()`
    too (see UASF-REQ-0024's notes), so the real model-invocation path
    gets this protection automatically. Regression tests (budget.test.ts,
    new describe block) prove: the exact reproduction (an owner-agent
    reservation committed as a different agent is rejected, no spend is
    recorded for the other agent, the reservation stays protected, and a
    retry under the ORIGINAL owner-agent succeeds), a reservation with no
    agentId/provider/modelId recorded does not enforce those dimensions
    (no regression for the pre-existing call shape), provider and modelId
    mismatches are independently rejected when the reservation recorded
    them, multiple dimensions can combine (any single mismatching
    dimension is sufficient to reject), and the ownership-mismatch audit
    event identifies the reservation's authoritative owner across ALL
    five dimensions, never the caller's rejected values. Verified via a
    temporary bypass (reducing the mismatch condition to taskId/projectId
    only) — confirmed exactly 6 of the new tests fail, then reverted.

    P1 fix (16th independent review round, "outstanding budget
    reservations are not shared across guards using one cost ledger"):
    Codex reproduced two `BudgetGuard` instances constructed over the SAME
    `CostEngine` each keeping its own PRIVATE `Map` of outstanding
    (not-yet-committed) reservations — a reservation opened through guard
    A was completely invisible to guard B's own ceiling checks. Two
    concurrent $0.60 `reserve()` calls, one authorized through each guard,
    both independently saw zero outstanding reservations against a shared
    $1.00 `perRunUsd` ceiling and both succeeded — $1.20 committed,
    reintroducing (one layer up, across guard instances rather than within
    one) the exact race the 10th independent review round's reservation
    model was meant to make structurally impossible. Required invariant:
    every budget ceiling must be enforced against committed spending PLUS
    ALL outstanding reservations across every execution participant
    sharing the same cost ledger, regardless of which `BudgetGuard`
    instance created any individual reservation. Fixed (Option A of the
    three architectures the review offered): reservation storage now
    lives on `CostEngine` itself — the object every cooperating
    `BudgetGuard` already shares by construction, exactly as it already
    did for COMMITTED spend (`record()`/`totalFor()`/`total()`/
    `totalInWindow()`). Five new synchronous `CostEngine` methods
    (`createReservation()`, `getReservation()`,
    `markReservationReconciliationFailed()`, `deleteReservation()`,
    `reservedTotal()`) replace `BudgetGuard`'s former private reservation
    `Map`; `BudgetGuard.reserve()`/`commit()`/`release()`/
    `buildCeilingChecks()` now delegate entirely to `this.costEngine` for
    reservation state, while every public signature, error type
    (`UnknownReservationError`, `UnresolvedReconciliationError`,
    `ReservationOwnershipMismatchError`), audit event, and ownership-
    mismatch validation is UNCHANGED — only the underlying storage moved,
    so gateway.ts/router.ts/orchestrator.ts and every prior regression
    test continue to work unmodified. Concurrency safety is preserved by
    the same argument the 10th round established: every new `CostEngine`
    reservation method is fully synchronous with no `await` inside it, so
    "read shared ledger -> check ceilings -> write shared ledger" inside
    `reserve()` still executes as one indivisible JS tick regardless of
    how many `BudgetGuard` instances (or `CostEngine` ledgers) are
    involved. Twelve regression tests added (budget.test.ts, new describe
    block) prove: the exact reproduction (shared ledger + two guards, a
    $1 ceiling, guard A reserves $0.60, guard B's $0.60 attempt is
    rejected with `BudgetExceededError` before any provider call would
    occur, nothing committed), two concurrent $0.60 reservations across
    two guards cannot both succeed (and guard A's own reservation remains
    intact and commits normally afterward), committed+reserved is
    enforced together across guards, `release()` from either guard
    (including a DIFFERENT guard instance than the one that created the
    reservation) restores exactly the correct capacity via the shared
    ledger, a protected RECONCILIATION_FAILED reservation created via one
    guard remains protected against `release()` from a different guard
    (ownership is defined by the reservation's own scope, not by which
    guard object created it), a correct `commit()` through one guard is
    immediately visible to a sibling guard's own ceiling checks,
    task/project/agent/provider/model ownership dimensions remain
    correctly isolated across guards sharing one ledger, independent
    `CostEngine` ledgers remain fully independent from each other, no
    double accounting occurs regardless of how many guards share a
    ledger, and constructing a second `BudgetGuard` over an existing
    ledger does not reset or hide reservations that already existed on
    it. Verified via a temporary bypass (`CostEngine.reservedTotal()`
    forced to always return 0, simulating the pre-fix "guards blind to
    each other's reservations" symptom) — confirmed 25 tests failed with
    exactly the predicted "expected function to throw but it didn't"
    symptom across this round's new describe block AND every prior round
    whose regression tests depend on `reservedTotal()`, then reverted and
    re-confirmed 622/622 (pre-round-17-total-count) tests passing.

    Targeted audit (16th independent review round, "budget construction
    paths... to ensure multiple guards cannot accidentally form separate
    reservation universes over the same ledger"): grepped every
    `new BudgetGuard(...)` and `new CostEngine()` construction site in
    `runtime/`. Only ONE production construction site exists for each:
    `runtime/project-lifecycle/orchestrator.ts`'s `bootstrapProject()`
    (`const costEngine = callerCostEngine ?? new CostEngine();` followed
    by `const budget = new BudgetGuard(costEngine, budgetGuardLimits);`),
    which only ever calls the non-mutating `assertWithinBudget()` and the
    fully-synchronous `spend()` (never `reserve()`/`commit()`/`release()`)
    — so it was never exposed to this specific race even before the fix,
    though it now also correctly SHARES reservation state across separate
    `bootstrapProject()` calls that pass the same `callerCostEngine`, since
    that state lives on the ledger. `runtime/models/gateway.ts` (which
    does use `reserve()`/`commit()`/`release()`) and `runtime/models/
    router.ts` both take a caller-supplied `budget: BudgetGuard` as a
    dependency and never construct their own `BudgetGuard` or
    `CostEngine` — so any caller sharing one `BudgetGuard`/`CostEngine`
    across concurrent `gateway.invoke()` calls is now structurally safe
    by construction, and no code path was found that could accidentally
    form a separate reservation universe over a shared ledger.

    Round 25 findings 4-5 (BudgetGuard-facing half — see UASF-REQ-0029 for the full CostEngine-level narrative):
    `BudgetGuard.commit()` now delegates its ownership check entirely to `costEngine.commitReservation()`,
    catching `ReservationOwnershipMismatchError` to still emit the same `BUDGET_RESERVATION_OWNERSHIP_MISMATCH`
    audit event as before. `BudgetGuard.release(reservationId, callerScope: ReservationOwnership)`'s signature
    changed to require the same mandatory `callerScope` parameter (every legitimate caller already has this on
    hand — it is the same `scope` returned by the original `reserve()` call), forwarding to
    `costEngine.releaseReservation()` and adding a new `BUDGET_RESERVATION_RELEASE_REJECTED_OWNERSHIP_MISMATCH`
    audit event type on mismatch. All ~24 existing call sites across `budget/__tests__/budget.test.ts` and
    `cost/__tests__/cost-engine.test.ts` updated to pass the appropriate scope. Two new regression tests prove:
    caller B, knowing only caller A's reservation id, cannot release A's active reservation via `BudgetGuard`
    (A's own release still works normally afterward); and a release-ownership mismatch is audited via the new
    event type without marking the reservation RECONCILIATION_FAILED (the legitimate owner can still commit it
    normally).

    P1 fix (27th independent review round, findings 6-8, consolidated closure batch): (6) "keep budget limits
    runtime-private" — `BudgetGuard`'s `#limits` used to be TypeScript compile-time-only `private readonly`;
    `(guard as any).limits = { perTaskUsd: Number.MAX_VALUE }` from any caller holding a reference would silently
    replace the configured ceilings. Converted to a genuine ECMAScript `#limits` private field. (7) "snapshot
    spend entries before checking them" — `BudgetGuard.spend()`/`commit()` and `CostEngine.record()`/
    `commitReservation()` all used to read `entry.amountUsd` (and, in `commit()`'s case, several other `entry.*`
    fields across the ownership check, audit payloads, and the overages check) at MULTIPLE separate points; a
    getter/Proxy-backed `entry` could answer differently for the ceiling check than for what actually gets
    recorded, letting a ceiling-compliant check authorize a wildly different, over-ceiling actual cost. Fixed:
    each method now builds `const snapshot = { ...entry }` as its very first step — a genuine static copy, read
    exactly once — and every subsequent reference uses `snapshot`, never the original `entry` parameter again.
    (8) "require unforgeable reservation ownership" — reservation ids were purely sequential (`res-1`, `res-2`,
    ...) and, combined with `ReservationOwnership`'s ordinary business-predictable scope fields, neither the id
    nor the scope is actually secret; an unrelated caller who could guess/predict a reservation id and construct
    a matching scope could operate (`commitReservation()`/`releaseReservation()`) a reservation it never created.
    Fixed by making the id ITSELF the unguessable capability: `createReservation()` now embeds a genuine
    `randomBytes(16)` (128-bit) suffix alongside the existing monotonic counter (kept purely for human-readable
    log ordering, never load-bearing). No enumeration/list method exists anywhere on `CostEngine`, so "knows the
    unguessable id" now stands alongside "supplies the matching scope" as a second, genuinely unforgeable factor
    — this required zero changes to any of the 101 existing `commit`/`release`/`commitReservation`/
    `releaseReservation` call sites across `budget.test.ts`/`cost-engine.test.ts`, since none ever hardcoded a
    predictable id string. New regression tests (across `budget/__tests__/budget.test.ts` and
    `cost/__tests__/cost-engine.test.ts`): findings 6-7 add not-reachable/no-reflection-exposure/forged-inert-
    property tests for `#limits`, plus BLOCKER regressions for both `spend()` and `commit()` proving a getter
    read exactly once with the checked amount matching the recorded amount, and a Proxy-wrapped-entry test
    tracking per-field read counts; finding 8 adds a 20-id entropy/uniqueness test, a BLOCKER regression proving
    four guessed sequential-style ids (plus the correctly-guessed real scope) are all rejected as
    `UnknownReservationError` while the real owner's real id still works, and a no-enumeration-method-exists
    test. Targeted-audit follow-up (same root class as finding 6, found while auditing this file for other
    genuine TypeScript-private-only authoritative dependencies): `BudgetGuard`'s constructor-parameter
    `costEngine`/`now`/`auditLog` were ALSO still TS-private-only, in the exact same constructor `#limits` was
    just fixed in. `costEngine` is the authoritative dependency EVERY ceiling check (`totalFor`/`total`/
    `totalInWindow`/`reservedTotal`) and EVERY spend/reservation record (`record`/`createReservation`/
    `commitReservation`/`releaseReservation`) reads and writes through — replacing it would silently defeat
    budget enforcement entirely, the identical bug class just reachable through a different property name; `now`
    gates the daily/monthly ceiling WINDOW boundary computation, so replacing it could make every spend appear to
    fall inside a perpetually-fresh window; `auditLog` is the sole channel every `BUDGET_*` event reaches, so
    replacing it could silently erase the audit trail. All three converted to genuine ECMAScript `#costEngine`/
    `#now`/`#auditLog` private fields. Five new regression tests prove: none of the three are reachable as an
    ordinary property or via reflection APIs; a forged `costEngine` property assignment is an inert stray
    property that never reaches real ceiling checks or spend recording (the guard still enforces its original
    ceiling against the REAL cost engine); a forged `now` cannot desynchronize the daily ceiling window; and a
    forged `auditLog` cannot suppress the real audit trail. Every fix in this batch verified via a temporary
    in-place bypass reproducing the exact predicted failure (including a MULTI-LAYER bypass reverting all four
    `snapshot` insertions across `budget.ts`/`cost-engine.ts` simultaneously for finding 7, and reverting the
    `#costEngine`/`#now`/`#auditLog` fields back to TS-private constructor-parameter properties for the audit
    follow-up), then fully reverted: all 119 `budget.test.ts` tests and the full `cost-engine.test.ts` suite
    re-confirmed passing after each revert.

- id: UASF-REQ-0031
  title: Worker registry (foundation)
  description: Register worker classes (linux-general, gpu, macos, ...) with capability metadata; select smallest sufficient worker.
  source_baseline: "BASELINE-V1 section 82, 83, 306 (Proof H)"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/workers/registry.ts"
  test_refs:
    - "runtime/workers/__tests__/registry.test.ts"
  proof_refs:
    - "proofs/smallest-sufficient-worker/proof.test.ts"
  security_refs: []
  notes: >
    P1 cross-cutting fix (3rd independent review round): all()/findCapable()
    returned the internal WorkerRecord objects/array directly — a caller
    could set `worker.status = "IDLE"` on a returned reference to
    un-quarantine a worker (bypassing the "QUARANTINED workers never
    selected" invariant, section 85) with no updateStatus()-equivalent
    method ever involved, or `.capabilities.push(...)` to forge a capability
    the worker doesn't actually have, fooling findCapable(). Fixed:
    register() now stores an independent copy (not the caller's own object
    reference), and all()/findCapable() return frozen, detached snapshots
    (runtime/util/immutable.ts) whose `capabilities` array is also frozen.
    Regression tests prove: mutating a returned worker's status cannot
    un-quarantine it, mutating its capabilities array cannot forge a
    capability, and mutating the object originally passed to register() does
    not affect the registry's own copy. Confirmed via git-stash that these
    tests fail against the pre-fix code.

    P2 fix (7th independent review round targeted audit, found while
    auditing for the same class as models/registry.ts's "invalid model
    prices corrupt cheapest-capable routing"): register() never validated
    `costPerMinuteUsd`, and runtime/scheduler/scheduler.ts runs the
    IDENTICAL cheapest-of-candidates reduce
    (`current.costPerMinuteUsd < cheapest.costPerMinuteUsd`) over this
    registry's records — an unvalidated NaN/negative price would corrupt
    worker selection exactly as an unvalidated costPerCall corrupted model
    routing. Fixed: register() now calls the same centralized
    assertValidMonetaryAmount() validator (runtime/cost/cost-engine.ts)
    before the record is pushed. Regression tests prove: NaN, negative, and
    +Infinity/-Infinity costPerMinuteUsd are all rejected before insertion,
    zero remains valid (free workers), and a poisoned NaN-priced worker
    registered first can no longer corrupt findCapable() results since it
    never enters the registry. Confirmed via git-stash that 4 of these
    tests fail against the pre-fix code.

    P2 fix (9th independent review round, "duplicate worker identities
    break authoritative status"): Codex reproduced worker id X registered
    IDLE, then the SAME id X registered again as QUARANTINED — register()
    never checked for an id collision, so BOTH records remained in the
    array; findCapable() only filters out QUARANTINED, so the stale IDLE
    record was still selectable by ResourceAwareScheduler. Fixed: register()
    now rejects an id collision (new DuplicateWorkerIdError) before any
    mutation — a worker id represents exactly one authoritative identity —
    and a new updateStatus() method is the ONLY way to transition an
    existing worker's status, mutating the authoritative record in place
    rather than ever creating a second record. Regression tests prove:
    first registration succeeds, a duplicate id is rejected with the
    original record completely unchanged, an explicit IDLE->QUARANTINED
    transition works via updateStatus(), a quarantined worker (via
    updateStatus) is never returned by findCapable() OR selected by the
    scheduler, a BUSY worker is excluded from scheduler selection per the
    existing IDLE-only contract (while still appearing in findCapable(),
    which only excludes QUARANTINED), a worker returns to IDLE only
    through an explicit updateStatus() call and is then selectable again,
    updateStatus() on an unregistered id fails closed, and no stale
    duplicate record survives repeated register/reject/updateStatus
    cycles. Confirmed via git-stash that 8 of these tests fail against the
    pre-fix code with exactly the stale-record reproduction Codex
    described.

    Test-coverage gap closed (10th independent review round follow-up,
    "ownership boundaries" preserved by updateStatus()): the prior
    round's tests never directly asserted that the record RETURNED by
    updateStatus() itself is a frozen, detached snapshot — only that
    all()/findCapable() are. The implementation
    (`return freezeRecord(worker);` in updateStatus()) was already
    correct; this closes a test-coverage gap, not a code defect. Added a
    regression test asserting the returned record throws TypeError on a
    status/capabilities mutation attempt, that such an attempt never
    reaches the authoritative record (verified via all()/findCapable()
    immediately after), and that the returned reference is not the same
    object as all()'s. Verified meaningful via a temporary in-place
    bypass (`return worker;` instead of `return freezeRecord(worker);`)
    — confirmed exactly this 1 test fails against the bypassed code,
    then the bypass was reverted and the full suite re-confirmed green.

    P1 fix (25th independent review round targeted audit, same root class as `audit/audit-log.ts`'s "audit
    records must be runtime-private and append-only" — UASF-REQ-0022): the internal `workers` array used
    TypeScript's compile-time-only `private` keyword, reachable at runtime via `(registry as any).workers` or
    plain bracket access, letting a consumer push a fabricated record directly (bypassing `register()`'s
    duplicate-id and monetary-amount validation) or flip a QUARANTINED worker's `status` back to IDLE in place
    (bypassing `updateStatus()` and baseline section 85's worker-quarantine invariant). Converted to a genuine
    ECMAScript `#workers` private field. Three new regression tests prove the field is unreachable via property
    access or any reflection API, and that a plain JS consumer cannot un-quarantine a worker this way. Verified
    via a temporary bypass (reverting to `private workers`) — confirmed exactly the 3 predicted tests failed,
    then reverted and re-confirmed all tests passing.

- id: UASF-REQ-0032
  title: Scheduler (foundation)
  description: Resource-aware task-to-worker assignment favoring the smallest sufficient worker.
  source_baseline: "BASELINE-V1 section 83"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/scheduler/scheduler.ts"
  test_refs:
    - "runtime/scheduler/__tests__/scheduler.test.ts"
  proof_refs:
    - "proofs/smallest-sufficient-worker/proof.test.ts"
  security_refs: []
  notes: >
    P1 fix (24th independent review round, "worker sufficiency must rank before price"): `selectWorker()` used
    to rank candidates by cost ALONE — cost happened to correlate with resource-class weight in every prior
    test/proof, but a cheaper-per-minute GPU/high-memory worker would still have been selected over a sufficient
    smaller worker, exactly the waste baseline section 83 forbids. Added `WORKER_CLASS_EXCESS_WEIGHT` (lower =
    leaner) so ranking is now: capability/resource sufficiency (existing capability filter) -> excess-resource
    minimization (new weight comparison) -> availability (existing IDLE filter) -> cost (tie-break only among
    equally-lean candidates). Regression tests prove a cheaper GPU worker and a cheaper high-memory worker both
    lose to a sufficient smaller worker, while cost still breaks ties within the same weight tier. Verified via
    a temporary bypass (reverting to the old cheapest-of-all reduce) — confirmed exactly the two new
    excess-weight tests failed with the predicted worker selected, then reverted and re-confirmed all passing.

- id: UASF-REQ-0033
  title: Sandbox (foundation)
  description: Path confinement / timeout / output-limit contract for executed actions.
  source_baseline: "BASELINE-V1 section 87"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/sandbox/sandbox.ts"
  test_refs:
    - "runtime/sandbox/__tests__/sandbox.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    Path-traversal confinement (assertWithinRoot) and a promise timeout
    wrapper (withTimeout) only; command controls, output limits, and
    environment filtering are not yet implemented.

    P1 fix (3rd independent review round): added assertValidProjectId() — a
    first-layer identifier-format check (only `[a-zA-Z0-9][a-zA-Z0-9_-]*`,
    rejecting `..`, `.`, `/`, `\`, absolute paths, empty strings, and
    encoded-traversal-looking strings) that runs BEFORE assertWithinRoot()
    ever sees a project id, closing the "../outside project.id" finding (see
    UASF-REQ-0007/0008). Regression tests cover normal ids, `..`/`.`,
    relative and absolute traversal, slash/backslash variants,
    encoded-looking variants, empty ids, and a leading-hyphen/underscore
    case; a new prefix-confusion test also confirms assertWithinRoot()
    itself (the second, independent confinement layer) rejects a sibling
    path that merely shares a string prefix with the root.

    P1 fix (4th independent review round, "symlink filesystem escape still
    exists"): added assertFilesystemConfinement(), a filesystem-aware
    confinement check on top of assertWithinRoot(). It canonicalizes the
    nearest EXISTING ancestor of both `root` and `target` via
    `fs.realpathSync` (which resolves symlink chains, including nested
    ones, and transparently handles a target that does not exist yet by
    resolving only its existing ancestor and appending the not-yet-created
    suffix, which by definition cannot itself be a symlink) before
    verifying containment. Regression tests use REAL temporary directories
    and real `fs.symlinkSync` calls (skipped gracefully, not failed, on a
    platform that cannot create symlinks — an honestly documented
    limitation): a normal directory works, lexical `../` and absolute
    escapes are still blocked, a symlink inside baseDir pointing outside is
    blocked, a symlinked parent directory pointing outside is blocked, a
    nested symlink chain is blocked, nothing outside baseDir is modified on
    rejection, and a direct before/after test proves assertWithinRoot()
    ALONE is fooled by a symlink that assertFilesystemConfinement()
    correctly catches. See UASF-REQ-0007 for the TOCTOU limitation this
    honestly documents rather than hides.

    P1 fix (5th independent review round, "final-destination / dangling
    symlink escape"): the round-4 canonicalizeNearestExisting() helper used
    `existsSync()` to decide whether a path component existed —
    `existsSync()` FOLLOWS symlinks and returns false for a DANGLING one
    (target does not exist), so a dangling symlink was silently treated as
    "not created yet, safe to write through," exactly the case
    `fs.writeFileSync` actually follows and creates a new file at. Fixed:
    every level is now checked with `lstatSync` (never follows symlinks —
    detects the presence of an entry regardless of whether it's dangling)
    before `realpathSync` is attempted; if lstat finds an entry but
    realpath cannot resolve it (the defining signature of a dangling
    symlink), this now fails closed (PathEscapeError) instead of being
    treated as absent. Also strengthened the doc comment on
    assertFilesystemConfinement() per explicit review instruction: it now
    states plainly that the documented TOCTOU residual risk is acceptable
    ONLY for a scoped P0 prototype with trusted filesystem writers, and
    does NOT claim protection against a hostile, concurrently-racing
    writer. Regression tests using real temporary directories and real
    (existing and dangling) symlinks prove: a dangling symlink at the final
    destination is blocked, a dangling symlink as an intermediate/parent
    component is blocked, an existing final-FILE symlink is blocked, a
    dangling final-FILE symlink is blocked (with the outside target
    confirmed never created), no partial/unsafe state is left behind on
    rejection, and normal (non-symlink) project creation still succeeds.
    Confirmed via git-stash that these tests fail against the pre-fix
    (existsSync-based) code.

    P1 fix (6th independent review round, "project-root alias permits
    cross-project writes"): assertFilesystemConfinement()'s containment
    test (`realTarget.startsWith(realRoot + sep)`) only verified the
    resolved target stayed somewhere INSIDE root — it did not verify the
    target resolved to its OWN canonical location. `baseDir/A` as a
    pre-existing symlink to `baseDir/B` passed this prefix test (B is also
    inside baseDir), silently redirecting anything written to "A" into
    B's real directory — a cross-project identity alias, no race
    required. Fixed: the check now compares the LEXICAL relative path
    (root to target, unresolved) against the REAL relative path (resolved
    root to resolved target) and requires exact equality — only the ROOT
    itself may differ between its lexical and real form (harmless OS-level
    normalization, e.g. /tmp -> /private/tmp); the caller-supplied SUFFIX
    (project id, subdirectory, filename) must resolve to the identical
    relative location, with zero symlink-induced redirection anywhere in
    that suffix. This is a strict superset of the old containment check
    (equal relative paths always imply containment), so no previously
    blocked "escape outside root" case is weakened. Regression tests
    (here and at the scaffold/orchestrator level, see UASF-REQ-0007)
    prove: baseDir/A -> baseDir/B is rejected, a not-yet-existing project
    root is never treated as an alias, a nested subdirectory-level alias
    within an established project root is rejected, and every previously
    fixed dangling/final/parent/nested symlink escape remains blocked.
    Confirmed via git-stash that the alias-specific tests fail against
    the pre-fix (round-5, prefix-only) code.

    P1 fix (7th independent review round, "static hard-link aliases permit
    cross-project overwrites"): all prior confinement checks (assertWithinRoot,
    canonicalizeNearestExisting, the lexical-vs-real relative-path equality
    test) reason about a SINGLE path being redirected via a symlink chain —
    none of them can detect a HARD LINK, because two hard-linked paths are
    independent directory entries pointing to the same inode; each
    resolves to ITSELF via realpathSync, with no "redirection" to compare
    against the root. Codex reproduced project B's genome/organization/
    bootstrap-state files already existing, project A's corresponding
    destination paths being hard-linked to them, and bootstrapProject(A)
    silently overwriting B's authoritative content — no race required.
    Fixed: assertFilesystemConfinement() now also calls a new, orthogonal
    assertNoHardLinkAlias() check on the resolved destination — if that
    exact path already exists as a regular file (lstatSync) with
    `nlink > 1`, the write is rejected (new HardLinkAliasError) before any
    mutation, since a multiply-linked file's exclusive ownership cannot be
    proven. This does not weaken any existing check: it fires only for
    ALREADY-EXISTING regular files, so brand-new destinations and plain
    directories (which POSIX cannot hard-link) are unaffected, and all
    previously-fixed symlink/dangling/parent/nested/canonical-root
    protections remain fully active and independently tested. Honestly
    documented platform limitation: `Stats.nlink` may not be reported
    accurately on every filesystem/platform (e.g. some FAT/exFAT or
    virtualized/network filesystems can always report 1 despite a real
    hard link existing) — where the platform DOES report it correctly
    (Linux/macOS ext4/APFS/HFS+, the CI environment), `nlink > 1` is never
    ignored. Regression tests (real filesystem, real fs.linkSync) prove: a
    hard-linked destination is rejected, the exact cross-project
    reproduction is rejected with the other project's content confirmed
    byte-identical afterward, a not-yet-existing destination is unaffected,
    an ordinary singly-linked file still succeeds, a plain directory is
    unaffected, removing the extra hard link (back to nlink 1) restores
    normal acceptance, the error message names the destination and reports
    the link count, and hard-link detection coexists with (does not
    weaken) the symlink-escape and project-root-alias protections.
    Confirmed via git-stash that 4 of these tests fail against the pre-fix
    code with exactly the cross-project overwrite Codex described.

    P2 fix (15th independent review round, "filesystem root containment
    incorrectly rejects valid descendants"): `assertWithinRoot()` used a
    NAIVE STRING-PREFIX check —
    `!resolvedTarget.startsWith(resolvedRoot + sep)`. When `resolvedRoot`
    is ITSELF already a filesystem root (POSIX `/`, a Windows drive root
    like `C:\`), `resolvedRoot + sep` appends the separator a SECOND time
    (`"/" + "/" = "//"`), and NO genuine descendant (e.g. `/tmp`) can ever
    match that doubled-separator prefix — Codex reproduced
    `assertWithinRoot("/", "/tmp")` wrongly throwing `PathEscapeError`
    even though `/tmp` is a completely legitimate descendant of `/`. The
    root cause was the PREFIX CONCATENATION ITSELF, not merely an edge
    case to special-case around. Fixed: containment is now decided by
    reasoning over `path.relative(root, target)`'s RESULT instead —
    `relativePath === ""` means `target` IS `root`; `relativePath === ".."`
    or starting with `".." + sep` means `target` is OUTSIDE `root`
    (a parent, a sibling, or a prefix-collision path like `/safe` vs.
    `/safe-evil` — `path.relative` expresses ALL of these as a leading
    `".."` naturally, with no separator concatenation ever needed); an
    ABSOLUTE relative-path result (checked via `path.isAbsolute`) means no
    common base could be expressed relatively at all (e.g. different
    Windows drive letters — `path.win32.relative("C:\\", "D:\\foo")`
    returns the `to` path unchanged, which is absolute). This logic is
    extracted into a new exported pure predicate,
    `isContainedRelativePath(relativePath, pathOps?)`, parameterized by
    `{ sep, isAbsolute }` (defaulting to the actual runtime platform's
    `node:path` — i.e. genuinely POSIX or genuinely Windows semantics
    depending on what OS this code actually runs on) — this is a STRICT
    correctness fix, not a special case for `/`: it is exactly as correct
    for an ordinary non-root root as the old prefix check was, and
    correctly handles the root-is-itself-a-filesystem-root case the old
    check could never handle by construction. Regression tests
    (sandbox.test.ts, new describe block) prove, on POSIX (this CI's
    actual runtime platform): the exact reproduction
    (`assertWithinRoot("/", "/tmp")` now ACCEPTED), `assertWithinRoot("/",
    "/")` accepted, an ordinary non-root root with a nested candidate is
    unaffected, `/safe` vs `/safe-evil` is still REJECTED, traversal
    above a normal root is still REJECTED (`assertWithinRoot("/safe",
    "..")` throws), traversal "above" the root `/` correctly normalizes
    to `/` itself via `path.resolve` and is ACCEPTED (there is nothing
    above the filesystem root to escape to), a sibling directory is still
    REJECTED, trailing-separator variants of the root (`/safe/`,
    `/safe//`) normalize correctly, and a deeply nested descendant of `/`
    is accepted. Since a POSIX CI machine's `node:path` (`resolve`/
    `relative`/`sep`/`isAbsolute`) is ALWAYS the POSIX implementation
    regardless of the path STRINGS passed to it, genuine Windows
    semantics are verified by feeding `path.win32`'s own
    `relative`/`sep`/`isAbsolute` directly into the exported
    `isContainedRelativePath` predicate (the EXACT same function
    `assertWithinRoot()` uses internally) — proving a drive-root
    descendant, the drive root itself, and a nested non-root-drive
    descendant are all ACCEPTED, while a different drive letter, a
    prefix-collision sibling, and parent traversal above a non-root drive
    path are all REJECTED. Verified via a temporary bypass (reverting to
    the old `startsWith(resolvedRoot + sep)` prefix check) — confirmed
    exactly the 2 tests exercising root-is-`/` behavior fail with the
    EXACT `PathEscapeError` reproduction Codex described (all other new
    tests, including the pure-predicate and Windows-semantics tests,
    correctly stayed green since they don't exercise `assertWithinRoot()`
    itself or don't depend on this specific edge case), then reverted. A
    narrow audit (grepped every `.startsWith(` call combined with a `sep`
    concatenation across `runtime/`) confirmed this was the ONLY instance
    of this exact class in the entire codebase —
    `assertFilesystemConfinement()`'s own lexical-vs-real containment
    check (used for the SAME purpose) already compared two
    `path.relative()` results for EQUALITY rather than concatenating a
    separator onto a prefix, so it was never susceptible to this bug in
    the first place.

    P1 fix (27th independent review round, finding 9, "timeout must actually cancel sandbox work"): `withTimeout()`
    used to accept an already-started, opaque `Promise<T>` and race it against a timer via `Promise.race()` —
    `Promise.race()` only ever stops THIS FUNCTION from waiting any longer; the underlying operation keeps running
    to completion regardless, with no way to observe or prevent whatever side effects it produces after the
    "timeout" already returned to its caller. Explicitly does NOT attempt to retrofit cancellation onto an
    arbitrary, already-started Promise — the finding's own instruction ("do NOT pretend arbitrary Promises are
    cancellable") is structurally impossible to violate with this design, since there is no already-started
    Promise to retrofit. Fixed: `withTimeout()`'s signature changed to accept an `(signal: AbortSignal) =>
    Promise<T>` FACTORY instead — the operation itself must observe and cooperate with cancellation (via
    `fs/promises`' `{signal}` option, `fetch()`'s native `signal` support, `child_process.spawn(..., {signal})`,
    or a manual `signal.addEventListener('abort', ...)` handler); an internal `AbortController` aborts with a
    `SandboxTimeoutError` the moment the timer fires, and the timer is always cleared in a `finally` block
    regardless of outcome. New regression tests prove: the operation genuinely receives an `AbortSignal` instance;
    the abort reason is a `SandboxTimeoutError`; a genuine, real-world "unrelated failure" (the operation itself
    throws something other than an abort) is never masked as a timeout; `withTimeout()` correctly waits for
    genuine settlement when the operation finishes before the deadline; and, as the round's single most rigorous
    regression, a BLOCKER test spawns a REAL child process (`child_process.spawn(process.execPath, ["-e",
    "setTimeout(() => require('fs').writeFileSync(markerPath, 'done'), 300)"], {signal})`), times it out at 30ms,
    then waits 400ms and asserts the marker file was NEVER created — proving actual OS-level process termination,
    not merely "this function stopped waiting" while the child kept running and wrote its side effect anyway (the
    exact failure mode Codex described). Verified via a temporary bypass (reverting to the old opaque-Promise +
    `Promise.race()` implementation) — confirmed the marker file WAS created under the bypass (the real, externally
    observable proof that the pre-fix code let the timed-out operation's side effect complete anyway), then fully
    reverted and re-confirmed the marker file is never created post-fix.

- id: UASF-REQ-0034
  title: Project isolation (foundation)
  description: Cross-project default-deny isolation of filesystem/state/budget/artifacts.
  source_baseline: "BASELINE-V1 section 86"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/project-isolation/isolation.ts"
  test_refs:
    - "runtime/project-isolation/__tests__/isolation.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    Default-deny keyed store proven for the data-access case; filesystem/worker-level isolation is not yet wired to this abstraction.

    P1 fix (24th independent review round, "project writes must require caller identity"): `set()` used to
    accept only a target project id, with no separate caller identity — a caller acting for project A could
    write directly into project B's bucket by passing B's id as the (unchecked) target. `set()` now requires
    BOTH `callerProjectId` and `targetProjectId`, exactly like `get()`/`keysFor()` already did, and rejects a
    mismatch with the same `CrossProjectAccessDeniedError` (default deny now applies uniformly to reads AND
    writes). Regression tests added: cross-project write rejection, a rejected write cannot overwrite a
    victim project's existing data, and a caller cannot write for any project other than its own. Verified via
    a temporary bypass of the new check — confirmed the exact predicted cross-project-write tests failed, then
    reverted and re-confirmed all tests passing.

    P1 fix (25th independent review round, "project isolation must use trusted project identity"): the 24th
    round's dual-string set(callerProjectId, targetProjectId, ...)/get(...)/keysFor(...) API "enforced"
    isolation by comparing two caller-supplied strings — trivially satisfied by a caller simply passing the
    SAME value for both, which established nothing about who the caller actually was. Replaced entirely with a
    capability/closure model: viewFor(trustedProjectId) is called once by trusted assembling code and returns a
    ProjectIsolationView whose own set()/get()/keys() methods take NO project-id parameter at all — cross-
    project access is now structurally inexpressible rather than merely runtime-checked. The old dual-string
    API and CrossProjectAccessDeniedError are removed (confirmed via grep this store had zero production call
    sites outside its own test file, so this is a contained, non-breaking change for the rest of the kernel).
    Test file fully rewritten for the new API, including a regression that smuggles an extra "target project"
    argument via .call() (simulating a type-unsafe caller attempting the old API shape) and confirms it has no
    effect. Verified via a temporary bypass (reintroducing an optional override argument read from arguments)
    — confirmed exactly the predicted smuggling-regression test failed, then reverted and re-confirmed all
    tests passing.

    P2 fix (26th independent review round, finding 5, "detach values across project isolation views"): `set()`
    stored the caller-supplied `value` REFERENCE directly — the same mutable object stored under two different
    projects (or mutated by the caller after storing it) silently corrupted every project's bucket holding that
    reference, breaching isolation without either project ever explicitly writing to the other's bucket. Fixed:
    `set()` now stores `deepFreezeClone(value)` (runtime/util/immutable.ts, the same primitive `audit-log.ts`
    uses) — a full `structuredClone()`-based deep copy, completely detached from the caller's object graph, then
    deep-frozen. Three new regression tests prove: the same mutable object stored in projects A and B is
    unaffected by later mutating the original; a value returned by `get()` cannot be mutated (throws TypeError)
    or reach the authoritative copy; and two `set()` calls with the same input object at different times produce
    independently-captured snapshots. Verified via a temporary bypass (storing the raw reference again) —
    confirmed the exact predicted tests failed, then reverted and re-confirmed all tests passing.

    P1 targeted-audit fix (26th independent review round, same root class as finding 2, "cost ledger state must
    be runtime-private"): the internal `data` Map-of-Maps still used TypeScript's compile-time-only `private`
    keyword. Since this class's entire purpose is that a view returned by `viewFor()` can reach only its own
    bound project's bucket, `(store as any).data.get("other-project")` access would defeat isolation completely
    by reading/writing ANY project's bucket directly, bypassing `viewFor()`'s capability model entirely.
    Converted to a genuine ECMAScript `#data` private field. Three new regression tests prove the field is
    unreachable via property access or any reflection API, and that a plain JS consumer holding the store (not a
    view) cannot reach another project's bucket this way. Verified via a temporary bypass (reverting to `private
    data`) — confirmed exactly the 3 predicted tests failed, then reverted and re-confirmed all tests passing.

