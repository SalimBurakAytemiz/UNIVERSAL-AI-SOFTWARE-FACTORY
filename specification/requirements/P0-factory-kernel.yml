- id: UASF-REQ-0001
  title: Existing public repository audit
  description: >
    Audit the existing target repository's git state (branches, commits,
    working tree) before any implementation work, without creating a new
    repository.
  source_baseline: "BASELINE-V1 section 318, 319"
  category: P0
  priority: CRITICAL
  status: DEFINED
  implementation_refs: []
  test_refs: []
  proof_refs: []
  security_refs: []
  notes: >
    Performed manually at session start via git status/log; repository was
    effectively empty (single "Initial commit", one-line README, clean
    working tree, no other branches/history). That observation is true and
    remains recorded above, but it was never a re-checkable artifact — no
    file, no test, no CI job backs it, only a one-time manual look. P1 fix
    (30th independent review round, finding 7, "reject unverifiable
    free-text evidence references"): this requirement's status was
    downgraded from PROOF_VERIFIED to DEFINED, since a prose claim like
    "Session audit: ..." no longer counts as proof — no unsupported
    upgrade is retained once the evidence bar it was never able to meet is
    honestly enforced (baseline section 294, "no unsupported upgrades",
    applies to keeping an upgrade, not only to making a new one).

- id: UASF-REQ-0002
  title: Public secret / hygiene audit
  description: >
    Scan tracked files and git history for exposed secrets, credentials, and
    sensitive data before major implementation.
  source_baseline: "BASELINE-V1 section 2, 319, 307"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "scripts/secret-scan.mjs"
  test_refs:
    - "tests/secret-scan.test.mjs"
  proof_refs:
    # P1 fix (30th independent review round, finding 7, "reject unverifiable
    # free-text evidence references"): this used to be the free-text
    # sentence "CI job 'secret-scan' in .github/workflows/ci.yml" — prose
    # describing where the proof lives, not itself a resolvable path, so it
    # no longer counts as evidence under the tightened rule (bkz.
    # runtime/requirements-traceability/traceability.ts). Corrected to the
    # real path itself — the SAME true fact, now machine-verifiable.
    - ".github/workflows/ci.yml"
  security_refs:
    - "SECURITY.md"
  notes: >
    Independent review (Codex) found this requirement's description
    ("scan tracked files AND git history") did not match the implementation
    (current tree only) despite being marked PROOF_VERIFIED — a real
    evidence/claim mismatch. Fixed: scanGitHistory()/listHistoricalBlobs()
    in scripts/secret-scan.mjs now scan every unique blob reachable from
    any ref (git rev-list --objects --all), catching a secret committed
    and later deleted. Tested with a real temp-repo commit+delete scenario,
    a redaction check (finding objects never carry the secret value), and
    a dedup check (identical content committed under two paths -> one
    finding, not two). One pre-existing historical finding (commit
    981f0a4, before the `secret-scan:allow` marker existed) is resolved
    via a minimal, exact-match (blob sha + line + pattern) baseline in
    scripts/secret-scan.mjs rather than rewriting public git history.
    Also fixed per the same review: the wholesale file-level allowlist for
    tests/secret-scan.test.mjs and scripts/secret-scan.mjs was removed
    (ALLOWLIST_SUBSTRINGS is now empty) — only the per-line
    `secret-scan:allow` marker can suppress a finding, with regression
    tests proving an unmarked credential anywhere in those files is still
    detected.

    P2 fix (18th independent review round, "secret scanner misses
    project-scoped OpenAI keys in JSON"): Codex reproduced a project-
    scoped OpenAI credential (`sk-proj-<...>`) stored in JSON
    configuration (`{"apiKey": "sk-proj-..."}`) evading both current-tree
    and git-history scanning. Two independent root causes: (1) the
    "OpenAI API key" pattern (`sk-[A-Za-z0-9]{20,}`) required 20+
    CONSECUTIVE alphanumeric characters immediately after `sk-`, with no
    allowance for a hyphen anywhere in that run — `sk-proj-<...>` (and
    OpenAI's other `sk-`-prefixed variants: service-account, admin keys)
    embed a hyphenated segment right after `sk-`, breaking the match at
    the very first hyphen; (2) the "Generic API key/secret assignment"
    pattern required the key name to be followed DIRECTLY by `\s*[:=]`,
    which cannot match across a quoted JSON property name's own closing
    quote (`"apiKey": "..."` has a `"` sitting between the key and the
    `:`), so it silently failed on ordinary JSON while still working for
    unquoted-key syntax (YAML, TOML, shell/.env, plain JS object
    literals). Required invariant: supported secret formats must be
    detected regardless of surrounding syntax (.env, shell/config
    assignment, JSON, YAML, TOML, TS/JS strings), in both current-tree and
    git-history scanning. Fixed: (1) the OpenAI pattern's trailing
    character class was widened to include hyphens/underscores —
    identical to the sibling "Anthropic API key" pattern's own class,
    making this a consistency fix rather than a new allowance — with
    `(?!ant-)` added so it never also re-matches an Anthropic key as a
    duplicate, lower-precision finding on the same line; (2) a SELF-
    CAUGHT false positive during this fix's own verification (a real
    `npm run secret-scan` run against this repository, not a Codex
    reproduction) showed the widened OpenAI pattern now also matched
    ordinary hyphenated English prose where "sk-" appears as the tail of
    a longer word (e.g. "ri" + "sk-5-never-weakens-..." inside this very
    registry's own prose) — something the OLD, pure-alphanumeric trailing
    class could never trigger. Fixed with a negative lookbehind,
    `(?<![A-Za-z0-9])`, requiring the character immediately before `sk-`
    to not itself be a letter/digit — ruling out "risk-"/"desk-"/"task-"
    while leaving every genuine credential-shaped occurrence (always
    preceded by a quote/`=`/`:`/whitespace/start-of-line) completely
    unaffected; (3) the generic pattern gained an optional `['"]?`
    immediately after the key-name group, absorbing a JSON property
    name's optional closing quote without requiring one, so every
    previously-supported unquoted-key syntax keeps matching unchanged.
    Fourteen new regression tests added (tests/secret-scan.test.mjs, new
    describe block plus two git-history cases) prove: detection inside
    single-line and pretty-printed (multi-line, indented) quoted JSON,
    .env-style assignment, YAML-style assignment, TOML-style assignment,
    a TypeScript/JavaScript string assignment, a synthetic `sk-proj-`
    credential committed to git history, that same credential remaining
    detected via history scanning after being deleted from the current
    tree, an Anthropic key never being double-counted as a duplicate
    OpenAI finding, a quoted JSON property with an obviously non-secret
    short value producing no finding, an unrelated string merely starting
    with "sk-" (below the length/shape threshold) producing no finding,
    and a safe `.env.example`-style placeholder for an OpenAI project key
    variable remaining allowed. Verified via a temporary bypass (reverting
    all three regex changes to their pre-fix form) — confirmed exactly the
    10 tests exercising these specific fixes failed with the predicted
    "expected true, got false" symptom, while all other tests (including
    the pre-existing historical-baseline precision test) stayed green,
    then reverted and re-confirmed all tests passing. The self-caught
    false positive above was itself independently verified the same way:
    with the lookbehind removed, a real `npm run secret-scan` run
    reproduced the exact spurious finding at
    `specification/requirements/P0-factory-kernel.yml`'s own prose before
    the lookbehind was restored.

    Narrow audit (18th independent review round, same root class:
    "supported provider credential format missed due to prefix/syntax
    variant"): reviewed every OTHER pattern in `PATTERNS` for the same
    class of gap. Found and fixed two more genuine instances: AWS's
    "AWS Access Key ID" pattern (`AKIA[0-9A-Z]{16}`) covered only the
    long-term access-key-ID prefix, missing `ASIA` — AWS's equally real,
    currently-issued temporary/STS credential prefix (arguably more
    commonly leaked, since STS credentials are minted and pasted around
    far more often in CI/session contexts); GitHub's "GitHub token"
    pattern (`gh[pousr]_[A-Za-z0-9]{20,}`) covered the classic PAT/OAuth/
    app-token prefixes but missed `github_pat_` — GitHub's newer, now-
    RECOMMENDED fine-grained personal access token format, which uses an
    entirely different, non-single-character prefix. Both broadened
    (`(AKIA|ASIA)[0-9A-Z]{16}` and an alternation adding
    `github_pat_[A-Za-z0-9_]{20,}` respectively) with two more regression
    tests proving detection of each new variant. Slack's token pattern's
    own minor legacy gap (missing the deprecated `xoxo` prefix) was
    deliberately NOT touched — a legacy, rarely-issued format, out of
    scope for this narrowly-targeted audit. `secret-scan:allow` continues
    to be the ONLY suppression mechanism (no new allowlist entries added);
    `KNOWN_HISTORICAL_FIXTURE_FINDINGS` gained three new, individually-
    verified (exact blob sha + line + pattern, content confirmed via
    `git cat-file`) entries for pre-existing historical blobs of
    `runtime/telemetry/__tests__/logger.test.ts` that the widened OpenAI
    pattern newly and correctly surfaced — a genuinely fake fixture value
    already documented as fake on an adjacent, previously-marked line in
    those same historical commits, not a real secret and not reachable
    through any broader exclusion.

    P1 fix (23rd independent review round, "secret scanner must detect
    unquoted assignments"): the "Generic API key/secret assignment"
    pattern required the VALUE half to be wrapped in quotes, so a
    perfectly common unquoted assignment (a shell/.env-style KEY=value
    line, or a YAML-style key: value line — see the regression tests
    below for concrete illustrative examples, not reproduced here to
    avoid confusing this prose itself with secret-shaped content) evaded
    detection entirely. Fixed by
    widening the value alternation to accept a single-quoted, double-
    quoted, OR unquoted bare value (still 12+ characters from the same
    restricted class, so it naturally stops at whitespace rather than
    spanning into prose) — additive, not a loosening of the existing
    quoted case. Re-running the scanner against this repository's real
    tree/history surfaced one genuine self-caught false positive (this
    requirement file's own prior-round prose containing illustrative
    unquoted example text), resolved with `secret-scan:allow` markers on
    those two lines, matching the established precedent from the 18th
    round's identical self-caught false positive. Regression tests added
    for unquoted .env/shell, YAML, TOML, and JS/TS forms (current-tree and
    git-history), confirming the pre-existing quoted forms remain
    detected unchanged. Verified against this repository's real tree and
    full git history: PASS.

    P2 fix (24th independent review round, "secret history scan must fail closed on unreadable blobs"):
    `readBlobContent()` used to catch EVERY error (a `maxBuffer` overrun on an unusually large historical blob,
    a transient `git cat-file` failure) and return `null`, which `scanGitHistory()` then treated identically to
    "this blob is binary, skip it" — a blob that could not be READ was never actually SCANNED, so the scanner
    could report an honest-looking PASS despite never inspecting a reachable historical blob's content at all.
    Fixed: `readBlobContent()` no longer swallows errors (and `maxBuffer` was raised from 64 MiB to 512 MiB to
    make genuine truncation far less likely in the first place); `scanGitHistory()` now returns
    `{ findings, unreadableBlobs }`, and `main()` treats ANY unreadable blob as a fail-closed scan result,
    reported explicitly (path/sha/reason), never silently absorbed into an implicit PASS. A deterministic
    regression (via a scoped `vi.mock("node:child_process")` intercepting only the exact `git cat-file -p <sha>`
    call for one targeted blob) proves an unreadable historical blob is reported as a coverage failure and that
    the secret inside that SPECIFIC blob was never actually scanned — avoiding the impracticality of committing
    an actual multi-hundred-MB blob into a throwaway test repo just to exceed maxBuffer. Targeted-audit fix for
    the SAME root class found in the sibling current-tree scan: `scanFile()` had an identical silent
    `catch { return []; }` for any file `git ls-files` reports as tracked that then fails to read (a
    permissions error, a race with a concurrent delete) — fixed the same way (no longer catches; `main()`'s new
    `scanCurrentTree()` helper collects per-file read failures and folds them into the same fail-closed
    reporting, `unreadableFiles`). All existing `scanGitHistory()` callers (8 sites in
    tests/secret-scan.test.mjs) updated for the new return shape, each now also asserting zero unreadable blobs
    for the non-regression cases. Verified via two temporary bypasses (restoring the old silent-catch in
    `readBlobContent()`, and removing `scanFile()`'s new no-catch behavior) — confirmed the exact predicted
    failures (a `TypeError` crash on `null` content for the first, since the removed `!content` guard was no
    longer needed once the try/catch was legitimately removed; a thrown-error assertion failure for the second),
    then both reverted and re-confirmed the full 45-test suite and a real `npm run secret-scan` run against this
    repository both passing/PASS.

