- id: UASF-REQ-0027
  title: Cheapest-capable-model router
  description: >
    Classify task complexity/risk/required capabilities, select the
    lowest-cost model in the registry that satisfies them; never select a
    premium model for a trivial task.
  source_baseline: "BASELINE-V1 section 62, 63, 306 (Proof A/B)"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/models/router.ts"
  test_refs:
    - "runtime/models/__tests__/router.test.ts"
  proof_refs:
    - "proofs/cheapest-capable-model/proof.test.ts"
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Independent review (Codex) found that escalation (in routeAndExecute)
    was computed from initialDecision.requiredTier (the risk-derived
    minimum) rather than initialDecision.model.tier (the model actually
    selected). When a capability requirement forces a pricier model than
    the risk floor demands, this could re-select the exact same (or an
    equally weak) model on "escalation" instead of genuinely moving up a
    tier. Fixed in runtime/models/router.ts; regression tests in
    router.test.ts construct a registry where only STANDARD/PREMIUM-tier
    models support a capability at risk 0, and assert escalation lands on
    PREMIUM (never re-selecting the STANDARD model), that premium fallback
    is still blocked by default in this scenario, and that being already
    at the top tier throws NoCapableModelError instead of looping. The
    pre-fix code was confirmed to fail these exact tests before the fix
    (reverted and re-run manually during review).

    Second-round finding (Codex): once escalation began, the escalated
    (fallback) model's response was invoked but never passed back through
    `validate()` — routeAndExecute returned it unconditionally, meaning an
    invalid response from a pricier model could bypass validation entirely.
    Fixed: routeAndExecute now validates every candidate, including every
    escalation step, in a bounded loop over TIER_ORDER; if the top tier
    (CRITICAL_REVIEW) is reached and still fails validation, it now throws
    the new EscalationExhaustedError (fail closed) rather than returning
    unvalidated output. Regression tests added: primary fails/first
    escalation passes (validate called on both, in order), primary and all
    escalations fail -> EscalationExhaustedError after validating every
    tier exactly once, an invalid PREMIUM-tier fallback cannot be accepted
    merely because it is pricier (validation only passes at CRITICAL_REVIEW),
    and premium fallback policy is still enforced before any escalation is
    attempted (PremiumFallbackBlockedError after exactly one validate call).
    Confirmed via git-stash that these tests fail against the pre-fix code.

