- id: UASF-REQ-0033
  title: Sandbox (foundation)
  description: Path confinement / timeout / output-limit contract for executed actions.
  source_baseline: "BASELINE-V1 section 87"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/sandbox/sandbox.ts"
  test_refs:
    - "runtime/sandbox/__tests__/sandbox.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    Path-traversal confinement (assertWithinRoot) and a promise timeout
    wrapper (withTimeout) only; command controls, output limits, and
    environment filtering are not yet implemented.

    P1 fix (3rd independent review round): added assertValidProjectId() — a
    first-layer identifier-format check (only `[a-zA-Z0-9][a-zA-Z0-9_-]*`,
    rejecting `..`, `.`, `/`, `\`, absolute paths, empty strings, and
    encoded-traversal-looking strings) that runs BEFORE assertWithinRoot()
    ever sees a project id, closing the "../outside project.id" finding (see
    UASF-REQ-0007/0008). Regression tests cover normal ids, `..`/`.`,
    relative and absolute traversal, slash/backslash variants,
    encoded-looking variants, empty ids, and a leading-hyphen/underscore
    case; a new prefix-confusion test also confirms assertWithinRoot()
    itself (the second, independent confinement layer) rejects a sibling
    path that merely shares a string prefix with the root.

    P1 fix (4th independent review round, "symlink filesystem escape still
    exists"): added assertFilesystemConfinement(), a filesystem-aware
    confinement check on top of assertWithinRoot(). It canonicalizes the
    nearest EXISTING ancestor of both `root` and `target` via
    `fs.realpathSync` (which resolves symlink chains, including nested
    ones, and transparently handles a target that does not exist yet by
    resolving only its existing ancestor and appending the not-yet-created
    suffix, which by definition cannot itself be a symlink) before
    verifying containment. Regression tests use REAL temporary directories
    and real `fs.symlinkSync` calls (skipped gracefully, not failed, on a
    platform that cannot create symlinks — an honestly documented
    limitation): a normal directory works, lexical `../` and absolute
    escapes are still blocked, a symlink inside baseDir pointing outside is
    blocked, a symlinked parent directory pointing outside is blocked, a
    nested symlink chain is blocked, nothing outside baseDir is modified on
    rejection, and a direct before/after test proves assertWithinRoot()
    ALONE is fooled by a symlink that assertFilesystemConfinement()
    correctly catches. See UASF-REQ-0007 for the TOCTOU limitation this
    honestly documents rather than hides.

    P1 fix (5th independent review round, "final-destination / dangling
    symlink escape"): the round-4 canonicalizeNearestExisting() helper used
    `existsSync()` to decide whether a path component existed —
    `existsSync()` FOLLOWS symlinks and returns false for a DANGLING one
    (target does not exist), so a dangling symlink was silently treated as
    "not created yet, safe to write through," exactly the case
    `fs.writeFileSync` actually follows and creates a new file at. Fixed:
    every level is now checked with `lstatSync` (never follows symlinks —
    detects the presence of an entry regardless of whether it's dangling)
    before `realpathSync` is attempted; if lstat finds an entry but
    realpath cannot resolve it (the defining signature of a dangling
    symlink), this now fails closed (PathEscapeError) instead of being
    treated as absent. Also strengthened the doc comment on
    assertFilesystemConfinement() per explicit review instruction: it now
    states plainly that the documented TOCTOU residual risk is acceptable
    ONLY for a scoped P0 prototype with trusted filesystem writers, and
    does NOT claim protection against a hostile, concurrently-racing
    writer. Regression tests using real temporary directories and real
    (existing and dangling) symlinks prove: a dangling symlink at the final
    destination is blocked, a dangling symlink as an intermediate/parent
    component is blocked, an existing final-FILE symlink is blocked, a
    dangling final-FILE symlink is blocked (with the outside target
    confirmed never created), no partial/unsafe state is left behind on
    rejection, and normal (non-symlink) project creation still succeeds.
    Confirmed via git-stash that these tests fail against the pre-fix
    (existsSync-based) code.

    P1 fix (6th independent review round, "project-root alias permits
    cross-project writes"): assertFilesystemConfinement()'s containment
    test (`realTarget.startsWith(realRoot + sep)`) only verified the
    resolved target stayed somewhere INSIDE root — it did not verify the
    target resolved to its OWN canonical location. `baseDir/A` as a
    pre-existing symlink to `baseDir/B` passed this prefix test (B is also
    inside baseDir), silently redirecting anything written to "A" into
    B's real directory — a cross-project identity alias, no race
    required. Fixed: the check now compares the LEXICAL relative path
    (root to target, unresolved) against the REAL relative path (resolved
    root to resolved target) and requires exact equality — only the ROOT
    itself may differ between its lexical and real form (harmless OS-level
    normalization, e.g. /tmp -> /private/tmp); the caller-supplied SUFFIX
    (project id, subdirectory, filename) must resolve to the identical
    relative location, with zero symlink-induced redirection anywhere in
    that suffix. This is a strict superset of the old containment check
    (equal relative paths always imply containment), so no previously
    blocked "escape outside root" case is weakened. Regression tests
    (here and at the scaffold/orchestrator level, see UASF-REQ-0007)
    prove: baseDir/A -> baseDir/B is rejected, a not-yet-existing project
    root is never treated as an alias, a nested subdirectory-level alias
    within an established project root is rejected, and every previously
    fixed dangling/final/parent/nested symlink escape remains blocked.
    Confirmed via git-stash that the alias-specific tests fail against
    the pre-fix (round-5, prefix-only) code.

    P1 fix (7th independent review round, "static hard-link aliases permit
    cross-project overwrites"): all prior confinement checks (assertWithinRoot,
    canonicalizeNearestExisting, the lexical-vs-real relative-path equality
    test) reason about a SINGLE path being redirected via a symlink chain —
    none of them can detect a HARD LINK, because two hard-linked paths are
    independent directory entries pointing to the same inode; each
    resolves to ITSELF via realpathSync, with no "redirection" to compare
    against the root. Codex reproduced project B's genome/organization/
    bootstrap-state files already existing, project A's corresponding
    destination paths being hard-linked to them, and bootstrapProject(A)
    silently overwriting B's authoritative content — no race required.
    Fixed: assertFilesystemConfinement() now also calls a new, orthogonal
    assertNoHardLinkAlias() check on the resolved destination — if that
    exact path already exists as a regular file (lstatSync) with
    `nlink > 1`, the write is rejected (new HardLinkAliasError) before any
    mutation, since a multiply-linked file's exclusive ownership cannot be
    proven. This does not weaken any existing check: it fires only for
    ALREADY-EXISTING regular files, so brand-new destinations and plain
    directories (which POSIX cannot hard-link) are unaffected, and all
    previously-fixed symlink/dangling/parent/nested/canonical-root
    protections remain fully active and independently tested. Honestly
    documented platform limitation: `Stats.nlink` may not be reported
    accurately on every filesystem/platform (e.g. some FAT/exFAT or
    virtualized/network filesystems can always report 1 despite a real
    hard link existing) — where the platform DOES report it correctly
    (Linux/macOS ext4/APFS/HFS+, the CI environment), `nlink > 1` is never
    ignored. Regression tests (real filesystem, real fs.linkSync) prove: a
    hard-linked destination is rejected, the exact cross-project
    reproduction is rejected with the other project's content confirmed
    byte-identical afterward, a not-yet-existing destination is unaffected,
    an ordinary singly-linked file still succeeds, a plain directory is
    unaffected, removing the extra hard link (back to nlink 1) restores
    normal acceptance, the error message names the destination and reports
    the link count, and hard-link detection coexists with (does not
    weaken) the symlink-escape and project-root-alias protections.
    Confirmed via git-stash that 4 of these tests fail against the pre-fix
    code with exactly the cross-project overwrite Codex described.

