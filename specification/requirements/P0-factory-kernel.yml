- id: UASF-REQ-0007
  title: Project Factory / Project OS foundation
  description: >
    Ability to scaffold an isolated per-project directory structure
    (project-definition, requirements, decisions, assumptions, state, etc.).
  source_baseline: "BASELINE-V1 section 26"
  category: P0
  priority: MEDIUM
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/project-os/scaffold.ts"
    - "runtime/project-lifecycle/orchestrator.ts"
  test_refs:
    - "runtime/project-os/__tests__/scaffold.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Now wired into the full pipeline via runtime/project-lifecycle/orchestrator.ts:
    scaffolding only happens inside a Capability Gateway authorization, and the
    Organization Composer's output is persisted into the scaffolded structure.

    P1 fix (3rd independent review round): Codex reproduced `project.id =
    "../outside"` reaching scaffoldProjectOs() and escaping baseDir onto the
    real filesystem. Fixed with two independent layers: (1) format validation
    — a new assertValidProjectId() (runtime/sandbox/sandbox.ts) accepts only
    `[a-zA-Z0-9][a-zA-Z0-9_-]*`, called from parseProjectGenome() (see
    UASF-REQ-0008) so no downstream step ever sees an unsafe id; (2)
    destination confinement — scaffoldProjectOs() itself now resolves the
    project root via assertWithinRoot() (trusted path API) and verifies
    containment inside baseDir BEFORE any mkdirSync call, and orchestrator.ts
    performs the same confinement check immediately after genome validation,
    before the Capability Gateway / policy check (PROJECT ID -> VALIDATE ->
    RESOLVE BASE -> RESOLVE DESTINATION -> VERIFY INSIDE BASE -> POLICY CHECK
    -> FILESYSTEM MUTATION). Regression tests (orchestrator.test.ts,
    scaffold.test.ts) prove: a normal id still works, "../outside" and
    "../../outside" are rejected before any mutation, an absolute path is
    rejected, slash/backslash traversal variants are rejected, a sibling
    directory outside baseDir is never touched, and scaffoldProjectOs()
    itself refuses to escape even when called directly. Confirmed via
    git-stash that the pre-fix code genuinely wrote outside baseDir
    (observed writing to /tmp/outside and /tmp/escape-attempt on the real
    filesystem) and that the fix closes this.

    P1 fix (4th independent review round, "symlink filesystem escape still
    exists"): the round-3 fix above was purely LEXICAL (path.resolve +
    startsWith) — it never checked whether a path component was actually a
    symlink pointing outside baseDir. Fixed: added
    assertFilesystemConfinement() (runtime/sandbox/sandbox.ts, see
    UASF-REQ-0033) which canonicalizes the nearest existing ancestor of
    both root and target via realpathSync (resolving any symlink chain,
    including nested ones) before checking containment, and scaffoldProjectOs()
    / orchestrator.ts now call it instead of the lexical-only check, before
    any filesystem mutation or policy check. Regression tests using REAL
    temporary directories and real symlinks (not mocks) prove: a normal
    project still works, a symlink planted inside baseDir pointing outside
    is blocked (both at the project-root level and at a subdirectory
    level), a symlinked parent directory pointing outside is blocked, a
    nested symlink chain is blocked, nothing outside baseDir is modified
    when confinement is rejected, and — the clearest before/after evidence
    — assertWithinRoot() ALONE is shown to be fooled by the exact same
    symlink that assertFilesystemConfinement() correctly rejects. Known,
    honestly-documented limitation: this is a check-then-use (TOCTOU)
    pattern, not an atomic syscall-level guarantee; Node's portable fs API
    has no cross-platform equivalent of Linux's openat2
    RESOLVE_NO_SYMLINKS, so a symlink swapped in the narrow window between
    the check and the actual mkdirSync is a residual, accepted risk at P0.

    P1 fix (5th independent review round, "final-destination / dangling
    symlink escape"): Codex found two remaining, no-race-required gaps.
    (1) The round-4 canonicalization walked ancestors using `existsSync()`,
    which FOLLOWS symlinks — for a DANGLING symlink (target does not
    exist), `existsSync()` returns false, indistinguishable from "nothing
    here yet." The old code treated a dangling symlink exactly like an
    empty, safely-creatable path, so it was never even inspected — but
    `fs.writeFileSync` on a dangling symlink FOLLOWS it and creates the
    file at the symlink's real (possibly outside-baseDir) target. Fixed in
    canonicalizeNearestExisting() (runtime/sandbox/sandbox.ts, see
    UASF-REQ-0033): every level is now checked with `lstatSync` (does NOT
    follow symlinks — answers "is there literally an entry here," dangling
    or not) before attempting `realpathSync`; if lstat finds something but
    realpath cannot resolve it (only possible for a dangling symlink), this
    now fails closed instead of being silently treated as "not yet
    created." (2) orchestrator.ts's three stateStore.write() calls used
    plain `join()` with NO confinement check on the final file path at all
    — even a scaffold-confined project root could have its
    genome.json/organization.json/bootstrap.json final filename replaced by
    an attacker (or a stale artifact) with a real or dangling symlink
    before the write. Fixed: each of those three paths is now resolved via
    assertFilesystemConfinement(scaffold.projectRoot, ...) immediately
    before the write. Regression tests using REAL temporary directories and
    real (existing and dangling) symlinks prove: a dangling symlink at the
    final destination is blocked, a dangling symlink used as an
    intermediate/parent component is blocked, an existing final-FILE
    symlink is blocked, a dangling final-FILE symlink is blocked, nothing
    outside baseDir is created in any case, and a full end-to-end
    bootstrapProject() test proves a dangling symlink planted at the exact
    state-file path (replacing a real file from a prior legitimate
    bootstrap) is rejected rather than followed on a second, idempotent
    bootstrap call. Confirmed via git-stash that these tests fail against
    the pre-fix (round-4) code — the pre-fix orchestrator.ts genuinely
    resolved the bootstrapProject() promise instead of rejecting, meaning
    it silently followed the dangling symlink. Codex's instruction is
    followed exactly: the documented TOCTOU residual limitation is honest
    and unchanged (this fix closes the reproducible, no-race escape; it
    does not and cannot claim protection against a hostile, concurrently
    racing filesystem writer, which is out of scope for this P0 prototype).

    P1 fix (6th independent review round, "project-root alias permits
    cross-project writes"): Codex reproduced `baseDir/A` as a PRE-EXISTING
    symlink to `baseDir/B` (both inside baseDir, no race required).
    assertFilesystemConfinement()'s round-5 check only verified that the
    REAL (resolved) target stayed somewhere INSIDE baseDir (a prefix
    test) — since B is also inside baseDir, that check passed, and
    bootstrapping project A silently scaffolded/wrote into project B's
    real directory, overwriting B's genome with A's data. Fixed in
    runtime/sandbox/sandbox.ts (see UASF-REQ-0033): the confinement check
    now compares the RELATIVE path from root to target LEXICALLY against
    the RELATIVE path from the resolved root to the resolved target — any
    symlink indirection that changes WHICH entry a path resolves to (not
    just whether it stays inside the root) is now rejected, closing the
    alias/identity-reuse case while remaining a strict superset of the
    prior containment check (every previously-blocked "escape outside
    baseDir" case is still blocked). Regression tests prove: normal
    project A creation still succeeds, baseDir/A -> baseDir/B is rejected
    at the sandbox layer AND at the full bootstrapProject() level, a
    second bootstrap of colliding project A cannot overwrite project B's
    genome/organization/state files (confirmed byte-identical before and
    after the rejected attempt), the rejection happens before any file is
    touched, a nested alias variant (a subdirectory inside a real project
    root aliasing a sibling subdirectory) is also rejected, and all
    previously-fixed dangling/final/parent symlink escapes remain blocked
    under the stricter check. Confirmed via git-stash that these tests
    (including the full end-to-end bootstrapProject() test showing the
    pre-fix code's resolved projectRoot was silently the alias target)
    fail against the pre-fix (round-5) code.

    P1 fix (7th independent review round, "static hard-link aliases permit
    cross-project overwrites"): Codex reproduced project B already having
    genome/organization/bootstrap-state files, project A's corresponding
    destination files being HARD-LINKED (not symlinked) to B's files, and
    bootstrapProject(A) then overwriting B's authoritative content — no
    race required. The round-6 lexical-vs-real relative-path check cannot
    catch this structurally: a hard link has no "resolve target" the way a
    symlink does (two hard-linked paths are independent directory entries
    to the same inode, each resolving to itself via realpath). Fixed with a
    new, orthogonal check in assertFilesystemConfinement() (see
    UASF-REQ-0033): before returning a validated destination, if that exact
    path already exists as a regular file with `lstatSync(path).nlink > 1`,
    the write is rejected (HardLinkAliasError, fail closed) since exclusive
    ownership of a multiply-linked file cannot be proven. Regression tests
    (real filesystem, real fs.linkSync) prove: a hard-linked destination is
    rejected, the exact cross-project reproduction (project A's genome.json
    hard-linked to project B's existing genome.json) is rejected with B's
    content confirmed untouched, a brand-new (not-yet-existing) destination
    is unaffected (no false positive), an ordinary singly-linked existing
    file still succeeds, plain directories are unaffected (POSIX
    directories cannot be hard-linked), removing the extra link restores
    normal behavior, and all previously-fixed symlink/alias protections
    remain active. Confirmed via git-stash that 4 of these tests fail
    against the pre-fix code with exactly this reproduction.

- id: UASF-REQ-0008
  title: Project Genome schema
  description: Machine-readable Project Genome YAML schema and validator.
  source_baseline: "BASELINE-V1 section 27"
  category: P0
  priority: MEDIUM
  status: PROOF_VERIFIED
  implementation_refs:
    - "schemas/project-genome.schema.json"
    - "runtime/project-genome/genome.ts"
  test_refs:
    - "runtime/project-genome/__tests__/genome.test.ts"
    - "runtime/organization-composer/__tests__/composer.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Schema covers the shape from the baseline's own example; not every nested
    field of every future subsystem is modeled yet. Now consumed directly by
    the Organization Composer and the full bootstrap pipeline.

    P1 fix (3rd independent review round): the JSON Schema alone only
    required project.id to be a non-empty string, which let a path-traversal
    value like "../outside" pass genome validation. parseProjectGenome() now
    additionally calls assertValidProjectId() (see UASF-REQ-0007/0033) right
    after schema validation succeeds, so an unsafe id is rejected at the
    earliest possible point (fail closed) before any downstream consumer
    (Organization Composer, Project OS scaffold) ever sees it.

    P1 fix (8th independent review round, "caller mutation changes project
    identity during bootstrap"): parseProjectGenome() used to validate,
    then return `candidate as ProjectGenome` — the SAME object reference
    the caller supplied, including its nested `project` object. Codex
    reproduced bootstrapProject() starting for project A while the caller
    still held (and later mutated) `genomeCandidate.project.id` from A to
    B before the async pipeline finished; because the returned genome was
    never detached, later steps that read `genome.project.id` after an
    `await` boundary could observe the caller's later mutation, drifting
    authoritative project identity mid-operation. Fixed: parseProjectGenome()
    now calls `deepFreezeClone()` (structuredClone + recursive
    Object.freeze, runtime/util/immutable.ts) on the candidate BEFORE
    validation, validates and applies assertValidProjectId() to that
    detached copy, and returns ONLY the detached, frozen clone — no
    downstream code path (authorization, filesystem root, cost
    attribution, persistence) ever sees a reference the caller can still
    reach. Regression tests prove: mutating the original candidate's
    nested project.id/family/business.capabilities after parseProjectGenome()
    never changes the returned genome, the returned genome is a genuinely
    distinct, deeply frozen object, an invalid genome still fails closed
    before any detachment side effect, and — at the full bootstrapProject()
    level — a caller mutating `genomeCandidate.project.id` from A to B
    while the async pipeline is still in flight never changes which
    project's directory is scaffolded, which genome is persisted, or which
    project cost is attributed to. Confirmed via git-stash that 7 of these
    tests (including the full end-to-end orchestrator reproduction) fail
    against the pre-fix code.

