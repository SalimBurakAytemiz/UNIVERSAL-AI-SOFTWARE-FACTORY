- id: UASF-REQ-0024
  title: Model gateway
  description: Provider-abstraction interface so core tests never require paid APIs.
  source_baseline: "BASELINE-V1 section 59"
  category: P0
  priority: CRITICAL
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/models/gateway.ts"
  test_refs:
    - "runtime/models/__tests__/gateway.test.ts"
  proof_refs:
    - "proofs/cheapest-capable-model"
  security_refs: []
  notes: >
    P1 fix (10th independent review round, "public ModelGateway.invoke()
    bypasses enforcement"): Codex reproduced a direct `gateway.invoke()`
    call reaching a provider with NO PolicyEngine, approval enforcement,
    BudgetGuard, reservation, or cost accounting at all — router.ts's own
    guard (UASF-REQ-0027's fix) could always be bypassed by any OTHER
    caller with a reference to the same gateway, and the e2e-p0-kernel
    proof (proofs/e2e-p0-kernel/proof.test.ts) was a live, uncontested
    example of exactly this. This is a genuinely different, more severe
    class than "one caller forgot to check policy" — it means NO amount
    of fixing router.ts alone can ever establish "every real invocation is
    authorized" as a system-wide invariant, since gateway.invoke() itself
    was the actual boundary that needed to enforce it. Fixed by moving the
    ENTIRE guard into ModelGateway.invoke() itself (Option A+B+C from the
    review: raw invocation made structurally private AND an authoritative
    context made non-optional AND one centralized boundary used by every
    caller) — `invoke(model, request, context: ModelInvocationContext)`
    requires `context.policy`/`context.budget` (no optional flag exists to
    skip them; this is a compile error, not a runtime toggle), evaluates
    the SAME CapabilityGateway/PolicyEngine used everywhere else in the
    Factory, reserves the projected cost via BudgetGuard.reserve() BEFORE
    ever touching a provider, invokes the provider only after a successful
    reservation, then commits the actual cost (or releases the reservation
    on provider failure — bkz. UASF-REQ-0030). The raw provider call moved
    to a genuine ECMAScript private method (`#rawInvoke`, using `#`, not
    TypeScript's `private` keyword which is compile-time-only and still a
    real, callable property in the emitted JS) — this is enforced by the
    JavaScript runtime itself, not a naming convention a determined caller
    (or `as any`) could talk its way past. Regression tests
    (gateway.test.ts) prove: DENY blocks invocation with zero provider
    calls, the PolicyEngine's own risk-5 APPROVAL_REQUIRED floor blocks
    invocation with zero provider calls, insufficient budget blocks
    invocation with zero provider calls, the reservation happens before
    the provider ever resolves, a successful invocation is accounted for
    exactly once, a later validation failure (which lives in router.ts,
    downstream of this commit) cannot erase the already-recorded cost, a
    failing provider call releases its reservation rather than recording a
    phantom cost, fallback/escalation candidates go through this exact
    same boundary (no parallel "fast path"), and omitting policy/budget is
    a compile-time error by construction (no runtime branch to test).
    Verified via a temporary in-place bypass (an early `return
    this.#rawInvoke(...)` before the guard, keeping the real signature) —
    confirmed exactly 7 of the 12 gateway tests fail against the bypassed
    code (the ones exercising DENY/approval/budget/reservation/commit/
    release/concurrency), then reverted. proofs/e2e-p0-kernel/proof.test.ts
    was updated to use this same guarded call instead of its previous
    direct gateway.invoke() + manual budget.spend().

- id: UASF-REQ-0025
  title: Model registry
  description: Registry of provider/model records with capabilities, cost_class, tier, status.
  source_baseline: "BASELINE-V1 section 60, 61"
  category: P0
  priority: CRITICAL
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/models/registry.ts"
    - "schemas/model.schema.json"
  test_refs:
    - "runtime/models/__tests__/registry.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    P1 fix (4th independent review round, targeted follow-up ownership
    audit): register() stored the caller's object reference directly, and
    all()/findCapable() returned the internal array UNCHANGED (no copy, no
    freeze at all — the most severe form of this bug found in the audit).
    A caller holding a reference to a registered (or returned) model
    record could mutate `costPerCall` downward to bias cheapest-capable
    routing, flip `status` from DEPRECATED/RETIRED to ACTIVE to bypass the
    "never auto-selected" rule, or add a `capabilities` entry the model
    doesn't actually support (bölüm 60-64, cost/routing integrity). Fixed:
    register() now stores an independent, frozen copy; all()/findCapable()
    return frozen, detached snapshots. Regression tests prove mutating the
    object passed into register() (or a returned record's costPerCall/
    capabilities) cannot affect subsequent routing decisions. Confirmed
    via git-stash that these tests fail on the pre-fix code.

    P2 fix (7th independent review round, "invalid model prices corrupt
    cheapest-capable routing"): register() never validated `costPerCall` at
    all — Codex reproduced a premium candidate registered FIRST with
    `costPerCall: NaN` being SELECTED over a genuinely cheaper, capable free
    candidate, because `NaN < x`/`x < NaN` comparisons are always false,
    breaking router.ts's cheapest-of reduce in a way that favors the
    first-registered candidate regardless of actual cost. Fixed: register()
    now calls the EXISTING centralized validator
    (assertValidMonetaryAmount, runtime/cost/cost-engine.ts — not a
    divergent rule) on `costPerCall` before the record ever reaches
    `this.models`; a rejected registration leaves the registry completely
    unmutated. Regression tests prove: NaN/+Infinity/-Infinity/negative
    costPerCall are all rejected before insertion, zero remains valid (free
    models), an ordinary positive price is unaffected, a rejected
    registration does not corrupt findCapable() for previously-registered
    valid models, the exact NaN-beats-free reproduction can no longer
    happen (the poisoned record never enters the registry at all),
    createDefaultModelRegistry()'s built-in models all carry valid prices,
    and the error message identifies the offending model. Confirmed via
    git-stash that 7 of these tests fail against the pre-fix code.

    P2 targeted-audit fix (9th independent review round, found while
    auditing for the same class as workers/registry.ts's "duplicate
    worker identities break authoritative status"): register() never
    checked for a `modelId` collision — a second register() call with the
    SAME id (e.g. attempting to "deprecate via re-registration") left the
    original ACTIVE record in the array alongside the new one; findCapable()
    only filters by status, so the stale ACTIVE record remained routable.
    Fixed with the identical pattern: register() now rejects an id
    collision (new DuplicateModelIdError) before any mutation, and a new
    updateStatus() method is the only way to transition an existing
    model's status — it mutates the authoritative record's array slot in
    place rather than ever creating a second record. Regression tests
    prove: first registration succeeds, a duplicate id is rejected, no
    stale ACTIVE record survives a rejected duplicate "deprecation"
    attempt, updateStatus() correctly transitions status, a deprecated
    model is never returned by findCapable(), updateStatus() on an
    unregistered id fails closed, and a model can return to a usable
    state only through updateStatus() with exactly one record throughout.
    Confirmed via git-stash that 5 of these tests fail against the
    pre-fix code.

    Test-coverage gap closed (10th independent review round follow-up,
    same "ownership boundaries" requirement raised for
    workers/registry.ts's updateStatus()): the previous round's tests for
    updateStatus() checked the *authoritative* record's state but never
    checked that the *returned* record from updateStatus() itself is a
    frozen, detached snapshot (as opposed to all()/findCapable(), which
    were already covered). The underlying implementation
    (`freezeRecord(updated)` in updateStatus()) was already correct — this
    was a missing test, not a missing fix. Added a regression test
    asserting the returned record throws TypeError on mutation attempts,
    that such attempts never reach the authoritative record, and that the
    returned reference is never the same object as `all()`'s. Verified
    meaningful via a temporary in-place bypass (returning the pre-freeze
    object instead of `freezeRecord(updated)`) — confirmed exactly this 1
    test fails against the bypassed code, then the bypass was reverted.

