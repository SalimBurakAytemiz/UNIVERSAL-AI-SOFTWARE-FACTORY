- id: UASF-REQ-0010
  title: Founder decision ledger
  description: Persist Founder decisions with id/status/supersession tracking.
  source_baseline: "BASELINE-V1 section 46"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/decisions/decision-ledger.ts"
  test_refs:
    - "runtime/decisions/__tests__/decision-ledger.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    Now persists via runtime/state/file-store.ts (saveTo/loadFrom) — no
    longer in-memory only; a round-trip through a fresh store instance is
    tested.

    P1 cross-cutting fix (3rd independent review round, found during audit
    triggered by the ApprovalWorkflow finding below): get()/allFor()
    returned the actual internal decision object, so a caller could do
    `ledger.get(id).status = "SUPERSEDED"` and bypass supersede() entirely —
    the exact same bug class as the approval-state finding, applied to "never
    silently overwrite, only supersede" instead of "never execute without
    approval". Fixed: record()/get()/allFor() now return a frozen, detached
    copy (runtime/util/immutable.ts); internal transitions still happen on
    the private authoritative object inside supersede(). Regression tests
    prove a mutation attempt on a returned decision throws (frozen) and never
    changes what get() subsequently returns. Confirmed via git-stash that
    these tests fail against the pre-fix code.

    P1 fix (5th independent review round, "repeated supersession corrupts
    decision history"): supersede() never checked that `oldDecisionId`'s
    CURRENT status was ACTIVE before transitioning it. Codex reproduced
    `A -> B` followed by `A -> C`: the second call created a brand-new C
    record (status ACTIVE, via record()) and silently overwrote A's
    `supersededBy` from B to C — leaving BOTH B and C simultaneously
    ACTIVE, each implicitly claiming to be "the" current replacement for A,
    corrupting the "exactly one current decision" invariant. Fixed:
    supersede() now throws a new DecisionAlreadySupersededError (naming the
    decision's actual current status and existing supersededBy) BEFORE any
    mutation or new record is created, unless `oldDecisionId` is currently
    ACTIVE. A decision can only evolve by superseding its CURRENT active
    replacement (A -> B -> C), never by re-replacing an already-superseded
    decision (A -> B and A -> C, branching) — the spec does not define
    branching, so this is never silently allowed. Regression tests prove:
    A -> B works, a second A -> C is rejected, the original A -> B link
    survives the rejected attempt unchanged, B remains the sole ACTIVE
    decision throughout, B -> C (evolving the current decision) works,
    the resulting A -> B -> C chain has exactly one ACTIVE decision (C),
    the rejected supersession creates no partial record (id "c" is never
    recorded at all when the first attempt used that id), and the error
    message reports the decision's real current state. Confirmed via
    git-stash that 5 of these tests fail against the pre-fix code with
    exactly the branching corruption Codex described.

    P1 targeted-audit fix (23rd independent review round, same root class
    as assumption-register.ts's "validate persisted assumptions before
    restoring authoritative state" — see UASF-REQ-0011): loadFrom()
    inserted every persisted record directly into authoritative state
    with NO validation — a corrupt/hand-edited record claiming
    `status: "SUPERSEDED"` with no `supersededBy` (a combination
    supersede() itself can never produce, since it always sets both
    together) would silently corrupt "which decision is currently
    active?" bookkeeping. Fixed the same way: a new
    `describeInvalidPersistedDecision()` validates every field's type/
    enum-membership AND this same SUPERSEDED-requires-supersededBy
    domain invariant, plus rejects duplicate decisionIds within one
    persisted array; loadFrom() now throws
    `CorruptPersistedDecisionError` (fail closed) if any record fails.
    Six new regression tests prove the exact reproduction is refused,
    invalid enum values/missing fields/duplicate ids are refused, and a
    genuinely valid history (ACTIVE + SUPERSEDED-with-supersededBy)
    still loads correctly. Verified via a temporary bypass reproducing
    the predicted symptom, then fully reverted.

    P1 fix (24th independent review round, same root class as assumption-register.ts's "restored assumptions
    must be detached" — see UASF-REQ-0011): `loadFrom()` still stored the exact object `store.read()` returned;
    now copies each validated candidate (`{ ...candidate }`) before insertion, fully detaching it. Regression
    test proves mutating the original object after load does not change the ledger's authoritative state.

    P2 fix (24th independent review round, "validate persisted supersession graph"): `describeInvalidPersistedDecision()`
    validates each record in isolation and cannot see whether a `supersededBy` target actually exists, belongs
    to the same project, or whether the graph of `supersededBy` edges as a whole forms valid, acyclic chains.
    A persisted decision could reference a `supersededBy` target that was never itself persisted, a target
    belonging to a different project (`supersede()` always copies the project, so a live-created record could
    never cross projects), a self-reference, or a cycle — `supersede()`'s own ACTIVE-only guard makes a cycle
    impossible to create live, but a hand-edited persisted file has no such guard. Added
    `describeInvalidPersistedDecisionGraph()`, run after every individual record passes validation and before
    any record enters the authoritative map: checks every `supersededBy` target exists and shares the source's
    project, rejects self-reference, and runs a standard three-color DFS cycle detection over the whole batch.
    Six new regression tests prove: a missing target, a cross-project target, a self-reference, a direct
    two-node cycle, and a multi-node (A->B->C->A) cycle are all refused, while a genuinely valid multi-step
    chain (A->B->C) still loads with no false-positive cycle detection. Verified via two separate temporary
    bypasses (disabling the graph check, and disabling the detach copy) — confirmed the exact predicted 5 graph
    tests and 1 detach test failed respectively, with no cross-contamination between the two bypasses, then both
    reverted and all tests re-confirmed passing.

    P1 fix (25th independent review round targeted audit, same root class as `audit/audit-log.ts`'s "audit
    records must be runtime-private and append-only"): the internal `decisions` Map used TypeScript's
    compile-time-only `private` keyword — reachable at runtime via `(ledger as any).decisions` or plain bracket
    access, letting a consumer flip a decision's `status` directly, bypassing `supersede()`'s ACTIVE-only guard
    and "never delete, only SUPERSEDED-and-chain" invariant. Converted to a genuine ECMAScript `#decisions`
    private field (same pattern as `audit-log.ts`'s `#records`). Three new regression tests prove the field is
    unreachable via property access or any reflection API, and that a plain JS consumer cannot corrupt decision
    status this way. Verified via a temporary bypass (reverting to `private decisions`) — confirmed exactly the
    3 predicted tests failed, then reverted and re-confirmed all tests passing.

    P1 fix (26th independent review round, finding 6, "active decisions cannot already name a successor"):
    `describeInvalidPersistedDecision()` checked "SUPERSEDED requires supersededBy" but never the reverse —
    a persisted record claiming `status: "ACTIVE"` while ALSO carrying a `supersededBy` is just as impossible
    for `supersede()` to produce (it only ever sets both fields together, in the same assignment), yet was
    silently accepted on load. Restoring such a record would let `hasActiveDecision()` report it active while
    `supersededBy` points at a real, separate decision — two contradictory answers for "which decision is
    currently active?" (bölüm 255). Added the symmetric check: `status === "ACTIVE" && supersededBy !==
    undefined` is refused with `CorruptPersistedDecisionError`. Six new regression tests prove the exact
    reproduction is refused, the existing SUPERSEDED-without-successor check still holds, valid ACTIVE/SUPERSEDED
    records and multi-step chains still load, and the pre-existing cycle/missing-target graph regressions are
    unaffected. Verified via a temporary bypass (gating the new check with `if (false && ...)`) — confirmed
    exactly the 1 predicted BLOCKER test failed (39/40 otherwise passing), then reverted and re-confirmed 40/40
    passing.

- id: UASF-REQ-0011
  title: Assumption register
  description: Track assumptions with PROPOSED/ACCEPTED/REJECTED/VALIDATED/SUPERSEDED lifecycle.
  source_baseline: "BASELINE-V1 section 47"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/assumptions/assumption-register.ts"
  test_refs:
    - "runtime/assumptions/__tests__/assumption-register.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    HIGH-impact assumptions cannot move to ACCEPTED without an explicit
    confirmedBy value (Founder confirmation gate), enforced in code. Now
    persists via runtime/state/file-store.ts (saveTo/loadFrom), including the
    confirmedBy field, across a simulated process restart.

    P1 cross-cutting fix (3rd independent review round): propose()/get()/
    allWithStatus() returned the actual internal object, so a caller could
    set `assumption.status = "ACCEPTED"` directly and bypass accept()'s
    HIGH-impact Founder-confirmation gate entirely. Fixed: every read now
    returns a frozen, detached copy (runtime/util/immutable.ts); status
    transitions happen only through accept()/reject()/validate() on the
    private authoritative object. Regression tests prove a mutation attempt
    on a returned assumption throws and cannot bypass the confirmation gate.
    Confirmed via git-stash that these tests fail against the pre-fix code.

    P2 fix (7th independent review round targeted audit, found while
    auditing for the same class as approval.ts's "duplicate approval IDs
    replace authoritative history"): propose() called
    `this.assumptions.set(input.id, assumption)` unconditionally — a second
    propose() call with the SAME id as an already Founder-confirmed
    (ACCEPTED, confirmedBy set) HIGH-impact assumption would silently
    replace it with a fresh, unconfirmed PROPOSED record, completely
    bypassing the "High-impact assumptions require Founder confirmation"
    invariant this module exists to enforce. Fixed: propose() now throws a
    new DuplicateAssumptionIdError before any mutation if the id already
    exists, regardless of the existing record's status. Regression tests
    prove: a duplicate id while PROPOSED is rejected, a duplicate id cannot
    silently erase an ACCEPTED HIGH-impact assumption's confirmedBy/status/
    description, a rejected duplicate cannot be used to bypass the
    Founder-confirmation gate on a fresh unconfirmed record, distinct ids
    remain independent, and the error names the offending id. Confirmed via
    git-stash that all 4 of these tests fail against the pre-fix code with
    exactly this confirmation-erasure symptom.

    P1 fix (23rd independent review round, "validate persisted assumptions
    before restoring authoritative state"): Codex reproduced that
    loadFrom() inserted every persisted record DIRECTLY into authoritative
    state with NO validation — a corrupt/hand-edited record such as
    `{impact: "HIGH", status: "ACCEPTED", confirmedBy: missing}` was
    restored straight in, completely bypassing accept()'s Founder-
    confirmation invariant for state that never went through the live API.
    Fixed: a new `describeInvalidPersistedAssumption()` validates every
    field's type/enum-membership AND the SAME HIGH-impact-ACCEPTED-needs-
    confirmedBy domain invariant accept() enforces, plus rejects duplicate
    ids within one persisted array; loadFrom() now throws
    `CorruptPersistedAssumptionError` (fail closed — the WHOLE load is
    refused, never a partial/silent-drop) if any record fails. Ten new
    regression tests prove the exact reproduction (missing confirmedBy)
    is refused, a whitespace-only confirmedBy is ALSO refused (see the
    companion fix below), invalid enum values/missing fields/duplicate
    ids are all refused, and a genuinely valid persisted set (including a
    properly-confirmed HIGH record) still loads correctly.

    P2 fix (23rd independent review round, "reject blank founder
    confirmation identities"): accept()'s HIGH-impact gate used to check
    only `!confirmedBy` (a truthy/falsy check) — `confirmedBy = "   "`
    (whitespace only) is a TRUTHY string, so it silently passed the gate.
    Fixed: now uses the SAME shared `isNonBlankIdentity()` validator
    (runtime/util/identity.ts, also used by approval.ts's
    `assertValidApprover` — a single source of truth) requiring a
    trimmed, non-empty identity. Regression tests prove whitespace/tab/
    newline-only confirmedBy values are rejected and a genuine identity
    still works. Both fixes verified via a temporary bypass reproducing
    both predicted symptoms (14 tests total failed across this
    requirement and the sibling decision-ledger.ts audit fix below),
    then fully reverted.

    P1 targeted-audit fix (23rd independent review round, same root
    class): audited every `loadFrom()`/persisted-collection-restore
    pattern in the P0 path and found one further genuine instance —
    `runtime/decisions/decision-ledger.ts` (bkz. UASF-REQ-0010) — same
    root cause, same fix pattern, also fixed this round. No other
    `StateStore` consumer in `runtime/` restores a domain-invariant-
    bearing in-memory collection this way (file-cache.ts is a generic
    key-value cache with no domain invariants; orchestrator.ts only
    performs one-shot writes to unique per-project paths, never a
    restore-into-authoritative-collection operation).

    P1 fix (24th independent review round, "restored assumptions must be detached"): `loadFrom()`'s validated
    records still stored the EXACT object `store.read()` returned, directly into `this.assumptions` — if the
    caller/store held (or a cache later re-returned) a reference to that same object and mutated it afterward,
    authoritative registry state changed with no `accept()`/`reject()`/`validate()` call and no invariant
    re-check at all. Since every field on the internal record type is a primitive, a shallow copy
    (`{ ...validated }`) fully detaches it. Regression tests prove mutating the original object after load does
    not change the register's state, and specifically cannot smuggle a HIGH-impact assumption into ACCEPTED
    without ever going through `accept()`'s Founder-confirmation check. The identical root class was found and
    fixed in the same round in `runtime/decisions/decision-ledger.ts`'s `loadFrom()` (UASF-REQ-0010). Verified
    via a temporary bypass (storing the un-copied reference again) — confirmed the exact predicted 2 tests
    failed, then reverted and re-confirmed all passing.

    P1 fix (25th independent review round targeted audit, same root class as `audit/audit-log.ts`'s "audit
    records must be runtime-private and append-only" — identical to this round's `decision-ledger.ts` fix,
    UASF-REQ-0010): the internal `assumptions` Map used TypeScript's compile-time-only `private` keyword,
    reachable at runtime via `(register as any).assumptions`, letting a consumer flip a HIGH-impact assumption
    straight to `status: "ACCEPTED"` with no `confirmedBy` at all — completely bypassing `accept()`'s Founder-
    confirmation gate (baseline section 47). Converted to a genuine ECMAScript `#assumptions` private field.
    Three new regression tests prove the field is unreachable via property access or any reflection API, and
    that a plain JS consumer cannot smuggle a HIGH-impact assumption into ACCEPTED this way. Verified via a
    temporary bypass (reverting to `private assumptions`) — confirmed exactly the 3 predicted tests failed, then
    reverted and re-confirmed all tests passing.

