- id: UASF-REQ-0036
  title: Cache / reuse layer
  description: >
    Before recomputation, check durable cache for still-valid prior results
    and reuse them instead of recomputing.
  source_baseline: "BASELINE-V1 section 77, 78, 306 (Proof G)"
  category: P0
  priority: HIGH
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/cache/cache.ts"
    - "runtime/cache/file-cache.ts"
    - "runtime/cache/file-lock.ts"
    - "runtime/state/file-store.ts"
  test_refs:
    - "runtime/cache/__tests__/cache.test.ts"
    - "runtime/cache/__tests__/file-cache.test.ts"
    - "runtime/cache/__tests__/file-cache.cross-process.test.ts"
    - "runtime/cache/__tests__/file-lock.test.ts"
  proof_refs:
    - "proofs/cache-reuse/proof.test.ts"
  security_refs: []
  notes: >
    P2 finding (Codex, 2nd round): the description says "durable cache",
    but the only implementation was runtime/cache/cache.ts, an in-memory
    Map — proving same-process reuse, not restart durability. PROOF_VERIFIED
    was overstated relative to that evidence.

    Fixed via option (A): added runtime/cache/file-cache.ts, a FileCache<T>
    backed by the existing StateStore/FileStateStore infrastructure (same
    interface as runtime/state/file-store.ts used for project state) —
    every set() persists the full entry map to a JSON file, and every
    get()/size() reads it back from disk, so no shared in-memory reference
    is required across instances. Restart-recovery proof added in
    proofs/cache-reuse/proof.test.ts: a FileCache+FileStateStore instance
    computes and persists a result inside a block scope and is then
    discarded (no reference retained), and a SECOND, independently
    constructed FileCache+FileStateStore instance pointed at the same file
    path reuses the persisted result without recomputation — genuinely
    proving restart durability, not same-instance reuse. Equivalent
    restart-recovery tests also added directly in
    runtime/cache/__tests__/file-cache.test.ts (including expired-entry
    and size() cases across the simulated restart). The original in-memory
    Cache remains available for callers that explicitly do not need
    cross-process durability (e.g. the cache-reuse proof's original
    same-process test).

    P2 fix (6th independent review round, "durable cache loses __proto__
    keys"): FileCache persisted entries as a plain JS object
    (`Record<string, CacheEntry<T>>`) and accessed them via bracket
    assignment/lookup (`all[key] = ...`, `all[key]`). Since the cache API
    accepts arbitrary string keys, `set("__proto__", value)` never created
    a real own property — `Object.prototype`'s `__proto__` accessor
    intercepted the assignment instead, so the persisted representation
    stayed silently `{}` and `get("__proto__")` always returned undefined.
    Fixed: the persisted representation is now an array of `[key, entry]`
    tuples, and the in-memory structure is a `Map<string, CacheEntry<T>>`
    — neither an array nor a Map ever routes a key through JS object
    property/accessor semantics, so `__proto__`, `constructor`, and
    `prototype` all behave as ordinary keys with no special case needed.
    Regression tests prove: `set("__proto__", ...)` persists and an
    immediate get() returns it, a new FileCache instance (same path)
    recovers it, a genuinely separate FileCache+FileStateStore instance
    (simulated separate process) recovers it, the persisted representation
    is never silently empty, no prototype pollution occurs (a fresh,
    unrelated plain object is unaffected), `constructor`/`prototype` also
    behave as ordinary keys, normal and reserved-name keys coexist
    correctly with size() reflecting all of them, and the pre-existing
    durable cross-process cache proof (proofs/cache-reuse/proof.test.ts)
    still passes unchanged. Confirmed via git-stash that 5 of the new
    tests fail against the pre-fix (plain-object) representation with
    exactly the `{}`-stays-empty symptom Codex described.

    P2 fix (16th independent review round, "durable cache read-modify-
    write is not safe across processes"): Codex reproduced the classic
    cross-process lost-update race — `set()`'s read-modify-write cycle
    (load the WHOLE persisted map, mutate an in-memory copy, atomically
    REPLACE the file) protected each individual write from partial/
    corrupt content, but did nothing to stop TWO independent processes
    from both reading the SAME persisted snapshot, both mutating their
    own copy, and the second process's atomic file replacement silently
    ERASING the first process's already-successful write — atomic file
    replacement makes one write safe, not the full read-modify-write
    TRANSACTION. The same race could occur when `get()`'s expired-entry
    cleanup raced a concurrent `set()`. Required invariant: concurrent
    processes using the same durable cache file must never silently lose
    an independently successful cache update. Fixed: added
    `runtime/cache/file-lock.ts`, a minimal, dependency-free
    cross-process mutual-exclusion primitive built on `mkdirSync`'s
    atomicity (directory creation either fully succeeds or fails with
    EEXIST — there is no "check then create" window, unlike a plain file
    existence check) — consistent with this repository's existing
    zero-dependency philosophy for durable-persistence code (bkz.
    file-store.ts's hand-rolled atomic temp-then-rename pattern).
    `acquireFileLock()` supports a bounded wait with configurable
    `timeoutMs`, and reclaims a lock as stale (via `rmSync`, gated by a
    token comparison so a reclaimed lock is never later deleted out from
    under its NEW owner) either once it is older than `staleMs` or the
    instant its recorded owner PID is provably no longer alive (checked
    via `process.kill(pid, 0)`) — the latter means a crashed holder never
    causes a lasting deadlock; a live-but-legitimately-slow holder still
    gets `staleMs` of grace before being treated as abandoned.
    `FileCache.set()` and the expired-entry cleanup path inside `get()`
    now run their ENTIRE read-modify-write cycle
    (lock -> re-read the LATEST persisted contents -> mutate -> atomic
    write via the existing StateStore -> release) inside
    `acquireFileLock()`'s critical section, always re-reading fresh
    state AFTER the lock is held rather than reusing a snapshot taken
    before it — so a concurrent process's already-completed write can
    never be silently clobbered. `loadAll()`/`size()`/the non-expired
    branch of `get()` remain lock-free reads, which is safe because
    StateStore's rename-based atomic write already guarantees a reader
    only ever observes a fully-old or fully-new file, never a partial
    one — only the MUTATING paths needed the lock. Nine regression tests
    added in the NEW file `runtime/cache/__tests__/
    file-cache.cross-process.test.ts`, using REAL, separately-spawned
    Node.js child processes (via `tsx` and a standalone worker fixture,
    `fixtures/cache-worker.ts`) rather than multiple `FileCache`
    instances inside one process — the latter would never exercise the
    actual cross-process lock file or PID-liveness machinery. Tests
    prove: the exact reproduction (two real processes concurrently
    `set()`-ing different keys, both survive), high-contention safety (5
    real processes each writing 15 unique keys concurrently lose none —
    75 keys present, no double accounting), expiration cleanup racing
    with a concurrent `set()` never erases the freshly-set, unrelated
    entry, a process dying while holding the lock (exits without
    releasing) does not permanently deadlock a subsequent writer (dead-
    PID detection recovers immediately, without waiting out the
    staleness window), stale-lock recovery is safe when a live-but-
    overdue holder is reclaimed by a second process (and the original
    holder's own eventual `release()` call becomes a safe no-op via the
    token check, rather than deleting the new owner's lock), same-process
    behavior remains correct after adding locking, restart persistence
    still works across real process boundaries, and a malformed/
    unserializable write still preserves the previous durable cache state
    (delegated to FileStateStore's existing atomic-write validation,
    unaffected by the new locking layer). Verified via a temporary bypass
    (`withLock()` made a no-op, restoring the pre-fix "read then write,
    no serialization" behavior) — confirmed the high-contention test
    consistently lost updates across 3 separate runs (58, 53, and 66 keys
    observed instead of the expected 75 each time — the exact lost-update
    symptom the finding describes), then reverted and re-confirmed
    630/630 tests passing.

    Narrow audit (16th independent review round, "durable cache
    cross-process lost updates" root class): searched every
    `StateStore.read()`/`.write()` call site in `runtime/` outside
    file-store.ts/file-cache.ts/file-lock.ts. Found two structurally
    DIFFERENT uses — `runtime/assumptions/assumption-register.ts` and
    `runtime/decisions/decision-ledger.ts` — but neither is a genuine
    instance of this same root class: both hold an in-memory `Map` as
    the SOLE authority for every mutation (`propose()`/`accept()`/
    `reject()`/`validate()`/`record()`/`supersede()` all mutate only the
    in-memory Map, never reading the file back mid-operation), and expose
    `saveTo()`/`loadFrom()` as explicit, one-shot, caller-orchestrated
    snapshot/restore operations — there is no automatic, transparent
    per-operation "reload from the shared file, mutate, write back"
    cycle the way `FileCache` performs on every `get()`/`set()` (which is
    what specifically created the lost-update race). `runtime/
    project-lifecycle/orchestrator.ts`'s `stateStore.write()` calls are
    likewise one-shot writes to unique, per-project file paths
    (genome.json, organization.json, bootstrap.json), never a shared
    read-modify-write cycle. No other genuine instance of this root class
    was found in the P0 path; no further changes made beyond `file-cache.ts`
    and the new `file-lock.ts`.

    P2 fix (17th independent review round, "do not reclaim locks held by
    live processes" + "stale-lock reclamation is not serialized across
    contenders"): the 16th round's `file-lock.ts` fixed the durable-cache
    read-modify-write race, but Codex reproduced two remaining
    correctness gaps in the LOCK PROTOCOL ITSELF. [1] `isLockStale()`
    treated ANY lock older than `staleMs` as reclaimable, EVEN IF its
    owner was confirmed still alive — a long-running, perfectly
    legitimate critical section that merely outlived `staleMs` could be
    "reclaimed" out from under its live owner, reintroducing the exact
    lost-update race the lock exists to prevent, one layer up. [2] the
    reclaim path called `rmSync(lockDirPath)` UNCONDITIONALLY once a lock
    was judged stale, with no re-validation immediately before deleting —
    Codex reproduced process A reclaiming a stale lock and creating a
    fresh, valid replacement, then process B (acting on its own, now-
    outdated "stale" observation) unconditionally deleting A's BRAND-NEW
    lock and creating its own, so both A and B could believe they alone
    owned the critical section at overlapping times. Required invariant:
    lock age ALONE must never authorize reclaiming a confirmed-live
    owner's lock, and a process may only remove the EXACT stale lock
    instance it observed, never a newer replacement created by another
    contender. Fixed: `isLockStale()` now has three distinct outcomes —
    CONFIRMED LIVE (metadata readable, owning PID alive) → never stale,
    regardless of age; CONFIRMED DEAD (metadata readable, owning PID
    provably gone via `process.kill(pid, 0)` throwing ESRCH) → always
    stale, immediately, with no `staleMs` wait (preserving "no permanent
    deadlock on a crash"); UNKNOWN (metadata unreadable — race/corruption/
    disk error) → falls back to a BOUNDED, documented age-based recovery
    signal via the lock directory's own `mtime`, since no liveness signal
    exists at all in that case. `isProcessAlive()` was also corrected to
    fail conservatively: only an explicit ESRCH is treated as "dead";
    EPERM or any other unexpected error is now treated as "alive" (the
    OLD code treated every non-EPERM error as death, which could
    misclassify a live owner under an unusual/unexpected errno). Actual
    reclamation now goes through a new `tryReclaimStaleLock()`, gated by
    an atomic, per-`lockDirPath`-derived "reclaim gate" directory
    (`${lockDirPath}.reclaim`, itself taken via `mkdirSync` — atomic,
    EEXIST if already held): ALL contenders reclaiming the SAME
    `lockDirPath` race for this ONE gate, so exactly one wins (the
    losers back off WITHOUT ever touching `lockDirPath`, returning to the
    normal wait/retry loop); the winner then RE-VALIDATES `isLockStale()`
    one more time (now with NO other reclaimer able to interleave, since
    it holds the exclusive gate) immediately before the actual `rmSync` —
    if the lock was legitimately refreshed by a live owner in the
    meantime, the winner backs off too, touching nothing. The gate itself
    is subject to its own bounded staleness check (via its own `mtime`
    against the same `staleMs`) so a reclaimer that itself crashes
    mid-reclaim cannot permanently block all future reclamation of that
    `lockDirPath`. `release()`'s existing token-based ownership check
    (bkz. 16th round) is unchanged and applies uniformly to both normal
    release and reclaim. Twelve tests total in
    `runtime/cache/__tests__/file-cache.cross-process.test.ts` now cover
    this ground (4 new/rewritten for this round, using REAL, separately-
    spawned child processes throughout, several with an explicit ready/
    barrier handshake to force a tight, deterministic race window rather
    than hoping independent process-spawn timing happens to interleave):
    a live owner exceeding `staleMs` is never reclaimed (a waiter with a
    shorter timeout genuinely times out — proven via elapsed-time and
    exit-code assertions — rather than stealing the lock, and the live
    owner's lock/metadata survives completely untouched); a confirmed-
    dead owner (fabricated via a genuinely-exited child process's PID,
    isolating the liveness check from any timing race) is reclaimed
    near-instantly even under a deliberately generous 60-second `staleMs`;
    two processes forced via a ready/barrier handshake to race reclaiming
    the SAME fabricated dead lock, repeated across 5 trials, never both
    enter the critical section (detected via a marker file written on
    entry and checked-for-pre-existence, an unmistakable overlap witness)
    and never leave a dangling lock/marker afterward; and 3 fresh
    contenders racing a brand-new lock with a deliberately tiny `staleMs`
    against a much longer legitimate hold never overlap either. All prior
    16th-round regression tests (concurrent-different-key writes,
    high-contention, expiration-vs-set() racing, crash-while-holding-the-
    lock, same-process correctness, restart persistence, malformed-write
    preservation) continue to pass unchanged. Verified via two separate
    temporary bypasses: (a) reverting `isLockStale()` to pure age-based
    staleness (ignoring liveness) — confirmed the live-owner and long-
    running-critical-section tests failed with exactly the predicted
    "waiter stole the lock instead of timing out" / "overlap detected"
    symptoms; (b) reverting the reclaim path to an unconditional, gate-
    free `rmSync` on any observed-stale lock — confirmed the race-reclaim
    test failed deterministically (an overlap detected in at least one of
    5 trials) across 3 repeated runs of the bypassed code. Both bypasses
    reverted and 633/633 tests reconfirmed passing after each. A narrow
    audit (scoped to exactly these four root classes: live lock reclaimed
    by age, stale observation deleting a newer replacement, release
    deleting a different-token lock, waiter timeout removing an active
    lock) confirmed `file-lock.ts` is the ONLY lock/staleness/ownership
    protocol anywhere in `runtime/` — `file-store.ts`'s `unlinkSync` only
    ever removes its OWN uniquely-PID-and-random-suffixed temp file in the
    same synchronous call that created it (no staleness/ownership concept,
    no cross-process reach), and `runtime/project-os/scaffold.ts`'s
    `mkdirSync({recursive:true})` calls are plain idempotent directory
    creation with no locking semantics and no deletion at all — no other
    genuine instance of any of these four root classes exists.

    P2 fix (19th independent review round, "make stale reclaim-gate
    recovery ownership-safe"): the 17th round's `tryReclaimStaleLock()`
    fix protected `lockDirPath` itself from unsafe reclamation via an
    exclusive `.reclaim` gate (`acquireReclaimGate()`) — but Codex
    reproduced the IDENTICAL unsafe pattern one level in: the `.reclaim`
    GATE's OWN prior-holder-crashed recovery path
    (`acquireReclaimGate`'s EEXIST branch) used a bare
    stat-then-unconditional-`rmSync`, with NO identity check and no
    re-validation — Process A could observe an abandoned `.reclaim` gate
    (left behind by a crashed reclaimer), remove it, and create a fresh
    replacement; Process B, acting on its own now-outdated observation of
    the SAME abandoned gate, could then unconditionally delete A's
    brand-new replacement gate, letting both A and B believe they alone
    held exclusive access to `tryReclaimStaleLock()`'s protected body
    (the code that actually manipulates `lockDirPath`) — reintroducing,
    one level deeper, the exact overlapping-critical-section race the
    17th round's fix was meant to close entirely. Required invariant
    (identical in shape to the 17th round's, one level in): a process may
    only remove the EXACT abandoned reclaim-gate instance it observed and
    proved abandoned; a stale observation must never authorize deleting a
    newer gate another contender created. Fixed: `claimPath` now carries
    the SAME identity scheme as `lockDirPath` itself (pid + token +
    acquiredAt, written via a new shared `writeGateIdentity()` helper) and
    is subject to the SAME three-state (`isLockStale`) live/dead/unknown
    distinction — age alone never authorizes reclaiming it either.
    Recovery of an abandoned claim gate is now gated by a SECOND,
    generation-keyed exclusive gate (`${claimPath}.recover-${observedToken}`,
    derived from the SPECIFIC abandoned generation's own token and
    acquired via `mkdirSync`) — every contender racing to recover the
    SAME abandoned generation targets the SAME recovery-gate path, so
    `mkdirSync`'s atomicity guarantees exactly one winner; losers back off
    without ever touching `claimPath`. The winner re-validates
    `isLockStale(claimPath, ...)` one more time — now with no other
    recoverer able to interleave, since it holds the exclusive recovery
    gate — immediately before the actual delete, closing the TOCTOU
    window to zero for the common (single-crash) case. Because the
    recovery gate's path is keyed to a token that, once superseded, is
    never again observed as "the current abandoned generation," it is
    safe to leave unrecovered forever in the ordinary case (no cleanup
    race). One narrow, explicitly documented, ACCEPTED residual limitation
    remains (analogous to the file's existing documented PID-reuse
    limitation): if the recovery-gate WINNER itself also crashes mid-
    recovery — reachable only via TWO independent, sequential process
    crashes (the original lock owner, then the reclaimer that won the
    recovery gate) — `acquireRecoveryGate()`'s own abandonment check
    is a single-level, age-only (`mtime`) fallback rather than a third
    nested exclusive gate, since adding further nesting would be an
    unbounded, disproportionate "broad redesign" for an astronomically
    rare compound-failure scenario, contrary to the review's own
    instruction to prefer "the smallest dependency-free architecture-
    consistent solution." Two new real-child-process regression tests
    added to `runtime/cache/__tests__/file-cache.cross-process.test.ts`:
    one repeats (5 trials) a ready/barrier-synchronized race between two
    processes recovering the SAME fabricated abandoned reclaim gate
    (itself sitting atop a fabricated abandoned lock, reproducing the
    review's exact scenario), using the same marker-file overlap witness
    as the 17th round's tests, proving no overlap and no dangling
    lock/gate/marker afterward; the other proves that after the winner of
    such a race releases normally, the loser can subsequently acquire,
    and cache entries written by each contender in sequence are preserved
    (no lost updates). Verified via two temporary, carefully-scoped
    bypasses that together reproduced the exact predicted failure: (1)
    reverting `acquireReclaimGate`'s EEXIST branch to keep the CORRECT
    staleness decision (still PID-liveness-aware, to preserve tight race
    timing) but perform the unsafe unconditional delete-then-recreate
    with no recovery gate; (2) additionally widening (via a short,
    clearly-marked `sleepSync`) the natural but ordinarily sub-millisecond
    gap between "decided stale" and "acted on it" in both the bypassed
    `acquireReclaimGate` and the downstream `tryReclaimStaleLock` body, to
    make the inherently timing-sensitive race reliably observable in this
    environment's fast local-disk syscall timing (this mirrors, at finer
    grain, the same "decide-then-act" root pattern the real fix closes;
    it does not test a different bug). Under this combined bypass, the
    exact predicted overlap symptom reproduced in 2 of 3 repeated runs of
    the new tests (a probabilistic race, consistent with its nature);
    both bypasses were fully reverted afterward and 649/649 tests
    reconfirmed passing, stable across 3 repeated full-suite runs. A
    narrow audit (scoped to exactly the four root classes named: stale
    observation deleting a newer gate, old token releasing a newer gate,
    unconditional rmSync/unlink of ownership-sensitive paths, timeout/
    error cleanup deleting someone else's gate) re-confirmed `file-lock.ts`
    remains the ONLY lock/staleness/ownership protocol in `runtime/`, and
    found no other genuine instance beyond the one fixed here — this
    round did not touch or need to touch `file-store.ts`/`scaffold.ts`
    (already cleared by the 18th round's identical audit).

    P2 fix (21st independent review round, "stale-lock removal failure
    bypasses acquisition timeout"): a twenty-first independent Codex
    review reopened P0 after its twentieth round's CLEAN result by
    reproducing a genuine fail-open/liveness defect, one level below the
    17th/19th rounds' reclaim-serialization fixes, in the actual removal
    step itself. `tryReclaimStaleLock()` attempted `rmSync(lockDirPath,
    {recursive: true, force: true})` and, if that call genuinely THREW
    (its `force: true` option already silently tolerates ENOENT, so
    anything reaching the `catch` is a real failure — permission denial,
    a busy/non-removable directory entry, etc.), swallowed the error in a
    bare `catch` block and still fell through to `return true` — reporting
    a FAILED removal as a SUCCESSFUL reclaim. The caller,
    `acquireFileLock()`'s retry loop, was structured as
    `if (isLockStale(...) && tryReclaimStaleLock(...)) { continue; }`
    BEFORE its own `if (Date.now() >= deadline) throw new
    FileLockTimeoutError(...)` check — so whenever `tryReclaimStaleLock()`
    falsely reported success, the loop `continue`d straight past the
    deadline check entirely. With a persistently unremovable lock-
    directory entry, this produced a genuine unbounded busy-loop: the
    same stale lock was re-detected and the same doomed removal
    re-attempted on every iteration, with the deadline never once
    consulted. Codex reproduced this concretely — a configured
    `timeoutMs: 50` still required external process termination after
    roughly 2 seconds, instead of the promised `FileLockTimeoutError` at
    ~50ms — proving `FileCache.set()` itself could hang indefinitely
    despite a small configured timeout, defeating the lock's own
    bounded-wait contract. Required invariant: EVERY lock-acquisition
    retry path must honor the configured acquisition deadline, and no
    error/reclaim-failure path may bypass deadline checking, bounded
    retry, or backoff. Fixed with two coordinated changes (confirmed via
    bypass testing that BOTH are genuinely necessary — a partial,
    one-half-only bypass did not reproduce the hang): (1)
    `tryReclaimStaleLock()`'s `catch` block now `return`s `false` instead
    of falling through to `return true`, so a real removal failure is
    NEVER reported as a successful reclaim; (2) `acquireFileLock()`'s
    loop was restructured to eliminate the `continue` statement entirely
    — the deadline check (`if (Date.now() >= deadline) throw
    FileLockTimeoutError`) is now the single, unconditional next step
    after every EEXIST-triggered contention attempt, executed on EVERY
    iteration regardless of whether staleness was detected or reclaim was
    attempted, succeeded, or failed; the poll-interval backoff
    (`sleepSync(pollIntervalMs)`) is skipped ONLY in the one case where
    reclamation is PROVEN to have genuinely succeeded (the real
    `rmSync()` call did not throw), so a genuinely successful reclaim can
    retry immediately while every other path — no staleness, a live
    contended lock, or a failed reclaim — is both deadline-checked and,
    if not yet expired, paced by the poll interval rather than
    busy-spinning the event loop. Three new regression tests added to
    `runtime/cache/__tests__/file-cache.cross-process.test.ts` (16 tests
    total in that file now, up from 13), using REAL, separately-spawned
    Node.js child processes and a genuine, deterministic filesystem
    failure mechanism: this sandbox environment runs as root, which
    bypasses ordinary Unix permission-bit tricks for forcing `rmSync` to
    fail, so the tests instead use the Linux immutable file attribute
    (`chattr +i`), one of the few mechanisms that blocks even root from
    removing a file (empirically confirmed in this exact environment).
    Tests prove: (a) a fabricated dead-owner lock whose directory
    contains an immutable, unremovable file still causes acquisition to
    throw `FileLockTimeoutError` within its configured deadline (bounded
    tolerance, well under the old ~2-second hang) rather than requiring
    external termination, and the guarded write never lands; (b) with a
    longer `pollIntervalMs`, repeated retry attempts are measurably paced
    by that interval rather than busy-spinning; (c) once the immutable
    attribute is cleared (removal becomes possible again), normal
    reclamation and acquisition succeed on the very next attempt,
    confirming the fix does not weaken genuine dead-owner recovery. All
    three tests are gated behind a defensive
    `immutableAttributeSupported()` probe (`it.skipIf`) so they skip
    gracefully rather than fail unpredictably on a filesystem without
    `chattr` support. Verified via a temporary in-place bypass reinstating
    BOTH halves of the original defect simultaneously (the swallow-as-
    success return in `tryReclaimStaleLock()` AND the old
    `continue`-before-deadline-check loop structure in
    `acquireFileLock()`) — a partial bypass restoring only the function-
    level swallow, with the already-restructured unconditional deadline
    check left in place, did NOT reproduce a hang (confirming the loop
    restructuring alone was already sufficient defense-in-depth, and that
    reproducing the ORIGINAL reported bug genuinely required both halves
    together); under the full, both-halves bypass, the raw worker
    process — run outside any test harness via a direct `tsx` invocation
    with an external `timeout -s KILL` wrapper — required `SIGKILL` to
    terminate, an unambiguous real hang consistent with Codex's own
    description. Both bypasses were then fully reverted (confirmed via
    `grep -n "TEMP-BYPASS" runtime/cache/file-lock.ts` returning empty)
    and all 16 tests in the cross-process cache test file re-confirmed
    passing across 3 repeated runs. A targeted audit, scoped explicitly
    and only to this same root class (a `continue`/loop-restart before a
    deadline check, a swallowed filesystem error reported as success, or
    a retry path that can busy-spin or otherwise bypass bounded-wait
    semantics) across every OTHER `for (;;)`/`while (true)` loop in
    `runtime/` — `sandbox.ts`'s `canonicalizeNearestExisting()` (an
    upward directory-hierarchy walk terminating structurally when
    `parent === current`), `router.ts`'s `routeAndExecute()` tier-
    escalation loop (terminating structurally when `TIER_ORDER` is
    exhausted, throwing `EscalationExhaustedError`), and `doctor.ts`'s
    `findNearestPackageJson()`/`findNearestPackageLock()` (the same
    upward-walk pattern, terminating when `parent === dir`) — found NO
    further genuine instance: none of those three loops has any
    configured deadline/timeout concept, retry/backoff semantics, or a
    swallowed-error-treated-as-success pattern in the first place; each
    terminates via a simple structural condition, not a time-based
    deadline, so this specific bug class does not apply to any of them.

    P2 fix (22nd independent review round, "validate lock metadata before
    using owner PID"): a twenty-second independent Codex review, after
    the twenty-first round's CLEAN P0-scope conclusion on the acquisition-
    timeout bug, found one further remaining P2 correctness blocker, one
    level up in the SAME `runtime/cache/file-lock.ts` metadata-parsing
    path. `readLockMeta()` used to cast `JSON.parse()`'s result directly
    as `LockMeta` (`JSON.parse(...) as LockMeta`) with NO runtime
    validation — TypeScript's `as` assertion is a compile-time-only
    annotation and performs no actual runtime check. Codex reproduced
    that syntactically VALID JSON carrying structurally MALFORMED
    ownership fields — `{}`, or `{"pid":"123"}` (a string, not a number)
    — was cast through unexamined. The malformed `pid` field then reached
    `isProcessAlive(pid)` directly; `process.kill(pid, 0)` threw an
    unexpected (non-ESRCH) error for the invalid PID value (e.g.
    `ERR_INVALID_ARG_TYPE` for a non-integer, or an unusual signal
    interpretation for `pid: 0`, which POSIX defines as "signal the
    caller's own process group" and so does not throw at all), and
    `isProcessAlive()`'s existing "any non-ESRCH error/success means
    conservatively alive" rule (17th round fix, intentionally
    conservative to protect genuine live owners) then misclassified the
    malformed record as a CONFIRMED LIVE owner. Since `isLockStale()`
    treats a confirmed-live owner as never stale regardless of age, this
    permanently blocked the documented UNKNOWN-owner recovery policy from
    ever running for that lock — Codex confirmed this concretely with
    `staleMs: 1` and a genuinely abandoned lock directory: acquisition
    always timed out instead of recovering. Required invariant: lock
    metadata must never be trusted merely because it parses as valid
    JSON — owner metadata must be structurally validated before any
    PID/liveness decision is made, and malformed metadata must enter the
    same bounded UNKNOWN-owner recovery policy as unreadable/corrupt
    metadata, never CONFIRMED LIVE and never an unconditional immediate
    delete. Fixed: added `isValidLockMeta()`, a runtime structural
    validator checked before ANY parsed value is trusted as `LockMeta` —
    it rejects anything that is not a non-null, non-array object; a `pid`
    that is not a finite integer strictly greater than zero; a `token`
    that is not a non-empty string; or an `acquiredAt` that is not a
    finite number. `readLockMeta()` now returns `undefined` — exactly the
    same signal already used for unreadable/corrupt metadata — whenever
    this validation fails, rather than returning a value that only
    LOOKS like a `LockMeta` at the type level. Because `readLockMeta()`
    is the SOLE point in this file where parsed JSON crosses into the
    `LockMeta` type (confirmed via a full audit below), this single fix
    automatically and correctly propagates through every consumer:
    `isLockStale()` now sees malformed metadata exactly like unreadable
    metadata and falls through to the existing, already-bounded
    `mtime`-based UNKNOWN-owner fallback; `acquireReclaimGate()`'s
    `observedToken` lookup and `releaseFileLock()`'s token-ownership
    check both already used optional chaining against `readLockMeta()`'s
    result and needed no changes. Fifteen new deterministic regression
    tests added in a new file,
    `runtime/cache/__tests__/file-lock.test.ts` (unit-level, real
    on-disk lock directories with hand-fabricated `owner.json` content,
    driven entirely through the public `acquireFileLock()` API — no
    child-process spawning needed for this fix, since it is deterministic
    parsing/validation logic, not a cross-process race): ten malformed-
    metadata variants (empty object, string pid, missing pid, pid = 0,
    negative pid, fractional pid, null, array, wrong field types,
    unparsable JSON) each prove recovery happens promptly instead of
    exhausting the configured timeout; a "not yet aged" malformed-lock
    case proves malformed metadata still honors the same bounded
    UNKNOWN-owner staleness window rather than being stolen instantly; a
    dedicated case proves malformed metadata does not bypass the
    acquisition deadline (still throws `FileLockTimeoutError` within
    budget when recovery genuinely cannot occur yet); a genuinely
    CONFIRMED-LIVE owner (this test process' own real, live PID) is
    proven never reclaimed regardless of age; a genuinely CONFIRMED-DEAD
    owner (fabricated via a real, fully-awaited, now-exited child
    process, isolating the liveness check from any timing race) is
    proven still reclaimed near-instantly; and an isolation check proves
    an unrelated, genuinely live lock is unaffected by a malformed lock
    elsewhere. Verified via a temporary in-place bypass restoring the old
    behavior (an `isValidLockMeta` that unconditionally accepted any
    non-null object, with `readLockMeta` reverted to the original blind
    `as LockMeta` cast) — 6 of the 15 new tests genuinely failed under
    this bypass with exactly the predicted symptom
    (`FileLockTimeoutError` at the full configured budget instead of
    prompt recovery: the empty-object, missing-pid, `pid = 0`,
    fractional-pid, and array cases, plus the cross-lock isolation
    check); the remaining 9 tests were unaffected by the bypass by
    construction (either because `process.kill()` happens to throw
    `ESRCH` for those particular malformed values in this environment
    regardless of validation — e.g. a numeric-looking string PID or a
    negative PID that resolves to a nonexistent process group, both
    empirically confirmed via direct `process.kill()` probing — or
    because they exercise the already-correct unparsable-JSON/valid-
    metadata paths this round did not change). The bypass was then fully
    reverted (confirmed via `grep -n "TEMP-BYPASS"
    runtime/cache/file-lock.ts` returning empty) and all 15 tests
    re-confirmed passing. A targeted audit of the lock metadata parsing/
    liveness/recovery path (grepped every `JSON.parse`, `as LockMeta`,
    and `isProcessAlive(` call site in `file-lock.ts`) confirmed
    `readLockMeta()` is the ONLY place parsed JSON is cast to `LockMeta`,
    `isProcessAlive()` has exactly ONE call site (`isLockStale()`, fed
    exclusively by `readLockMeta()`'s now-validated result), and every
    other `readLockMeta()` consumer already used safe optional chaining
    — no other genuine instance of "blind type cast from parsed JSON",
    "malformed PID passed into liveness checks", or "malformed owner
    records bypassing UNKNOWN-owner recovery" exists anywhere else in
    this file.

    P1 fix (23rd independent review round, "sanitize reclaim tokens
    before deriving filesystem paths"): Codex found that
    `acquireReclaimGate()`'s abandoned-then-recover path derived
    `recoveryGatePath` by interpolating a token read directly from
    PERSISTED metadata (`readLockMeta(claimMetaPath)?.token`) into a
    filesystem path, with only a non-empty-string check (22nd round) —
    a malformed or hostile `owner.json` could carry a token containing
    real path separators/traversal components (e.g. a leading `/`
    followed by `../../`), and since the final `finally` block does
    `rmSync(recoveryGatePath, {recursive:true, force:true})`, a
    sufficiently staged filesystem (an attacker with enough access to
    plant the malicious metadata could also pre-stage the necessary
    intermediate directory) could redirect that recursive delete onto an
    entirely unrelated location. Fixed: `sanitizeReclaimToken()` accepts
    ONLY this implementation's own canonical generated format (exactly 16
    lowercase hex characters, matching `randomBytes(8).toString("hex")`)
    — anything else (path separators, `..`, absolute paths, oversized/
    undersized/wrong-charset values, empty/undefined) falls back to the
    same fixed, harmless placeholder (`"unknown-generation"`) already used
    when the token is unreadable. Ownership/ordinary token semantics
    elsewhere (release()/tryReclaimStaleLock()'s own checks) are
    unchanged. Regression tests prove: the canonical format is accepted
    unchanged; ten distinct malformed shapes (POSIX/Windows traversal,
    embedded slash/backslash, absolute paths, bare `..`, oversized,
    too-short, wrong case, non-hex) all fall back safely; and an
    end-to-end, real-filesystem proof — fabricating a hostile token,
    pre-staging the exact intermediate directory a real syscall walk
    would need, and pre-creating an unrelated, pre-existing "escape
    target" directory with a canary file at the location the traversal
    would resolve to — proves the canary survives completely untouched.
    Verified via a temporary bypass (trusting the token unconditionally)
    — the end-to-end escape test genuinely destroyed the canary file
    under the bypass (`existsSync` false), proving the vulnerability was
    real and the fix prevents it, then fully reverted.

    P2 fix (23rd independent review round, "reject out-of-range lock
    owner PIDs"): Codex found that a syntactically valid positive integer
    PID can still fall outside the platform-valid PID domain — Node's own
    `process.kill()` rejects any PID greater than 2147483647 (`2^31 - 1`)
    with a `TypeError`/`ERR_INVALID_ARG_TYPE`, never `ESRCH` (confirmed
    empirically). `isProcessAlive()`'s existing conservative "any
    non-ESRCH outcome means alive" rule then misclassified such a PID as
    CONFIRMED LIVE, permanently blocking UNKNOWN-owner recovery for a
    lock that could never have had a real owner. Fixed: `isValidLockMeta`
    now also rejects any `pid` greater than this platform-valid upper
    bound, routing it into the same UNKNOWN-owner bounded recovery path
    as other structurally invalid metadata. A regression test proves a
    PID one greater than the boundary is treated as malformed/recovered
    via the bounded path, and a companion test proves the boundary value
    itself (2147483647) is NOT treated as malformed — it goes through the
    ordinary liveness check and is recovered as confirmed-dead, since no
    real process holds it.

    P2 fix (26th independent review round, finding 7, "cache must expire at the deadline"): `Cache.get()`
    (cache.ts) and BOTH of `FileCache.get()`'s equivalent checks (file-cache.ts's initial synchronous check and
    its lock-protected re-check) compared with strict `entry.expiresAt < Date.now()` — an entry whose
    `expiresAt` exactly equalled `Date.now()` (including a `ttlMs: 0` entry read back within the same
    millisecond it was set) was judged NOT yet expired and served one more time, contradicting the stated
    guarantee that an entry stops being valid AT its expiry instant, not strictly after it. Fixed: all three
    checks now compare `Date.now() >= entry.expiresAt`. Regression tests (using `vi.useFakeTimers()`/
    `vi.setSystemTime()` for deterministic boundary control) prove, identically for both `Cache` and
    `FileCache`: now < expiresAt is still valid; now === expiresAt is expired (BLOCKER regression); now >
    expiresAt is expired; `ttlMs: 0` never survives its own expiration boundary even read back at the exact
    same instant; and the expired entry is actually removed from the store (`size()` reflects the deletion).
    `FileCache`'s cross-instance test additionally proves the lock-protected re-check path (not just the
    initial in-process check) honors the same boundary on a durably-persisted entry. Verified via a temporary
    bypass (reverting all three comparisons to strict `<`) — confirmed the exact predicted 3 tests (cache.ts)
    and 4 tests (file-cache.ts) failed, then reverted and re-confirmed all 79 tests in runtime/cache/ passing.

- id: UASF-REQ-0037
  title: Service / integration catalog foundation
  description: Minimal catalog record shape for services/integrations (provider, purpose, owner, status).
  source_baseline: "BASELINE-V1 section 97, 126"
  category: P0
  priority: LOW
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/service-catalog/service-catalog.ts"
  test_refs:
    - "runtime/service-catalog/__tests__/service-catalog.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    Includes findUnowned() enforcing baseline section 127 (every service
    should have a recorded owner); in-memory only, no real CMDB integration.

    P1 cross-cutting fix (3rd independent review round): get()/all() returned
    the internal ServiceRecord objects directly, so a caller could set
    `record.status = "DOWN"` on a returned reference and bypass
    updateStatus() entirely. Fixed: register() stores an independent copy of
    the caller's input, and get()/all() return frozen, detached snapshots
    (runtime/util/immutable.ts). Regression tests prove a mutation attempt on
    a returned record throws and that mutating the object originally passed
    to register() does not affect the catalog's own copy. Confirmed via
    git-stash that these tests fail against the pre-fix code.

- id: UASF-REQ-0038
  title: Logging / telemetry foundation
  description: >
    Structured logging with the recommended field set, never logging
    secrets or unnecessary PII.
  source_baseline: "BASELINE-V1 section 124, 125"
  category: P0
  priority: MEDIUM
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/telemetry/logger.ts"
  test_refs:
    - "runtime/telemetry/__tests__/logger.test.ts"
  proof_refs: []
  security_refs:
    - "SECURITY.md"
  notes: >
    P1 fix (6th independent review round, "authentication headers leak
    through logging"): the sensitive-key fragment list only covered
    application-secret field names (apiKey, accessToken, ...), not
    standard HTTP/session credential-bearing names — Codex reproduced
    Authorization, Proxy-Authorization, and Cookie/session values reaching
    the sink in plaintext. Fixed: added fragments for "authorization"
    (also matches Proxy-Authorization via substring), "cookie" (also
    matches Set-Cookie), "session" (also matches sessionId/sessionid),
    "bearer", and hyphenated variants of api-key/access-token/
    refresh-token/private-key (the existing fragments only covered the
    no-separator and underscore forms; "api_key" and "api-key" are
    different substrings and both need their own entry). Regression tests
    prove: Authorization Bearer values, Proxy-Authorization, Cookie/
    Set-Cookie, nested headers inside a request-metadata object,
    mixed-case header names (AUTHORIZATION, X-Api-Key), and arrays of
    credential-bearing objects are all redacted; non-sensitive values stay
    readable; the caller's original payload object graph is never
    mutated; and all pre-existing logging behavior (recommended fields,
    timestamp) is unaffected. Confirmed via git-stash that 8 of these
    tests fail against the pre-fix fragment list with the exact leakage
    Codex described.

    Cross-cutting audit fix (same finding's targeted follow-up, "prototype-
    sensitive dictionary keys" — the same class as the FileCache
    `__proto__` finding, see UASF-REQ-0036): `redact()`'s internal
    dictionary-building loop used a plain `{}` object and bracket
    assignment (`result[key] = ...`), which for a field literally named
    `__proto__` (e.g. logging a raw JSON.parse'd payload) invoked
    `Object.prototype`'s accessor instead of creating an ordinary own
    property, silently dropping that field. Fixed by building `result` via
    `Object.create(null)` (no inherited accessors at all), so every key —
    including `__proto__`, `constructor`, `prototype` — becomes an
    ordinary own data property. Regression test proves a `__proto__`-named
    field now survives redaction/serialization unchanged and no
    prototype pollution occurs; confirmed via git-stash that this test
    fails against the pre-fix (plain-object) code.

    P1 fix (8th independent review round, "logger serialization hooks
    bypass credential redaction"): Codex reproduced a redaction bypass
    using an enumerable `toJSON()` method — redact() preserved function
    VALUES unchanged (only key names were checked for sensitivity), so a
    nested object's own `toJSON()` method survived redaction intact in the
    rebuilt tree; `log()`'s final `JSON.stringify()` call then invoked that
    `toJSON()` (JSON.stringify calls any object's toJSON, own or
    inherited, enumerable or not, completely ignoring whatever redact()
    already produced) and used its freshly-returned, NEVER-redacted
    content — reintroducing plaintext Authorization/Cookie/session
    credentials AFTER the redaction boundary had already "completed".
    Fixed: redact() now strips every function-valued property entirely
    (replacing it with the string `"[FUNCTION_REMOVED]"`) rather than
    passing it through — since the rebuilt redacted tree is always
    composed of fresh `Object.create(null)` objects containing ONLY
    copied-over own-enumerable entries, once no function value survives
    that copy, nothing in the final tree can carry an executable
    serialization hook for JSON.stringify to invoke; redaction is
    therefore applied to (and enforced on) the FINAL emitted
    representation, not bypassable by a later hook. Regression tests
    prove: a nested enumerable toJSON() cannot reintroduce Authorization,
    toJSON() cannot reintroduce Cookie/session credentials, a hook buried
    deep inside nested structure cannot bypass recursive redaction, arrays
    containing objects with toJSON() remain safe, the caller's original
    payload (including the toJSON function itself) is never mutated,
    plaintext fixture credentials from a toJSON() hook never reach the
    sink, normal non-sensitive logging and the round-6 prototype-key fix
    both remain unaffected, and no prototype pollution is introduced by
    the function-stripping itself. Confirmed via git-stash that 4 of these
    tests fail against the pre-fix code with exactly the bypass Codex
    described.

