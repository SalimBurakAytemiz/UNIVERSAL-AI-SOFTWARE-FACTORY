- id: UASF-REQ-0002
  title: Public secret / hygiene audit
  description: >
    Scan tracked files and git history for exposed secrets, credentials, and
    sensitive data before major implementation.
  source_baseline: "BASELINE-V1 section 2, 319, 307"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "scripts/secret-scan.mjs"
  test_refs:
    - "tests/secret-scan.test.mjs"
  proof_refs:
    - "CI job 'secret-scan' in .github/workflows/ci.yml"
  security_refs:
    - "SECURITY.md"
  notes: >
    Independent review (Codex) found this requirement's description
    ("scan tracked files AND git history") did not match the implementation
    (current tree only) despite being marked PROOF_VERIFIED — a real
    evidence/claim mismatch. Fixed: scanGitHistory()/listHistoricalBlobs()
    in scripts/secret-scan.mjs now scan every unique blob reachable from
    any ref (git rev-list --objects --all), catching a secret committed
    and later deleted. Tested with a real temp-repo commit+delete scenario,
    a redaction check (finding objects never carry the secret value), and
    a dedup check (identical content committed under two paths -> one
    finding, not two). One pre-existing historical finding (commit
    981f0a4, before the `secret-scan:allow` marker existed) is resolved
    via a minimal, exact-match (blob sha + line + pattern) baseline in
    scripts/secret-scan.mjs rather than rewriting public git history.
    Also fixed per the same review: the wholesale file-level allowlist for
    tests/secret-scan.test.mjs and scripts/secret-scan.mjs was removed
    (ALLOWLIST_SUBSTRINGS is now empty) — only the per-line
    `secret-scan:allow` marker can suppress a finding, with regression
    tests proving an unmarked credential anywhere in those files is still
    detected.

