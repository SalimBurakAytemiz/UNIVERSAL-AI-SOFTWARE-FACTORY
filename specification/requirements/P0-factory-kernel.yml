- id: UASF-REQ-0018
  title: Policy engine — ALLOW/DENY/APPROVAL_REQUIRED
  description: >
    Central decision engine evaluating actions against policy, returning
    ALLOW, DENY, or APPROVAL_REQUIRED, honoring the precedence order in
    section 241 (safety/security/legal > production integrity > founder
    policy > cost optimization > convenience).
  source_baseline: "BASELINE-V1 section 148, 241"
  category: P0
  priority: CRITICAL
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/policy-engine"
    - "runtime/project-lifecycle/orchestrator.ts"
  test_refs:
    - "runtime/policy-engine/__tests__/policy-engine.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/human-approval"
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Independent review (Codex) found that the risk-5 approval upgrade could
    override an explicit DENY: because the built-in risk-5 rule ran first
    (highest priority) and evaluate() stopped at the first non-null result,
    a risk-5 action that an explicit, even high-priority, DENY rule matched
    could still surface as APPROVAL_REQUIRED. Fixed in
    runtime/policy-engine/policy-engine.ts: the risk-5 upgrade is no longer
    a pre-seeded PolicyRule; evaluate() now runs all registered rules first,
    tracks whether an explicit rule matched, and only applies the risk-5
    upgrade when the resulting decision is not an explicit DENY (an
    unmatched default-deny is still eligible, preserving the existing
    "unaddressed risk-5 still requires approval" guarantee). Regression
    tests added proving: explicit DENY + risk-5 stays DENY, a
    Number.MAX_SAFE_INTEGER-priority DENY + risk-5 stays DENY, DENY beats a
    lower-priority ALLOW rule on the same risk-5 action, an otherwise-ALLOWED
    risk-5 action still requires approval, a default-deny (no rules) risk-5
    action still requires approval, and risk-5 never weakens an existing
    APPROVAL_REQUIRED decision back toward ALLOW. Confirmed via git-stash
    that these tests fail against the pre-fix code and pass after the fix.

    The integrated pipeline proof demonstrates default-deny in a realistic
    scenario: bootstrapProject() refuses to scaffold anything until an
    explicit policy rule allows it.

    P1 fix (7th independent review round, "higher-priority ALLOW bypasses
    matching DENY"): Codex reproduced a priority-10 ALLOW rule and a
    priority-1 DENY rule both matching the same action — evaluate()'s `for`
    loop sorted rules by priority descending and `break`-ed at the FIRST
    rule returning a non-null decision, so once the high-priority ALLOW
    matched, the lower-priority DENY rule was never even evaluated,
    violating "DENY ALWAYS WINS" (section 147/241) for both risk-1 (action
    executed) and risk-5 (surfaced as APPROVAL_REQUIRED instead of DENY).
    Fixed: evaluate() no longer breaks early — it evaluates every
    applicable rule and separately tracks the highest-priority DENY match
    and the highest-priority non-DENY match; a DENY match, if one exists at
    ANY priority, always wins over a non-DENY match regardless of relative
    rule priority (Array.prototype.sort's stability preserves prior
    deterministic tie-breaking by registration order within each category).
    The existing risk-5-never-weakens-an-explicit-DENY logic (round 3) is
    unchanged and still correct now that it actually sees the DENY.
    Regression tests prove: a low-priority DENY beats a high-priority ALLOW
    for both risk-1 and risk-5 actions, a low-priority DENY beats a
    high-priority APPROVAL_REQUIRED rule, a DENY at the very bottom of
    priority order still surfaces over multiple higher ALLOWs, the
    higher-priority of two matching DENY rules is reported deterministically,
    non-conflicting cases (no DENY at all) still pick the highest-priority
    ALLOW exactly as before, a non-matching DENY rule never blocks an
    unrelated ALLOW, and the audit log records the DENY (not the shadowed
    ALLOW). Confirmed via git-stash that 5 of these tests fail against the
    pre-fix code with exactly the DENY-bypass Codex described.

    P1 fix (25th independent review round, "policy actions must be snapshotted before rule evaluation"):
    `evaluate()` passed the SAME mutable, caller-owned `action` object to every rule in sequence — a careless or
    malicious earlier rule (e.g. an ALLOW rule for a broad category) could mutate `action.actionType`/`.risk`
    in place before a later rule (that would otherwise DENY the ORIGINAL action) ever ran, so the later rule
    evaluated a different action than the one actually being authorized, potentially letting a DENY-worthy
    action slip through under a relabeled identity. Fixed: the very first thing `evaluate()` does is copy
    `action` into a frozen `authoritativeAction` snapshot (`freezeRecord`) — every rule, the risk-5 escalation
    check, the audit payload, and the returned decision all reference this ONE frozen snapshot, never the
    original mutable parameter. `PolicyAction` also gained optional `projectId`/`actorId` fields (needed for
    UASF-REQ-0020's complete-identity approval binding). Three new regression tests prove: an earlier rule's
    mutation attempt throws `TypeError` against the frozen object and a later DENY rule still evaluates the
    ORIGINAL, untouched action; mutating the action after `evaluate()` returns has no effect on the returned
    decision. Verified via a temporary bypass (using the raw `action` parameter instead of a frozen snapshot) —
    confirmed exactly the 3 predicted tests failed, then reverted and re-confirmed all tests passing.

    P1 fix (26th independent review round, finding 4, "reject invalid risk values before policy evaluation"):
    `PolicyAction.risk`'s TypeScript type (`RiskLevel = 0|1|2|3|4|5`) only constrains code the compiler can see —
    it does nothing for a `PolicyAction` built from runtime/deserialized input (a JSON-parsed request body, a
    persisted-then-restored action, or an `as PolicyAction` type assertion). Codex reproduced: `risk: -1`
    satisfies `lowRiskAllowRule`'s `action.risk <= maxRisk` comparison (`-1 <= 2` is `true`) and receives ALLOW —
    an action whose risk was never actually valid slipping through the cheapest, least-scrutinized rule in the
    system; the same class of bug affects any rule reasoning numerically about an unvalidated `risk`
    (`NaN`/`Infinity`/fractional/out-of-range/non-numeric values behave unpredictably in either direction).
    Fixed: a new `assertValidRiskLevel()` runs as the VERY FIRST statement inside `evaluate()` — before the
    `authoritativeAction` snapshot is even built — requiring `risk` to be a genuine integer 0-5 inclusive;
    anything else (negative numbers, values above 5, fractions, NaN, Infinity, strings, null, undefined) throws
    a new `InvalidRiskLevelError` immediately, fail closed, so NO rule (not even the first one evaluated) ever
    observes an invalid risk. Twenty new regression tests prove: the exact `risk: -1` BLOCKER reproduction is
    refused; every invalid class (14 cases via `it.each`) is refused; negative zero (a valid integer 0) is
    correctly accepted, not rejected; the valid boundaries 0 and 5 both evaluate normally; no rule is ever
    invoked and no audit entry is recorded when risk is invalid; and `InvalidRiskLevelError` is a distinct error
    type, never silently resolving to any `PolicyDecision`. Verified via a temporary bypass (skipping the
    validation call) — confirmed the exact predicted tests failed, then reverted and re-confirmed all passing.

    P1 targeted-audit fix (26th independent review round, same root class as finding 2, "cost ledger state must
    be runtime-private"): the internal `rules` array still used TypeScript's compile-time-only `private`
    keyword. Since `rules` IS the entire default-deny enforcement surface (bölüm 147), `(engine as
    any).rules.length = 0` or `.push(alwaysAllowRule)` from any caller holding a `PolicyEngine` reference could
    silently strip every registered DENY rule or inject a rule that always wins — defeating the single most
    important P0 guarantee with no trace in `evaluate()` itself. Converted to a genuine ECMAScript `#rules`
    private field. Three new regression tests prove the field is unreachable via property access or any
    reflection API, and that a plain JS consumer cannot strip a registered DENY rule this way (the rule is still
    genuinely in force after the attempted property manipulation). Verified via a temporary bypass (reverting to
    `private rules`) — confirmed exactly the 3 predicted tests failed, then reverted and re-confirmed all tests
    passing.

    P1 fix (27th independent review round, findings 1-2, consolidated closure batch): (1) "snapshot risk before
    validating it" — `evaluate()` used to read `action.risk` for `assertValidRiskLevel()`, THEN build the
    detached `authoritativeAction` snapshot afterward — two separate reads of a caller-owned object that, if
    getter/Proxy-backed, need not agree; a getter answering `0` on the validation read and something else on
    every subsequent read could pass validation while every rule actually evaluates a different, unvalidated
    value. Fixed by reordering: `authoritativeAction` is now built FIRST (a single `{ ...action }` read), and
    `assertValidRiskLevel(authoritativeAction.risk)` validates that SAME static snapshot — no rule, and no
    later mutation/getter re-invocation, can ever see a value that differs from what was validated. (2) "detach
    registered policy rules" — `addRule()` used to `push()` the caller's own mutable rule object directly;
    mutating `rule.priority`/`rule.evaluate`/`rule.name` on the caller's own reference AFTER registration would
    silently change evaluation order or replace a rule's entire decision logic, defeating "DENY always wins" (the
    same class as this file's own round-26 `#rules`-privacy fix, just reachable by mutating the RULE OBJECT
    itself rather than the array holding it). Fixed: `addRule()` now stores `freezeRecord({ ...rule })` — a
    frozen, detached copy — so no post-registration mutation of the caller's original object reaches the engine's
    internal state. New regression tests (7 total, across both findings) prove: a getter/Proxy-backed `risk` that
    answers differently on a second read is consulted exactly once and the validated value is what every rule
    evaluates; mutating a registered rule's `priority`/`evaluate`/`name` on the caller's own object afterward has
    zero effect on evaluation order or outcome. Verified via a temporary bypass (reverting finding 1's ordering
    and finding 2's snapshot-on-register) — confirmed the exact predicted tests failed in each case, then both
    reverted and all tests re-confirmed passing.

- id: UASF-REQ-0019
  title: Capability gateway (foundation)
  description: Enforcement point routing actions through the policy engine before execution.
  source_baseline: "BASELINE-V1 section 147"
  category: P0
  priority: HIGH
  status: PROOF_VERIFIED
  implementation_refs:
    - "runtime/capability-gateway/gateway.ts"
    - "runtime/project-lifecycle/orchestrator.ts"
  test_refs:
    - "runtime/capability-gateway/__tests__/gateway.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    Tests assert the wrapped execute() function is never called on DENY or APPROVAL_REQUIRED, only on ALLOW. Now
    the real enforcement point in front of Project OS scaffolding in the integrated pipeline — not just a
    standalone demonstration.

    P1 fix (24th independent review round, "approved requests must pass capability gateway"): `authorize()`
    used to unconditionally throw `CapabilityApprovalRequiredError` for an APPROVAL_REQUIRED decision, with no
    way to present evidence of an approval that had already genuinely happened — so an action a human Founder
    had actually approved through `ApprovalWorkflow` (UASF-REQ-0020) could still never execute through this,
    the ONE authoritative gateway (baseline section 147). Added an optional `ApprovalEvidence` parameter
    (`{ workflow, approvalId }`); `authorize()` independently re-verifies it before allowing execution: the
    referenced request must exist, be APPROVED (never PENDING/REJECTED/REQUEST_CHANGES), and its own recorded
    `actionDescription`/`risk` must match the action being authorized right now (`ApprovalEvidenceMismatchError`
    otherwise) — an approval for one action can never be replayed to authorize a different one. An explicit
    DENY is checked first and is never affected by approval evidence, however genuine. Six new end-to-end
    regression tests (real `ApprovalWorkflow` + `CapabilityGateway` together) prove: a matching APPROVED request
    executes; PENDING/REJECTED/REQUEST_CHANGES requests are all still blocked; replay against an unrelated
    approved action is rejected; an unknown approval id is rejected; and DENY always wins even with genuine
    approval evidence attached. Verified via a temporary bypass (accepting any existing request regardless of
    status/action match) — confirmed exactly the 4 predicted tests (REJECTED, REQUEST_CHANGES, replay, unknown
    id) failed, then reverted and re-confirmed all passing.

    Round 25 findings 1-3, 7 (one consolidated closure batch): (1) "approval workflow must be authoritative" —
    the 24th round's `{ workflow, approvalId }` evidence shape let ANY caller fabricate its own throwaway
    `ApprovalWorkflow`, request+approve a fake entry with no real reviewer, and hand it back as "evidence"; fixed
    by making `CapabilityGateway` OWN its authoritative `approvals` store, injected ONCE at construction (never
    per-call) — `authorize()`'s third parameter is now `ApprovalReference { approvalId: string }`, structurally
    incapable of carrying a workflow object. (2) "approval must be bound to complete action identity" — matching
    compared only `actionDescription`/`risk`, so two materially different actions sharing a similar
    description/risk could not be told apart; `isBoundToExactAction()` now compares `actionType`, `description`,
    `risk`, `costUsd`, `projectId`, and `actorId` — a legacy `request()`-created approval (which never records
    these) can never satisfy this check. (3) "approval evidence must be consumed before execution" — a matching
    APPROVED request stayed APPROVED (reusable) after `authorize()` let execution proceed, so the same approval
    could authorize two concurrent/sequential executions; fixed by atomically calling `approvals.execute()`
    (APPROVED -> EXECUTED) in the SAME synchronous prefix as the match check, before the risky callback runs —
    JS's run-to-completion semantics make a concurrent replay's own re-check see EXECUTED, not APPROVED. (7) "do
    not reauthorize after paid bootstrap work" — `runtime/project-lifecycle/orchestrator.ts`'s `bootstrapProject()`
    called `gateway.authorize(scaffoldAction, ...)` TWICE (a no-op pre-check, then the real scaffold call), with a
    paid model invocation sandwiched between them; a stateful policy rule could answer ALLOW on the first call and
    DENY on the second, after cost was already committed. Fixed by collapsing both calls into ONE `authorize()`
    whose `execute` callback contains BOTH the model invocation and the scaffold mutation — exactly one
    `policy.evaluate(scaffoldAction)` call now exists in the whole function. New regression tests across
    `capability-gateway/__tests__/gateway.test.ts` (18 tests covering findings 1-3) and
    `project-lifecycle/__tests__/orchestrator.test.ts` (2 new tests: a stateful ALLOW-then-DENY rule cannot cause
    paid work followed by a rejected scaffold; a DENY on the sole evaluation fails closed with no paid work at
    all). Every fix verified via a temporary in-place bypass reproducing the exact predicted failure, then fully
    reverted: finding 2's weakened binding check (4 predicted failures), finding 3's removed consumption call (3
    predicted failures, including a genuine `Promise.allSettled` concurrency race), and finding 7's reintroduced
    two-call pattern (the exact `CapabilityDeniedError` reproduction).

    P1 fix (27th independent review round, findings 3-5 and 10, consolidated closure batch): (3) "make gateway
    dependencies runtime-private" — `#policy`/`#approvals` used to be TypeScript constructor-parameter `private
    readonly` fields, compile-time-only; `(gateway as any).policy = alwaysAllowStub` from any caller holding a
    `CapabilityGateway` reference would silently replace the ENTIRE decision engine this class exists to enforce
    through. Converted to genuine ECMAScript `#policy`/`#approvals` private fields, assigned once in the
    constructor body. (4) "bind approval to the policy-evaluated action" — `authorize()` evaluated a detached
    `authoritativeAction` snapshot for the policy decision, but then matched approval evidence by re-reading
    `action` (the caller's original, still-mutable object) a second time; a getter/Proxy-backed `action` could
    answer a low, ALLOW-eligible risk during policy evaluation and a different value during the approval match,
    letting a genuinely mismatched approval slip through. Fixed: `isBoundToExactAction()` now compares the
    approval evidence against `result.action` (the SAME detached snapshot `policy.evaluate()` already produced
    and decided on) — never the caller's original object again. (5) "finalize approval only after successful
    execution" — a matching APPROVED request was moved straight to EXECUTED via `approvals.execute()` BEFORE the
    wrapped `execute()` callback ran; if that callback threw (a real, failure-prone async operation — a paid
    model call, a filesystem mutation), the approval record falsely claimed successful execution had completed,
    with no way to distinguish "genuinely executed" from "claimed then failed," and no valid retry path. Fixed
    with a three-state lifecycle in `runtime/policy-engine/approval.ts` (bkz. UASF-REQ-0020's own round-27 note
    below): `beginExecution()` (APPROVED -> EXECUTING, non-terminal) runs BEFORE the callback, then
    `completeExecution()` (EXECUTING -> EXECUTED) on success or `failExecution()` (EXECUTING -> EXECUTION_FAILED,
    terminal, with a recorded `failureReason`) on failure — `authorize()`'s callback is wrapped in try/catch to
    route to whichever outcome actually occurred; the original error is always rethrown unchanged. (10) "provide a
    real approval path for risk-5 bootstrap" — `runtime/project-lifecycle/orchestrator.ts`'s `bootstrapProject()`
    used to construct its internal `CapabilityGateway` with NO approvals argument at all
    (`new CapabilityGateway(policy)`), defaulting to a brand-new `ApprovalWorkflow()` LOCAL to that single function
    call — structurally unreachable by any caller, so a risk-5 (or any APPROVAL_REQUIRED) scaffold was
    UNCONDITIONALLY impossible to bootstrap regardless of genuine Founder approval — the exact opposite failure
    mode from finding 1's "approval can be forged" (round 25), but just as much a defect. Fixed: `BootstrapProjectInput`
    gained optional `approvals`/`approvalId` fields; when supplied, the caller's OWN authoritative `ApprovalWorkflow`
    (the same store a reviewer would have called `requestFor()`/`approve()` on beforehand) is wired into the
    internal gateway at construction time, and the matching `ApprovalReference` is passed through to
    `gateway.authorize()`; omitted, the function falls back to the OLD safe default (default deny preserved for
    callers that do not opt in). New regression tests: findings 3-5 add tests across
    `capability-gateway/__tests__/gateway.test.ts` (not-reachable-as-property, no-reflection-exposure, and forged
    inert-property tests for finding 3; a getter-based mutation-between-policy-and-approval BLOCKER regression for
    finding 4; callback-throws, async-throw, original-error-rethrown, failure-reason-recorded,
    non-retryable-after-failure, and concurrent-replay-with-one-failure tests for finding 5); finding 10 adds a
    "full risk-5 bootstrap approval regression" describe block to
    `project-lifecycle/__tests__/orchestrator.test.ts` (7 tests) proving a genuine matching APPROVED request
    succeeds exactly once (and reaches EXECUTED), PENDING/REJECTED/REQUEST_CHANGES requests all still block,
    omitting `approvals`/`approvalId` still unconditionally blocks (default deny preserved — not a regression),
    a caller-forged LOCAL `ApprovalWorkflow` never wired into `BootstrapProjectInput.approvals` cannot smuggle
    approval, and an approval recorded for a DIFFERENT project's identity cannot authorize this one. Every fix
    verified via a temporary in-place bypass reproducing the exact predicted failure, then fully reverted; finding
    10's bypass (reverting to `new CapabilityGateway(policy)` with no `approvalReference` passed) confirmed the
    exact predicted `CapabilityApprovalRequiredError` on the BLOCKER regression, and correctly changed the forged-
    workflow test's expected error type (no approval reference at all, rather than a lookup miss against the
    default empty store) — both reverted and all 54 orchestrator tests re-confirmed passing.

- id: UASF-REQ-0020
  title: Human approval workflow
  description: >
    Risk-5 actions (production deploy, destructive DB ops, secret mutation,
    premium-model escalation outside budget, etc.) require an explicit
    APPROVE/REJECT/REQUEST_CHANGES decision and can never reach EXECUTED
    without it.
  source_baseline: "BASELINE-V1 section 145, 146"
  category: P0
  priority: CRITICAL
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/policy-engine/approval.ts"
  test_refs:
    - "runtime/policy-engine/__tests__/policy-engine.test.ts"
  proof_refs:
    - "proofs/human-approval"
  security_refs: []
  notes: >
    P1 fix (3rd independent review round): request()/get() returned the
    actual internal (mutable) ApprovalRequest object. Codex reproduced
    `const r = workflow.request(...); r.status = "APPROVED"; execute(id)` —
    a caller could forge an APPROVED status on their own returned copy
    without ever calling approve(), completely bypassing the "Risk-5 can
    never reach EXECUTED without genuine Human Founder approval" invariant
    (section 120). Fixed: internal state is now a private
    MutableApprovalRequest map; request()/get()/approve()/reject()/execute()
    all return a frozen, detached snapshot (runtime/util/immutable.ts) —
    mutating a returned value throws instead of silently succeeding, and
    execute() always checks the private authoritative record, never a
    caller-held reference. Also added: a required, non-empty approver
    identity check (InvalidApprovalDecisionError), an optional evidenceRef
    parameter on approve()/reject() (approval evidence per section 145), and
    AuditLog integration recording every REQUESTED/APPROVED/REJECTED/
    EXECUTED transition. Regression tests prove: mutating request()/get()/
    list() return values cannot approve or reset an action, a risk-5 action
    can never execute without an explicit approve(), an EXECUTED or REJECTED
    record cannot be reset via a leaked reference, empty-approver attempts
    are rejected without mutating state, and every transition appears in the
    (integrity-verified) audit log. Confirmed via git-stash that these tests
    fail against the pre-fix code.

    P2 fix (7th independent review round, "duplicate approval IDs replace
    authoritative history"): request() called
    `this.requests.set(id, req)` unconditionally — Codex reproduced
    requesting approval id X, approving it, executing it, then calling
    request() again with the SAME id X: the existing authoritative record
    (EXECUTED, with real approver identity and evidence) was silently
    REPLACED with a fresh PENDING record, discarding all provenance. Fixed:
    request() now throws a new DuplicateApprovalIdError before any mutation
    if the id already exists, regardless of the existing record's current
    status (PENDING/APPROVED/REJECTED/EXECUTED) — mirroring
    decision-ledger.ts's DuplicateDecisionError pattern. Regression tests
    prove: a duplicate id is rejected while PENDING, APPROVED, and REJECTED;
    a duplicate id cannot silently erase an EXECUTED record's approver
    identity, decision timestamp, evidence reference, or terminal status; a
    rejected duplicate does not mutate requestedAt or risk; no spurious
    APPROVAL_REQUESTED audit entry is appended; distinct ids remain
    independent; execute() still fails correctly after a rejected duplicate
    attempt; and the error names the offending id. Confirmed via git-stash
    that 8 of these tests fail against the pre-fix code, including the
    exact EXECUTED-record-erasure reproduction Codex described.

    P2 fix (23rd independent review round, "implement REQUEST_CHANGES
    approval decision"): the authoritative P0 requirement lists THREE
    reviewer decisions — APPROVE, REJECT, REQUEST_CHANGES — but
    `ApprovalStatus` only had PENDING/APPROVED/REJECTED/EXECUTED. A
    reviewer with "not yet, here's what must change" had no way to
    represent that decision without misclassifying it as REJECTED (losing
    the "revise and resubmit" semantics and any recorded reason) or
    leaving the request PENDING forever. Fixed: `REQUEST_CHANGES` is now
    a first-class `ApprovalStatus` value; a new `requestChanges(id,
    decidedBy, reason, evidenceRef?)` method requires BOTH a genuine
    (non-blank, via the shared `isNonBlankIdentity` — see UASF-REQ-0011)
    reviewer identity AND a genuine non-blank `reason` (without a reason,
    REQUEST_CHANGES would be indistinguishable from an unexplained
    REJECT); is legal only from PENDING (the same guard as approve()/
    reject()) and is terminal for that request id — a revised action
    requires a fresh, distinct id via request() (consistent with
    DuplicateApprovalIdError's permanent-identity philosophy); records a
    distinct `APPROVAL_CHANGES_REQUESTED` audit event, never
    `APPROVAL_REJECTED`; and — since execute() already only permits
    `status === "APPROVED"` — a REQUEST_CHANGES record is structurally
    unable to ever reach EXECUTED, with no change needed to execute()
    itself. Twelve new regression tests prove: the state transition and
    recorded reason/identity; REQUEST_CHANGES is distinct from REJECTED
    (not merely a rename); blank reviewer identity and blank reason are
    both rejected; REQUEST_CHANGES is terminal (cannot subsequently
    approve/reject/request-changes again, cannot execute); a revised
    action needs a fresh id; evidenceRef is recorded alongside the
    reason; the audit event is distinct; and the frozen-snapshot
    immutability invariant holds for requestChanges()'s return value too.
    Verified via a temporary bypass (misclassifying REQUEST_CHANGES as
    REJECTED, simulating the pre-fix absence of this decision) that
    correctly failed 6 of the new tests, then fully reverted. This module
    has no existing persistence (saveTo/loadFrom) layer to extend for
    REQUEST_CHANGES — unlike assumption-register.ts/decision-ledger.ts,
    ApprovalWorkflow is currently in-memory-only, so "persistence keeps
    the decision and evidence" is honestly out of scope for this fix
    (adding a persistence layer that doesn't otherwise exist would be
    architecture expansion beyond this finding).

    P1 fix (24th independent review round, "approval state must be runtime-private"): the request/decision map
    was declared with TypeScript's `private` keyword — compile-time-only, compiling to an ordinary enumerable
    JS property. A consumer holding an `ApprovalWorkflow` instance could reach it via `(workflow as any).requests`
    (or plain bracket access) and mutate a record's `status` directly, e.g. flipping PENDING straight to
    APPROVED, completely bypassing `approve()`'s reviewer-identity check and audit event. Fixed the same way
    `runtime/models/gateway.ts`'s `#providers`/`#rawInvoke` already are: a genuine ECMAScript private class
    field (`#requests`), enforced by the JS runtime itself — `as any`, bracket access,
    `Object.getOwnPropertyNames()`, and `Reflect.ownKeys()` all fail to reach it. Regression tests prove the
    field is unreachable via ordinary property access and every reflection API, and that mutating a returned
    (frozen) record still cannot change authoritative state. Verified via a temporary bypass (reverting to TS
    `private requests`) — confirmed the exact predicted 3 new tests failed, then reverted and re-confirmed all
    passing.

    Round 25 findings 1-3, 6 (one consolidated closure batch — see UASF-REQ-0019 for the full findings 1-3
    narrative, UASF-REQ-0024 for finding 6): added `requestFor(id, action: PolicyAction, options?: {actorId})`,
    the recommended way to request an approval that will be presented to `CapabilityGateway.authorize()` — it
    records the COMPLETE action identity (`actionType`, `description`, `risk`, `costUsd`, `projectId`,
    `actorId`), not just the legacy `actionDescription`/`risk` pair `request()` stores. A request created via the
    legacy `request()` method deliberately leaves these new fields `undefined`, so it can never satisfy
    `isBoundToExactAction()`'s full-identity check — only `requestFor()` produces gateway-usable evidence. The
    pre-existing synchronous `execute()` method (APPROVED -> EXECUTED) is what `CapabilityGateway.authorize()`
    now calls atomically before running its risky callback (finding 3). No changes to `ApprovalWorkflow`'s own
    state machine or persistence scope were needed beyond `requestFor()`'s addition; new coverage lives in
    `capability-gateway/__tests__/gateway.test.ts` (see UASF-REQ-0019).

    P1 fix (27th independent review round, finding 5 — see UASF-REQ-0019 for the full narrative): the single
    unconditional `execute(id)` method (APPROVED -> EXECUTED) that `CapabilityGateway.authorize()` called BEFORE
    running its wrapped callback could not distinguish "the callback genuinely succeeded" from "the callback threw
    and nothing actually completed" — the approval record was already EXECUTED either way, permanently and
    falsely certifying success on a failure, with no valid retry path (a second attempt against the same id would
    see an already-EXECUTED, non-PENDING/non-APPROVED status and be rejected as replay, exactly as it should be
    for a genuinely completed approval, but wrongly so for one that never actually ran). `ApprovalStatus` gained
    two states: `EXECUTING` (non-terminal, in-flight — set the moment execution genuinely begins) and
    `EXECUTION_FAILED` (terminal — set only if the wrapped work demonstrably threw, carrying an optional
    `failureReason`). Three new granular methods replace the single transition: `beginExecution(id)` (APPROVED ->
    EXECUTING), `completeExecution(id)` (EXECUTING -> EXECUTED, called only after the wrapped work genuinely
    returns), and `failExecution(id, reason?)` (EXECUTING -> EXECUTION_FAILED). The original `execute(id)` is kept
    as a backward-compatible convenience wrapper composing `beginExecution()` + `completeExecution()` for any
    caller with no failure-prone work to guard — every one of the 79+ pre-existing direct-`execute()`-call test
    sites continues to work unchanged. `CapabilityGateway.authorize()` (the only production call site wrapping a
    real, failure-prone async callback) now calls `beginExecution()` before the callback and routes to
    `completeExecution()`/`failExecution()` from a try/catch around it (see UASF-REQ-0019's own round-27 note).
    "Valid retry semantics": `EXECUTION_FAILED` is terminal — the SAME approval id can never be retried (matching
    the existing DENY-precedent contract that an approval authorizes at most one execution attempt); a genuine
    retry means requesting a brand-new approval id via `requestFor()`. New regression tests in
    `capability-gateway/__tests__/gateway.test.ts` prove: a callback that throws leaves the record
    `EXECUTION_FAILED`, never `EXECUTED`; the same holds for an async throw; the original error is rethrown
    unchanged (`.rejects.toBe(boom)`); the failure reason is recorded; a second attempt against the same
    (now-`EXECUTION_FAILED`) id is rejected as non-retryable; and a `Promise.allSettled` concurrent-replay test
    confirms one execution's failure never corrupts another's independent success. A pre-existing audit-log-
    sequence test was updated to expect the new, more granular `APPROVAL_EXECUTION_STARTED` event alongside the
    existing `APPROVAL_REQUESTED`/`APPROVAL_APPROVED`/`APPROVAL_EXECUTED` sequence — a legitimate improvement in
    audit trail granularity, not a regression. Verified via a temporary bypass (reverting `authorize()`'s
    try/catch-wrapped `beginExecution`/`completeExecution`/`failExecution` calls back to a single unconditional
    `execute()` before the callback) — confirmed the exact predicted callback-throws/failure-reason/non-retryable
    tests failed, then reverted and re-confirmed all passing.

- id: UASF-REQ-0021
  title: Durable state / resume
  description: >
    Maintain project-state/current.yml recording phase, milestones, branch,
    commit, blockers, and exact next action so interrupted work resumes
    without repeating valid completed work.
  source_baseline: "BASELINE-V1 section 277"
  category: P0
  priority: HIGH
  status: PROOF_VERIFIED
  implementation_refs:
    - "project-state/current.yml"
    - "runtime/state/file-store.ts"
    - "runtime/decisions/decision-ledger.ts"
    - "runtime/assumptions/assumption-register.ts"
    - "runtime/project-lifecycle/orchestrator.ts"
  test_refs:
    - "runtime/state/__tests__/file-store.test.ts"
    - "runtime/decisions/__tests__/decision-ledger.test.ts"
    - "runtime/assumptions/__tests__/assumption-register.test.ts"
    - "runtime/project-lifecycle/__tests__/orchestrator.test.ts"
  proof_refs:
    - "proofs/p0-integrated-flow/proof.test.ts"
  security_refs: []
  notes: >
    project-state/current.yml is the session-level durable record
    (Founder-facing prose+structure). runtime/state/file-store.ts is the
    code-level StateStore interface (baseline section 275) with a
    JSON-file implementation, used by the Decision Ledger, Assumption
    Register, and the P0 bootstrap pipeline; a real process-restart is
    simulated in tests via a fresh store instance reading the same path.

    P2 fix (8th independent review round, "failed state writes destroy
    previous recoverable state"): FileStateStore.write() used to call
    `writeFileSync(path, ...)` DIRECTLY against the destination. Codex
    reproduced a real write failure (ör. EFBIG/disk-full): if a valid
    state file already existed and the write was interrupted partway
    through, the previous valid file was overwritten with TRUNCATED,
    invalid JSON — a subsequent read() threw a SyntaxError and the state
    was completely unrecoverable, directly violating "kalıcı durum" (bölüm
    277)'s core promise that a failed write must never destroy the last
    known-good durable state. Fixed with the standard atomic-write
    pattern: the full content is written to a temporary SIBLING file in
    the SAME directory first (so `renameSync` is guaranteed atomic — no
    cross-filesystem rename assumption), and the destination is only
    replaced via `renameSync` after that write fully succeeds; if the
    temp write fails, the destination is never touched and the temp file
    is best-effort cleaned up (a cleanup failure never masks the original
    write error). Regression tests, using a spy that wraps the REAL
    `node:fs.writeFileSync`/`unlinkSync` (so both this test file's and the
    module-under-test's imports resolve to the same mocked module record)
    and simulates a genuine PARTIAL write (some bytes reach disk before
    the injected failure, faithfully matching a real EFBIG/disk-full
    scenario rather than merely intercepting the call before any disk I/O
    happens), prove: a simulated write failure leaves the previous valid
    state byte-identical, a fresh store instance still recovers the prior
    state afterward, a successful write atomically replaces old content,
    no partially-written temp file remains after success OR after a
    cleanup-succeeded failure, a cleanup failure never masks the original
    write error, and existing FileCache/durable-state users continue to
    work unchanged. Confirmed via git-stash that 3 of these tests fail
    against the pre-fix code with exactly the truncated-JSON/SyntaxError
    corruption Codex described.

    P2 fix (14th independent review round, "reject unserializable state
    before replacing valid durable state"): the 8th round's atomic-write
    fix above protects against a write that STARTS and then fails
    partway through, but did not protect against a value that
    `JSON.stringify(data, null, 2)` SILENTLY turns into `undefined`
    (WITHOUT throwing) — this happens for `data === undefined` itself, a
    function, a symbol, or an object whose own `toJSON()` returns
    `undefined`. The old code interpolated that `undefined` return value
    directly into a template literal (`` `${JSON.stringify(...)}\n` ``),
    which JS coerces to the four-character TEXT STRING `"undefined"` —
    not valid JSON, but a perfectly normal string as far as
    `writeFileSync`/`renameSync` are concerned, so it was written to the
    temp file and atomically promoted over a PREVIOUSLY VALID destination
    file anyway. Codex reproduced: `write(path, {version:1})` succeeds,
    `write(path, undefined)` ALSO succeeds (silently), the valid state is
    replaced, and a subsequent `read(path)` then throws a `SyntaxError`
    with the original state completely unrecoverable — the same class of
    "kalıcı durum" (bölüm 277) violation as the 8th round's finding, just
    triggered by an unserializable VALUE instead of an interrupted write.
    Fixed: a new exported `UnserializableStateError` is thrown, and
    `write()` now validates that `JSON.stringify(data, null, 2)`
    genuinely returns a string BEFORE any filesystem action at all (not
    merely before the atomic rename) — `typeof result !== "string"`
    (covers the silent-`undefined` case) is rejected explicitly; a
    THROWING `JSON.stringify` (circular reference, BigInt) is also caught
    and wrapped into the same typed error, so both failure MODES of
    serialization share one clear, documented outcome. As defense in
    depth (per the review's explicit "prefer validating round-trip
    parseability" ask), the produced string is also round-tripped through
    `JSON.parse()` before being accepted, protecting against a future
    custom replacer even though `JSON.stringify` without one is already
    guaranteed by the language to produce valid JSON when it returns a
    string at all. Since validation now happens BEFORE `mkdirSync`/the
    temp file is even created, a rejected write leaves genuinely ZERO
    filesystem footprint — not just "no corruption," but no artifact of
    any kind. Regression tests (file-store.test.ts, new describe block)
    prove: the exact reproduction (valid state A, `write(undefined)` is
    REJECTED, A remains byte-identical and readable), the same for a
    function value and for an object whose `toJSON()` returns `undefined`,
    a circular-reference value and a BigInt-containing value (both of
    which make `JSON.stringify` THROW rather than return `undefined`) are
    likewise rejected without touching the destination, a genuinely valid
    state B still atomically replaces A (no regression in the happy
    path), a rejected write creates no temp-file artifact at all (not
    merely one that gets cleaned up), a rejected write does not even
    create a brand-new parent directory that didn't already exist, a
    fresh store instance (simulated restart) still recovers the previous
    valid state after a rejected write, and the thrown error names the
    rejected path and preserves the underlying serialization failure as
    its `cause` for a thrown (not silently-undefined) case. Confirmed via
    a temporary bypass (reverting to the old direct
    `` `${JSON.stringify(data, null, 2)}\n` `` interpolation with no
    validation) that exactly 9 of the 10 new tests fail (the
    valid-state-B-still-replaces-A happy-path test correctly stayed
    green, since it exercises behavior this fix does not change), then
    reverted. A narrow audit of the durable state write/persistence path
    confirmed `runtime/state/file-store.ts` is the ONLY production
    `writeFileSync` call site in the entire P0 kernel — `runtime/cache/
    file-cache.ts` (the other durable-persistence consumer) delegates to
    this SAME `write()` and is automatically protected; no other genuine
    instance of "serialization failure -> destination replaced/corrupted"
    was found.

- id: UASF-REQ-0022
  title: Audit (foundation)
  description: Append-only audit log for policy/approval/budget decisions.
  source_baseline: "BASELINE-V1 section 242"
  category: P0
  priority: HIGH
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/audit"
  test_refs:
    - "runtime/audit/__tests__/audit-log.test.ts"
    - "runtime/budget/__tests__/budget.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    Now also consumed by BudgetGuard (runtime/budget/budget.ts) to record
    allowed and blocked spend checks as durable, hash-chained evidence — not
    just policy-engine decisions.

    P1 cross-cutting fix (3rd independent review round, found during the
    mutability audit triggered by the ApprovalWorkflow/CostEngine findings):
    all() returned the internal `records` array directly — a caller could
    `auditLog.all().push(forgedRecord)` to inject a fabricated entry outside
    the hash chain, or `.splice()` to silently drop the most recent record,
    neither of which verifyIntegrity() would ever catch (it only walks
    whatever the array currently contains). This directly undermined the
    "append-only, tamper-evident" guarantee this module exists to provide.
    Fixed (round 3): append()/all() returned frozen, detached SHALLOW copies
    (runtime/util/immutable.ts freezeRecord) — array-level injection/deletion
    via a returned reference was no longer possible, and a top-level field
    reassignment threw instead of silently succeeding. At that point, nested
    payload mutation was still only detectable (not preventable) via hash
    mismatch on verifyIntegrity(), which was believed to match the module's
    "tamper-evident" (not "tamper-proof") promise.

    P1 fix (4th independent review round, "audit payload mutability leak
    remains"): Codex correctly identified that shallow freezing is
    insufficient for a `payload: Record<string, unknown>` field that can
    hold arbitrary nesting — `record.payload.detail.amount = 9999` was
    still possible on a returned snapshot, AND (more severely) the ORIGINAL
    event object passed into append() was never detached from the caller
    at all (only a shallow `{...event}` copy was stored), so a caller
    mutating their own original payload object AFTER calling append() could
    corrupt the "already written" authoritative record directly, with no
    detection needed to bypass — no mutation of a returned value was even
    required. Fixed: added deepFreezeClone() (runtime/util/immutable.ts,
    using `structuredClone` + a recursive `deepFreeze`) and append() now
    detaches the incoming event via `structuredClone` BEFORE storing it,
    while append()/all() return full deep clones, deeply frozen. Regression
    tests prove: mutating the original payload (including nested
    objects/arrays) after append() does not change the stored record,
    mutating append()'s or all()'s return value (including a deeply nested
    field) throws instead of silently succeeding, previously written
    evidence remains structurally identical across reads, ordering/
    sequence/timestamps are unaffected, and a non-serializable payload
    (e.g. a function) now fails closed via `structuredClone` rather than
    being silently dropped by JSON.stringify inside hashOf(). Confirmed via
    git-stash that these tests fail against the round-3 (shallow-freeze)
    code.

    P1 fix (25th independent review round, "audit records must be runtime-private and append-only"): the
    internal `records` array used TypeScript's compile-time-only `private` keyword — compiled JS leaves it an
    ordinary, enumerable instance property, reachable via `(log as any).records` or plain bracket access with no
    type-system escape hatch needed at all, letting a consumer push a fabricated record, splice one out, or
    reorder history directly, none of which `verifyIntegrity()` could ever catch (it only walks whatever the
    array currently contains). Converted to a genuine ECMAScript `#records` private field, the same pattern
    later reused this round for `policy-engine/approval.ts`'s `#requests` (UASF-REQ-0020),
    `decisions/decision-ledger.ts`'s `#decisions` (UASF-REQ-0010), `assumptions/assumption-register.ts`'s
    `#assumptions` (UASF-REQ-0011), `workers/registry.ts`'s `#workers` (UASF-REQ-0031), and
    `models/registry.ts`'s `#models` (UASF-REQ-0025) — a narrow targeted audit for this exact root class found
    those four additional genuine instances beyond the ten originally-reported findings. Three new regression
    tests prove the field is unreachable via ordinary property access and every reflection API
    (`Object.getOwnPropertyNames`/`Reflect.ownKeys`), and that a plain JS consumer cannot push/delete/reorder
    history this way. Verified via a temporary bypass (reverting to `private records`) — confirmed exactly the 3
    predicted tests failed, then reverted and re-confirmed all tests passing.

- id: UASF-REQ-0023
  title: Artifact foundation
  description: Minimal artifact classification/storage abstraction.
  source_baseline: "BASELINE-V1 section 123"
  category: P0
  priority: LOW
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/artifacts/artifact-registry.ts"
  test_refs:
    - "runtime/artifacts/__tests__/artifact-registry.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    In-memory registry with the section-123 artifact classes; no actual
    storage backend (filesystem/object store) yet.

    P1 fix (4th independent review round, targeted follow-up ownership
    audit): get()/allFor()/findByClass() returned the internal
    ArtifactRecord objects directly. Mutating a returned record's `path`
    or `checksum` after the fact would silently swap what evidence a proof
    reference actually points to, without a new register() event —
    directly undermining "no claim without evidence" (bölüm 303: the
    record backing a claim must be exactly what was registered). Fixed:
    every read now returns a frozen, detached snapshot
    (runtime/util/immutable.ts). Regression tests prove mutating the
    return value of register()/get()/allFor()/findByClass() throws and
    never changes the recorded evidence. Confirmed via git-stash that
    these tests fail on the pre-fix code.

    P1 targeted-audit fix (26th independent review round, same root class as finding 2, "cost ledger state must
    be runtime-private"): the internal `artifacts` Map still used TypeScript's compile-time-only `private`
    keyword, reachable at runtime via `(registry as any).artifacts`. This let a consumer inject a fabricated
    evidence record that never went through `register()`'s duplicate-id check, or silently swap an EXISTING
    record's `path`/`checksum` — directly defeating "no claim without evidence" (bölüm 303). Converted to a
    genuine ECMAScript `#artifacts` private field. Three new regression tests prove the field is unreachable via
    property access or any reflection API, and that a plain JS consumer cannot inject/swap evidence this way.
    Verified via a temporary bypass (reverting to `private artifacts`) — confirmed exactly the 3 predicted tests
    failed, then reverted and re-confirmed all tests passing.

- id: UASF-REQ-0024
  title: Model gateway
  description: Provider-abstraction interface so core tests never require paid APIs.
  source_baseline: "BASELINE-V1 section 59"
  category: P0
  priority: CRITICAL
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/models/gateway.ts"
  test_refs:
    - "runtime/models/__tests__/gateway.test.ts"
  proof_refs:
    - "proofs/cheapest-capable-model"
  security_refs: []
  notes: >
    P1 fix (10th independent review round, "public ModelGateway.invoke()
    bypasses enforcement"): Codex reproduced a direct `gateway.invoke()`
    call reaching a provider with NO PolicyEngine, approval enforcement,
    BudgetGuard, reservation, or cost accounting at all — router.ts's own
    guard (UASF-REQ-0027's fix) could always be bypassed by any OTHER
    caller with a reference to the same gateway, and the e2e-p0-kernel
    proof (proofs/e2e-p0-kernel/proof.test.ts) was a live, uncontested
    example of exactly this. This is a genuinely different, more severe
    class than "one caller forgot to check policy" — it means NO amount
    of fixing router.ts alone can ever establish "every real invocation is
    authorized" as a system-wide invariant, since gateway.invoke() itself
    was the actual boundary that needed to enforce it. Fixed by moving the
    ENTIRE guard into ModelGateway.invoke() itself (Option A+B+C from the
    review: raw invocation made structurally private AND an authoritative
    context made non-optional AND one centralized boundary used by every
    caller) — `invoke(model, request, context: ModelInvocationContext)`
    requires `context.policy`/`context.budget` (no optional flag exists to
    skip them; this is a compile error, not a runtime toggle), evaluates
    the SAME CapabilityGateway/PolicyEngine used everywhere else in the
    Factory, reserves the projected cost via BudgetGuard.reserve() BEFORE
    ever touching a provider, invokes the provider only after a successful
    reservation, then commits the actual cost (or releases the reservation
    on provider failure — bkz. UASF-REQ-0030). The raw provider call moved
    to a genuine ECMAScript private method (`#rawInvoke`, using `#`, not
    TypeScript's `private` keyword which is compile-time-only and still a
    real, callable property in the emitted JS) — this is enforced by the
    JavaScript runtime itself, not a naming convention a determined caller
    (or `as any`) could talk its way past. Regression tests
    (gateway.test.ts) prove: DENY blocks invocation with zero provider
    calls, the PolicyEngine's own risk-5 APPROVAL_REQUIRED floor blocks
    invocation with zero provider calls, insufficient budget blocks
    invocation with zero provider calls, the reservation happens before
    the provider ever resolves, a successful invocation is accounted for
    exactly once, a later validation failure (which lives in router.ts,
    downstream of this commit) cannot erase the already-recorded cost, a
    failing provider call releases its reservation rather than recording a
    phantom cost, fallback/escalation candidates go through this exact
    same boundary (no parallel "fast path"), and omitting policy/budget is
    a compile-time error by construction (no runtime branch to test).
    Verified via a temporary in-place bypass (an early `return
    this.#rawInvoke(...)` before the guard, keeping the real signature) —
    confirmed exactly 7 of the 12 gateway tests fail against the bypassed
    code (the ones exercising DENY/approval/budget/reservation/commit/
    release/concurrency), then reverted. proofs/e2e-p0-kernel/proof.test.ts
    was updated to use this same guarded call instead of its previous
    direct gateway.invoke() + manual budget.spend().

    P1 fix (11th independent review round, "supplied capability gateway
    can bypass authoritative policy"): Codex reproduced `invoke()` PREFERRING
    a caller-supplied `context.capabilityGateway` over `context.policy` —
    `capabilityGateway ?? new CapabilityGateway(context.policy)` meant a
    caller could supply an authoritative, default-DENY `policy` while ALSO
    supplying a separate `capabilityGateway` backed by an ALLOW-everything
    policy; `authorize()` used the latter, `context.policy` never ran
    `evaluate()`, and zero audit events were produced. This is the SAME
    "atlanabilir bir tasarım" class the original 10th-round fix set out to
    close — an optional field IS the bypass. Fixed by DELETING the field:
    `ModelInvocationContext` no longer has a `capabilityGateway` property
    at all (previously a "reuse the same instance across escalation
    candidates" optimization with zero behavioral upside, since
    `CapabilityGateway` is a two-line stateless wrapper); `invoke()` now
    UNCONDITIONALLY builds `new CapabilityGateway(context.policy)` on
    every call — there is no code path, type-safe or otherwise, that reads
    anything else. Regression tests prove: a default-DENY policy cannot be
    bypassed (including via a `capabilityGateway` property smuggled onto
    the context object with `as any` — the runtime code simply never
    reads it, proving this is a genuine deletion of the vulnerable read,
    not a type-level restriction alone), authoritative policy audit events
    are always recorded, the happy path (matching, correctly-authorized
    policy) is unaffected, Risk-5 approval semantics remain enforced, and
    fallback/escalation execution uses the identical authoritative policy
    path. Verified via a temporary bypass (reintroducing
    `(context as unknown as {capabilityGateway?}).capabilityGateway ??
    new CapabilityGateway(context.policy)`) — the malicious-context test
    times out waiting for a rejection that the vulnerable code never
    produces (the ALLOW-backed gateway lets the provider call proceed
    instead), then reverted. A narrow audit confirmed no other production
    call site (`runtime/project-lifecycle/orchestrator.ts`, the only other
    `CapabilityGateway` construction site) accepts an injectable
    alternative — orchestrator.ts always builds it directly from its own
    `policy` field with no substitutable field in `BootstrapProjectInput`.

    P1 fix (11th independent review round, "caller context mutation can
    change cost ownership during invocation"): Codex reproduced
    reserving cost for project A, then mutating `context.projectId` to B
    WHILE the (real, awaited) provider call was still pending — because
    `taskId`/`projectId` were read from `context` separately at reserve()
    time AND again at commit() time (after the `await`), the mutation
    landed cost under B despite A owning the reservation, letting a
    caller silently bypass A's own budget ceiling via repeated calls.
    Fixed: `invoke()` now captures EVERY ownership-relevant field
    (taskId, projectId, risk, description, model identity) into a single
    frozen `executionScope` snapshot (`freezeRecord`) as the FIRST thing
    it does — before `CapabilityGateway.authorize()` is even constructed,
    let alone awaited — and captures the `policy`/`budget` object
    REFERENCES into local `const`s at the same time. Nothing after that
    point ever reads `context.xxx` again; reservation, the provider call,
    and reconciliation all use ONLY the snapshot. Because JS guarantees an
    async function's synchronous prefix runs to completion before any
    microtask (including one a caller schedules) can interleave, this
    holds regardless of when or how the caller mutates or replaces its
    `context` object afterward — even swapping the ENTIRE `policy`/
    `budget` object references mid-flight has zero effect on the
    already-running invocation. Regression tests prove: the exact
    project-A/project-B reproduction now keeps accounting entirely under
    A, mutating `taskId` mid-invocation doesn't move the reservation,
    swapping the `policy`/`budget` REFERENCES mid-invocation has no
    effect, two invocations sharing (and mutating) the SAME context
    object cannot cross-contaminate each other's execution scope, and
    policy/audit/budget/cost all reference one consistent scope for a
    single call. Verified via a temporary bypass (reverting the commit()
    call to read `context.taskId`/`context.projectId` directly instead of
    `executionScope`'s) — confirmed exactly the 3 tests exercising this
    property fail, then reverted. A narrow audit found ONE further
    genuine instance of the same class in
    `runtime/project-lifecycle/orchestrator.ts`'s `bootstrapProject()`
    (see UASF-REQ-0042's notes) and fixed it the same way.

    P1 fix (12th independent review round, "model identity snapshot is
    not used during provider execution"): Codex reproduced `invoke()`'s
    11th-round `executionScope` snapshot protecting ACCOUNTING fields
    (taskId/projectId/modelId/provider/costPerCallUsd, all read from
    `model` at snapshot time) while the ACTUAL provider dispatch
    (`this.#rawInvoke(model, request)`) still received the caller's raw,
    still-mutable `model` object — a caller mutating `model.modelId` or
    `model.provider` WHILE the provider call was pending caused the real
    provider to receive a different model identity than the one every
    accounting/audit/reconciliation record referenced. Fixed: `invoke()`
    now captures `const authorizedModel: ModelRecord =
    freezeRecord({...model})` as the FIRST statement in the function
    (before `executionScope` is even built), `executionScope` derives its
    fields from `authorizedModel` (not `model`), and `#rawInvoke()` is
    called with `authorizedModel` — `model` (the original parameter) is
    never read again after that first line. Regression tests
    (gateway.test.ts, new describe block) prove: mutating `model.modelId`
    while the (real, awaited, `ControllableProvider`-based) provider call
    is pending has zero effect on what the provider receives or what
    accounting/audit records, the same for `model.provider` and for
    `model.tier`/`costPerCall`, validation/audit reference the identity
    that was authorized (not any later mutation), and two concurrent
    invocations sharing (and mutating) the same `model` object cannot
    cross-contaminate each other's provider-received identity. Verified
    via a temporary bypass (`this.#rawInvoke(model, request)` instead of
    `authorizedModel`) — confirmed exactly 4 of the 5 new tests fail (the
    exact-reproduction modelId test, the provider-id test, the tier/cost
    metadata test, and the concurrent-reuse test; the validation/audit
    identity-reference test happened to still pass under this specific
    bypass since it only inspects the policy audit description string,
    not the provider's received identity), then reverted.

    P1 fix (13th independent review round, "provider/model identity can
    still change accounting and audit evidence"): the 12th round's fix
    closed the gap for the PROVIDER CALL itself (`#rawInvoke` receives
    `authorizedModel`), but `commit()` was still called with
    `provider: response.provider, modelId: response.modelId` — the
    IDENTITY FIELDS of the raw response an EXTERNAL `ModelProvider.invoke()`
    implementation returns, not the identity that was ever authorized.
    Since a provider adapter is untrusted from this class's point of view,
    a misbehaving/compromised one could return any `modelId`/`provider` it
    likes, silently redefining accounting/audit/reconciliation ownership
    via its OWN return value even with the 12th round's model-mutation gap
    fully closed. Required invariant: authorize ONE identity -> invoke
    that identity -> account/reconcile/audit that SAME identity — no
    response object may redefine it. Fixed: `commit()` is now called with
    `provider: authorizedModel.provider, modelId: authorizedModel.modelId`
    — the pre-authorized snapshot — never `response.provider`/
    `response.modelId`; `response.costUsd` (a legitimate actual-amount
    value, not an identity field) is still used for the dollar amount.
    `authorizedModel.provider`/`.modelId` are also now passed to
    `budget.reserve()` (see UASF-REQ-0030's notes on `ReservationOwnership`)
    so `commit()`'s OWN ownership-mismatch check independently re-verifies
    this at the reservation layer too — defense in depth, not reliance on
    this call site alone. Regression tests (gateway.test.ts, new describe
    block, using a `ControllableProvider.forgedResponseIdentity` option
    that simulates a provider whose response claims a different
    modelId/provider than the one it was actually invoked with) prove: a
    forged response modelId does not redefine the durable accounting
    record, a forged response provider likewise does not, reconciliation
    never raises a spurious `ReservationOwnershipMismatchError` from a
    forged response (since both `reserve()` and `commit()` derive identity
    from the SAME authorized snapshot), audit/policy evidence references
    the authorized identity regardless of the forged response, and
    concurrent invocations against a provider forging the SAME response
    identity for both still keep their own distinct authorized identities
    in accounting. Verified via a temporary bypass (reverting both the
    `reserve()` and `commit()` calls to omit/re-read
    `response.provider`/`response.modelId`) — confirmed exactly 4 of the 5
    new tests fail (the audit-description test stays green under this
    specific bypass, for the same reason as the 12th round's equivalent
    test), then reverted.

    P1 fix (13th independent review round, "invocation payload remains
    caller-mutable during execution"): `request` (prompt/taskType) was
    passed DIRECTLY into `#rawInvoke(model, request)` with no snapshot of
    its own — the SAME class of bug the 12th round fixed for `model`, just
    for the invocation payload instead of the model identity. A caller
    mutating `request.prompt`/`.taskType` WHILE the provider call was
    pending (and a provider that reads its `request` reference LAZILY,
    e.g. after its own internal work, rather than copying it immediately)
    could execute a replacement payload under the authorization/budget
    already reserved for the ORIGINAL prompt. Fixed the same way as
    `model`: `request` is copied into a frozen, detached `authorizedRequest`
    in the SAME synchronous prefix as `authorizedModel`, before any await,
    and `authorizedRequest` (never the original `request` parameter) is
    what gets passed to `#rawInvoke()`. Regression tests (gateway.test.ts)
    use a `ControllableProvider` that reads `request`'s fields LAZILY (at
    `resolveAll()` time, not at `invoke()`-call time — a synchronous copy
    at call time cannot observe this race at all, since JS guarantees the
    function's synchronous prefix, including any such copy, completes
    before a caller-scheduled mutation can run) and prove: mutating
    `request.prompt` while pending has zero effect on what the provider
    receives, the same for `request.taskType`, and concurrent reuse of one
    caller-owned request object across two invocations cannot
    cross-contaminate their payloads. Verified via a temporary bypass
    (`this.#rawInvoke(authorizedModel, request)` instead of
    `authorizedRequest`) — confirmed exactly 3 of 3 new tests fail, then
    reverted.

    P1 fix (25th independent review round, finding 6, "approval evidence must flow through model invocation
    path"): `ModelInvocationContext` had no field to carry approval evidence at all, so a risk-5 model
    invocation (which the policy engine's own built-in floor always evaluates to `APPROVAL_REQUIRED`) was
    unconditionally blocked — worse, `invoke()` constructed a BRAND NEW `CapabilityGateway(context.policy)` on
    every call, which (per `CapabilityGateway`'s new default, UASF-REQ-0019) came with its own throwaway,
    always-empty `ApprovalWorkflow`, so even a determined caller had no store to register a real approval into.
    Fixed: `ModelGateway` now owns its OWN authoritative `#approvals: ApprovalWorkflow` field, constructor-
    injected ONCE (mirroring `CapabilityGateway`'s own construction-time trust model) and passed as the second
    argument to the `CapabilityGateway` it builds on every `invoke()` call; `ModelInvocationContext` gained an
    optional `approvalId?: string` reference (never a workflow object) threaded into the authorize() call's
    `PolicyAction` (which now also carries `projectId` for complete-identity binding); `RoutingRequest` gained a
    matching `approvalId?: string`, captured into the same frozen `routingScope` snapshot as every other routing
    field and propagated into `ModelInvocationContext.approvalId` on every candidate invocation (initial and
    every escalation step) in `runtime/models/router.ts`. Five new regression tests in
    `models/__tests__/gateway.test.ts` prove: a risk-5 invocation with a valid, matching approval (registered via
    `ApprovalWorkflow.requestFor()` in the SAME store the gateway was constructed with) succeeds exactly once; a
    risk-5 invocation with no `approvalId` remains blocked exactly as before (no default bypass introduced);
    reusing the same approval id for a second invocation is rejected (an approval authorizes exactly one
    execution); an approval bound to a different action identity (mismatched cost) does not authorize the
    invocation; and an approval registered in a DIFFERENT `ModelGateway`'s own store is invisible to this
    gateway. Verified via a temporary bypass (reverting to a fresh, always-empty `ApprovalWorkflow` per call,
    exactly like the pre-fix code) — confirmed exactly the 2 predicted "success path" tests failed (the 3
    negative/blocked-case tests correctly stayed green, since they could never have succeeded either way), then
    reverted and re-confirmed all tests passing.

- id: UASF-REQ-0025
  title: Model registry
  description: Registry of provider/model records with capabilities, cost_class, tier, status.
  source_baseline: "BASELINE-V1 section 60, 61"
  category: P0
  priority: CRITICAL
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/models/registry.ts"
    - "schemas/model.schema.json"
  test_refs:
    - "runtime/models/__tests__/registry.test.ts"
    - "runtime/models/__tests__/model.schema.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    P1 fix (4th independent review round, targeted follow-up ownership
    audit): register() stored the caller's object reference directly, and
    all()/findCapable() returned the internal array UNCHANGED (no copy, no
    freeze at all — the most severe form of this bug found in the audit).
    A caller holding a reference to a registered (or returned) model
    record could mutate `costPerCall` downward to bias cheapest-capable
    routing, flip `status` from DEPRECATED/RETIRED to ACTIVE to bypass the
    "never auto-selected" rule, or add a `capabilities` entry the model
    doesn't actually support (bölüm 60-64, cost/routing integrity). Fixed:
    register() now stores an independent, frozen copy; all()/findCapable()
    return frozen, detached snapshots. Regression tests prove mutating the
    object passed into register() (or a returned record's costPerCall/
    capabilities) cannot affect subsequent routing decisions. Confirmed
    via git-stash that these tests fail on the pre-fix code.

    P2 fix (7th independent review round, "invalid model prices corrupt
    cheapest-capable routing"): register() never validated `costPerCall` at
    all — Codex reproduced a premium candidate registered FIRST with
    `costPerCall: NaN` being SELECTED over a genuinely cheaper, capable free
    candidate, because `NaN < x`/`x < NaN` comparisons are always false,
    breaking router.ts's cheapest-of reduce in a way that favors the
    first-registered candidate regardless of actual cost. Fixed: register()
    now calls the EXISTING centralized validator
    (assertValidMonetaryAmount, runtime/cost/cost-engine.ts — not a
    divergent rule) on `costPerCall` before the record ever reaches
    `this.models`; a rejected registration leaves the registry completely
    unmutated. Regression tests prove: NaN/+Infinity/-Infinity/negative
    costPerCall are all rejected before insertion, zero remains valid (free
    models), an ordinary positive price is unaffected, a rejected
    registration does not corrupt findCapable() for previously-registered
    valid models, the exact NaN-beats-free reproduction can no longer
    happen (the poisoned record never enters the registry at all),
    createDefaultModelRegistry()'s built-in models all carry valid prices,
    and the error message identifies the offending model. Confirmed via
    git-stash that 7 of these tests fail against the pre-fix code.

    P2 targeted-audit fix (9th independent review round, found while
    auditing for the same class as workers/registry.ts's "duplicate
    worker identities break authoritative status"): register() never
    checked for a `modelId` collision — a second register() call with the
    SAME id (e.g. attempting to "deprecate via re-registration") left the
    original ACTIVE record in the array alongside the new one; findCapable()
    only filters by status, so the stale ACTIVE record remained routable.
    Fixed with the identical pattern: register() now rejects an id
    collision (new DuplicateModelIdError) before any mutation, and a new
    updateStatus() method is the only way to transition an existing
    model's status — it mutates the authoritative record's array slot in
    place rather than ever creating a second record. Regression tests
    prove: first registration succeeds, a duplicate id is rejected, no
    stale ACTIVE record survives a rejected duplicate "deprecation"
    attempt, updateStatus() correctly transitions status, a deprecated
    model is never returned by findCapable(), updateStatus() on an
    unregistered id fails closed, and a model can return to a usable
    state only through updateStatus() with exactly one record throughout.
    Confirmed via git-stash that 5 of these tests fail against the
    pre-fix code.

    Test-coverage gap closed (10th independent review round follow-up,
    same "ownership boundaries" requirement raised for
    workers/registry.ts's updateStatus()): the previous round's tests for
    updateStatus() checked the *authoritative* record's state but never
    checked that the *returned* record from updateStatus() itself is a
    frozen, detached snapshot (as opposed to all()/findCapable(), which
    were already covered). The underlying implementation
    (`freezeRecord(updated)` in updateStatus()) was already correct — this
    was a missing test, not a missing fix. Added a regression test
    asserting the returned record throws TypeError on mutation attempts,
    that such attempts never reach the authoritative record, and that the
    returned reference is never the same object as `all()`'s. Verified
    meaningful via a temporary in-place bypass (returning the pre-freeze
    object instead of `freezeRecord(updated)`) — confirmed exactly this 1
    test fails against the bypassed code, then the bypass was reverted.

    P2 fix (23rd independent review round, "align model JSON schema with
    runtime model record contract"): `schemas/model.schema.json` and the
    runtime `ModelRecord` contract genuinely disagreed — the schema
    required a `costClass` field the runtime `ModelRecord` interface never
    had and no runtime code ever reads or writes, while making
    `costPerCall` (the field cheapest-capable-model routing and cost
    accounting ACTUALLY depend on) merely optional. This meant every real
    runtime `ModelRecord` (including `createDefaultModelRegistry()`'s own
    records) failed schema validation, and a schema-valid EXTERNAL record
    could legally omit the pricing routing/accounting require. Fixed by
    reconciling deliberately, not loosening both sides: `costPerCall` is
    now required (matching what the runtime always populates and
    consumes) and `costClass` is now optional (matching that nothing in
    the runtime contract ever reads or writes it; retained, documented as
    purely advisory, for any external tooling that wants it). Six new
    regression tests (using the same `ajv` dependency already used by
    `scripts/validate-requirements.mjs`) prove: every default registry
    record now passes schema validation; a schema-valid record with
    `costPerCall` can be `register()`ed without throwing; a record missing
    `costPerCall` is correctly rejected; a record still carrying the old
    `costClass` field validates (no regression for existing external
    data); the OLD-style shape (`costClass`, no `costPerCall`) is now
    correctly rejected, proving the fix and not merely a description
    change; and a real `ModelRecord`, JSON-serialized and re-parsed, still
    validates and round-trips through `register()`. Verified via a
    temporary bypass (reverting `required` to its old `costClass`-based
    array) — 5 of the 6 new tests genuinely failed, then fully reverted.

    P1 fix (25th independent review round targeted audit, same root class as `audit/audit-log.ts`'s "audit
    records must be runtime-private and append-only" — UASF-REQ-0022): the internal `models` array used
    TypeScript's compile-time-only `private` keyword, reachable at runtime via `(registry as any).models` or
    plain bracket access, letting a consumer push a fabricated record directly (bypassing `register()`'s
    duplicate-id and monetary-amount validation) or flip a DEPRECATED/RETIRED model's `status` back to ACTIVE in
    place (bypassing `updateStatus()` and baseline section 60-64's cost/routing-integrity invariants). Converted
    to a genuine ECMAScript `#models` private field. Three new regression tests prove the field is unreachable
    via property access or any reflection API, and that a plain JS consumer cannot revive a DEPRECATED model
    this way. Verified via a temporary bypass (reverting to `private models`) — confirmed exactly the 3
    predicted tests failed, then reverted and re-confirmed all tests passing.

