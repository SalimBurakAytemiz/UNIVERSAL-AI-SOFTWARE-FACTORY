- id: UASF-REQ-0014
  title: Technology registry (foundation)
  description: Track languages/frameworks/engines with EXPERIMENTAL..FORBIDDEN lifecycle.
  source_baseline: "BASELINE-V1 section 53, 54"
  category: P0
  priority: LOW
  status: UNIT_TESTED
  implementation_refs:
    - "runtime/technology-registry/registry.ts"
  test_refs:
    - "runtime/technology-registry/__tests__/registry.test.ts"
  proof_refs: []
  security_refs: []
  notes: >
    FORBIDDEN/DEPRECATED technologies are excluded from recommendable() at
    the data-model level; no seeded default registry or Technology
    Decision Engine yet.

    P1 fix (4th independent review round, targeted follow-up ownership
    audit): register() stored the caller's object reference and all()
    returned internal Map values directly — a caller could mutate a
    registered (or returned) technology's `lifecycle` field from
    FORBIDDEN/DEPRECATED to something recommendable, bypassing bölüm
    53-54's "never auto-recommended" rule without going through any
    controlled transition. Fixed: register() stores an independent, frozen
    copy; all() returns frozen, detached snapshots. Regression tests prove
    mutating the object passed into register(), or a record returned by
    all(), cannot un-forbid a technology. Confirmed via git-stash that
    these tests fail on the pre-fix code.

