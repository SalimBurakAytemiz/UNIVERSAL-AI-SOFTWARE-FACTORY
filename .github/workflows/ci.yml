name: CI

# Baseline section 287 (CI/CD): format/lint/typecheck/unit tests, schema
# validation, secret scanning, and baseline drift checks. Because this
# repository is PUBLIC, secret-scanning and public-information-leakage
# checks are treated as first-class, not optional (section 2, 307).
#
# Note on supply-chain hardening (section 121, 287 "prefer immutable
# GitHub Actions commit SHAs where practical"): this workflow currently
# pins actions by version tag (e.g. @v4), not by commit SHA, since SHA
# pinning was not verified against the live marketplace during this
# session. Moving to SHA-pinned actions is tracked as follow-up work.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so secret-scan can eventually inspect git log too

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests + proofs
        run: npm test

      - name: Validate requirement registry schema
        run: npm run validate:requirements

      - name: Smoke-test CLI
        run: |
          node dist/runtime/cli/index.js doctor
          node dist/runtime/cli/index.js baseline status
          node dist/runtime/cli/index.js routing explain

  public-repository-security:
    name: Public repository secret hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run secret scan (custom deterministic patterns, baseline section 2)
        run: npm run secret-scan

      - name: Run secret-scan unit tests
        run: npx vitest run tests/secret-scan.test.mjs
