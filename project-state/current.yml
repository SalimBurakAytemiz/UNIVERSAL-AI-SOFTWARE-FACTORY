      - runtime/artifacts/artifact-registry.ts: get()/allFor()/
        findByClass() returned live internal objects — a leaked reference
        could swap a registered artifact's path/checksum after the fact,
        undermining "no claim without evidence" (bölüm 303).
      Reviewed but NOT changed (no genuine leak of this class found):
      runtime/models/providers/mock-provider.ts (stores options by
