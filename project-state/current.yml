  - |-
    THIS SESSION (round 3) — a third independent Codex review found 3 NEW P1
    findings, all instances of the same vulnerability class (internal
    mutable state returned directly to a caller, letting the caller corrupt
    Factory state without going through any policy/validation), plus asked
    for a cross-cutting audit for the same class elsewhere. All 3 named
    findings are fixed:
    - [P1] CostEngine.record()/all() returned the actual internal
      CostEntry object/array. A caller could mutate a returned entry's
      amountUsd to NaN/negative/Infinity AFTER a valid spend was recorded,
      poisoning total()/totalFor()/totalInWindow() retroactively and
      bypassing the round-2 monetary validation entirely (which only
      guards the WRITE path, not a later mutation of an already-returned
      reference). Fixed: added runtime/util/immutable.ts (freezeRecord/
      freezeRecords: shallow-copies an object, freezes its array-typed
      fields, then freezes the whole thing) and record()/all() now return
      frozen, detached snapshots — the internal entries array is never
      exposed. Regression tests prove mutating a returned record throws
      and never affects subsequent totals; confirmed via git-stash that
      these tests fail on the pre-fix code (7/7 new tests failed).
    - [P1] Project bootstrap allowed a filesystem path escape:
      `project.id = "../outside"` passed genome schema validation (which
      only required a non-empty string) and reached scaffoldProjectOs(),
      writing OUTSIDE baseDir on the real filesystem. Confirmed via
      git-stash: the pre-fix code genuinely created /tmp/outside and
      /tmp/escape-attempt during the reproduction. Fixed with two
      independent layers: (1) a new assertValidProjectId()
      (runtime/sandbox/sandbox.ts) allowing only
      `[a-zA-Z0-9][a-zA-Z0-9_-]*`, called from parseProjectGenome()
      immediately after schema validation; (2) scaffoldProjectOs() itself
      now resolves the destination via assertWithinRoot() (trusted path
      API) and verifies containment inside baseDir before any mkdirSync,
      and orchestrator.ts performs the same confinement check right after
      genome validation, before the Capability Gateway/policy check
      (PROJECT ID -> VALIDATE -> RESOLVE BASE -> RESOLVE DESTINATION ->
      VERIFY INSIDE BASE -> POLICY CHECK -> FILESYSTEM MUTATION).
      Regression tests cover a normal id, "../outside", "../../outside",
      an absolute path, slash/backslash variants, a sibling directory
      left untouched, and scaffoldProjectOs() itself refusing to escape
      when called directly.
    - [P1] ApprovalWorkflow.request()/get() returned the actual internal
      (mutable) ApprovalRequest object — Codex reproduced
      `r.status = "APPROVED"; execute(id)` succeeding without any
      approve() call, defeating the "Risk-5 can never reach EXECUTED
      without genuine Human Founder approval" invariant (section 120).
      Fixed: internal state is now a private MutableApprovalRequest map;
      every public method returns a frozen, detached snapshot; execute()
      always checks the private authoritative record. Also added a
      required non-empty approver-identity check
      (InvalidApprovalDecisionError), an optional evidenceRef parameter
      (approval evidence, section 145), and AuditLog integration recording
      every REQUESTED/APPROVED/REJECTED/EXECUTED transition. Regression
      tests prove mutating any returned value cannot approve, reset, or
      re-open an approval, and that empty-approver attempts are rejected
      without mutating state; confirmed via git-stash (6/6 relevant new
      tests failed on pre-fix code).
    - Cross-cutting audit (as explicitly requested): grepped every
      `return this.<map-or-array>...` across runtime/ for the same
      "returns internal state with a controlled-transition method it can
      bypass" shape. Found and fixed 5 more genuine instances, each with
      its own regression tests confirmed (via git-stash) to fail on the
      pre-fix code:
      - runtime/audit/audit-log.ts: all() returned the internal `records`
        array itself — a caller could push() a forged record (never
        entering the hash chain) or splice() to silently drop the most
        recent record, neither of which verifyIntegrity() could ever
        detect (it only walks whatever the array currently holds). This
        directly undermined the "append-only, tamper-evident" guarantee
        the module exists to provide. Fixed: append()/all() now return
        frozen, detached copies.
      - runtime/decisions/decision-ledger.ts: get()/allFor() returned the
        internal FounderDecision object, letting a caller set
        `.status = "SUPERSEDED"` directly and bypass supersede()'s
        "never delete, only supersede" invariant. Fixed the same way.
      - runtime/service-catalog/service-catalog.ts: get()/all() returned
        the internal ServiceRecord, letting a caller bypass
        updateStatus(). Fixed the same way; register() also now stores an
        independent copy instead of the caller's own object reference.
      - runtime/assumptions/assumption-register.ts: get()/allWithStatus()
        returned the internal Assumption, letting a caller set
        `.status = "ACCEPTED"` on a HIGH-impact assumption and bypass
        accept()'s Founder-confirmation gate entirely. Fixed the same
        way.
      - runtime/workers/registry.ts: all()/findCapable() returned the
        internal WorkerRecord (and its live `capabilities` array),
        letting a caller un-quarantine a worker (bypassing the
        "QUARANTINED workers never selected" invariant, section 85) or
        forge a capability it doesn't have. Fixed the same way;
        register() also now stores an independent copy.
      Reviewed but NOT changed (no controlled-transition method exists to
      bypass, and no security-relevant field is exposed as mutable):
      business-capability-registry.ts, technology-registry.ts,
      artifact-registry.ts, models/registry.ts (all fields already
      `readonly` in shape, no `status`-style mutation method to route
      around), and project-isolation/isolation.ts (its cross-project
      DEFAULT-DENY check happens on the callerProjectId/targetProjectId
      comparison, not on the returned value's mutability; a caller
      mutating their own already-authorized data does not cross the
      isolation boundary). This scoping decision is recorded here so a
      future session does not re-litigate it without new evidence.
  - >-
    Requirement registry updated a third time from this round's real
