completed_milestones:
  - Existing public repository audited; Baseline V1 specification preserved
    verbatim; annotated tag architecture-baseline-v1 pushed by the Founder
    and verified against commit 8641c70.
  - Baseline Requirement Registry (42 requirements), P0 Factory Kernel core,
    foundation modules (Project OS, Genome, Discovery, Decision Ledger,
    Assumption Register, Technology/Business-Capability registries,
    Organization Composer, Capability Gateway, Sandbox, Project Isolation,
    Requirements Traceability, Artifact registry, Service catalog), and an
    integrated bootstrap pipeline (Genome -> Organization -> Project OS ->
    Policy -> Routing -> durable State) — see prior entries in this file's
    git history for full detail.
  - |-
    THIS SESSION — fixed 4 blocking findings from an independent Codex
    review of the branch against main:
    - [P1] Daily/monthly budget limits were defined but never enforced.
      Fixed: runtime/budget/budget.ts now checks dailyUsd/monthlyUsd as
      real UTC-calendar-period windows via a new
      runtime/cost/cost-engine.ts method (totalInWindow), scoped by
      projectId when given. CostEngine and BudgetGuard both take an
      injectable clock so tests can simulate day/month rollover without
      waiting on real time. Added: same-period blocking, exact-boundary
      test, rollover tests (day and month), per-project scoping, a
      synchronous-burst concurrency test, and AuditLog integration
      recording every allowed/blocked budget check as durable evidence.
    - [P1] Secret scanning only checked currently tracked files, not git
      history — a secret committed and later deleted would stay exposed
      in the public repo's history while UASF-REQ-0002 claimed
      PROOF_VERIFIED. Fixed: scripts/secret-scan.mjs gained
      scanGitHistory()/listHistoricalBlobs(), scanning every unique blob
      reachable from any ref (git rev-list --objects --all), deduped by
      content hash. Tested against a real temporary git repo: a secret
      committed then `git rm`-deleted is still found; redaction verified
      (finding objects never carry the actual secret value); one
      pre-existing historical finding from before the `secret-scan:allow`
      marker existed (commit 981f0a4) is resolved via a minimal, exact
      (blob sha + line + pattern) baseline rather than rewriting public
      git history.
    - [P1] Model escalation (runtime/models/router.ts routeAndExecute) was
      computed from the risk-derived minimum tier (requiredTier) instead
      of the tier of the model actually selected. When a capability
      requirement forced a pricier model than the risk floor demanded,
      "escalation" could re-select the same model. Fixed: escalation now
      starts from initialDecision.model.tier. Regression tests construct a
      registry where only STANDARD/PREMIUM support a capability at risk 0
      and assert escalation lands on PREMIUM, not a re-selected STANDARD;
      confirmed the new tests fail against the pre-fix code and pass
      against the fix (verified by temporarily reverting router.ts).
    - [P2] scripts/secret-scan.mjs wholesale-excluded
      tests/secret-scan.test.mjs (and itself) from scanning by file path,
      creating a blind spot for any real credential pasted anywhere else
      in that file. Fixed: ALLOWLIST_SUBSTRINGS is now empty; only the
      per-line `secret-scan:allow` marker can suppress a finding.
      Regression tests prove an unmarked, real-looking credential placed
      in either file's path is still detected.
  - >-
    Requirement registry updated only from this real evidence: UASF-REQ-0002
    (secret scan), UASF-REQ-0022 (audit log), UASF-REQ-0027/0028 (router),
    UASF-REQ-0029/0030 (cost/budget) all carry updated implementation_refs/
    test_refs/notes describing exactly what changed and why. No status was
    raised without a corresponding real test.
  - 164/164 tests passing (up from 142); lint/typecheck/build/validate-
    requirements/secret-scan (now history-aware) all clean;
    `factory trace requirement` reports zero issues.
  - |-
    THIS SESSION (round 2) — a second independent Codex review confirmed
    all 4 findings above were genuinely fixed, then found 4 NEW findings
    on the resulting branch. All 4 are now fixed:
    - [BLOCKER] Budget enforcement could be bypassed with NaN/Infinity/
      negative monetary values (both a projected spend amount and a
      configured ceiling). Fixed: added exported
      assertValidMonetaryAmount() (runtime/cost/cost-engine.ts) rejecting
      non-finite and negative amounts; CostEngine.record() now calls it
      before mutating state, protecting even direct record() calls that
      bypass BudgetGuard entirely. BudgetGuard.assertWithinBudget() now
      validates the projected amount first (fail closed, logs
      BUDGET_INVALID_AMOUNT_REJECTED to the audit trail, no state
      mutated) before any ceiling check, and the constructor validates
      all four limits (perTaskUsd/perRunUsd/dailyUsd/monthlyUsd) via a
      new assertValidLimit(), throwing InvalidBudgetLimitError for
      NaN/Infinity/-Infinity/negative ceilings. Regression tests added
      for NaN/Infinity/-Infinity/negative spend amounts and limits (all
      four ceiling kinds), a negative amount failing to manufacture
      headroom, enforcement continuing correctly after a rejected invalid
      spend, a direct CostEngine.record() bypass, an exact-boundary vs.
      just-over-boundary case, and an audit-log assertion for the
      rejection event.
    - [P2] The risk-5 "requires approval" upgrade could override an
      explicit DENY, because the built-in risk-5 rule ran first (highest
      priority) in runtime/policy-engine/policy-engine.ts and evaluate()
      stopped at the first matching rule. Fixed: the risk-5 upgrade is no
      longer a pre-seeded rule; evaluate() now runs all registered rules,
      tracks whether an explicit rule matched, and only applies the
      risk-5 upgrade when the result is not an explicit DENY (an
      unmatched default-deny remains eligible, preserving "unaddressed
      risk-5 still requires approval"). Regression tests prove: explicit
      DENY+risk-5 stays DENY, a MAX_SAFE_INTEGER-priority DENY+risk-5
      stays DENY, DENY beats a lower-priority ALLOW rule, an
      otherwise-ALLOWED risk-5 action still requires approval, a
      default-deny risk-5 action still requires approval, and risk-5
      never weakens an existing APPROVAL_REQUIRED back toward ALLOW.
      Confirmed via git-stash that these tests fail on the pre-fix code.
    - [P2] Fallback (escalated) model output in
      runtime/models/router.ts routeAndExecute bypassed validation
      entirely — the escalated response was invoked but never passed
      through the caller's validate() function, so an invalid response
      from a pricier model could be returned as if trusted. Fixed:
      routeAndExecute now validates every candidate, including every
      escalation step, in a bounded loop over the tier order; reaching
      the top tier (CRITICAL_REVIEW) and still failing validation now
      throws a new EscalationExhaustedError (fail closed) instead of
      returning unvalidated output. Regression tests added: primary
      fails/first escalation passes (validated in order), all tiers fail
      -> EscalationExhaustedError with every tier validated exactly once,
      an invalid PREMIUM fallback cannot be accepted merely for being
      pricier, and premium-fallback-off still blocks after exactly one
      validate call. Confirmed via git-stash that these tests fail on the
      pre-fix code.
    - [P2] UASF-REQ-0036 ("durable cache") was PROOF_VERIFIED against an
      in-memory-Map-only implementation (runtime/cache/cache.ts), which
      only proves same-process reuse, not restart durability. Fixed via
      genuine persistence (not a status downgrade): added
      runtime/cache/file-cache.ts (FileCache<T>), backed by the existing
      StateStore/FileStateStore infrastructure — every set() persists the
      full entry map to a JSON file; every get()/size() reads it back
      from disk. Added a restart-recovery proof
      (proofs/cache-reuse/proof.test.ts and
      runtime/cache/__tests__/file-cache.test.ts): a FileCache instance
      computes and persists a result inside a block scope and is
      discarded (no reference kept), then a SECOND, independently
      constructed FileCache+FileStateStore instance pointed at the same
      file path reuses the persisted result without recomputation —
      proving restart durability rather than same-instance reuse.
  - >-
    Requirement registry updated again from this round's real evidence:
    UASF-REQ-0018 (policy engine — DENY-always-wins), UASF-REQ-0027/0028
