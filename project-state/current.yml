completed_milestones:
  - Existing public repository audited; Baseline V1 specification preserved
    verbatim; annotated tag architecture-baseline-v1 pushed by the Founder
    and verified against commit 8641c70.
  - Baseline Requirement Registry (42 requirements), P0 Factory Kernel core,
    foundation modules (Project OS, Genome, Discovery, Decision Ledger,
    Assumption Register, Technology/Business-Capability registries,
    Organization Composer, Capability Gateway, Sandbox, Project Isolation,
    Requirements Traceability, Artifact registry, Service catalog), and an
    integrated bootstrap pipeline (Genome -> Organization -> Project OS ->
    Policy -> Routing -> durable State) — see prior entries in this file's
    git history for full detail.
  - THIS SESSION — fixed 4 blocking findings from an independent Codex
    review of the branch against main:
    - [P1] Daily/monthly budget limits were defined but never enforced.
      Fixed: runtime/budget/budget.ts now checks dailyUsd/monthlyUsd as
      real UTC-calendar-period windows via a new
      runtime/cost/cost-engine.ts method (totalInWindow), scoped by
      projectId when given. CostEngine and BudgetGuard both take an
      injectable clock so tests can simulate day/month rollover without
      waiting on real time. Added: same-period blocking, exact-boundary
      test, rollover tests (day and month), per-project scoping, a
      synchronous-burst concurrency test, and AuditLog integration
      recording every allowed/blocked budget check as durable evidence.
    - [P1] Secret scanning only checked currently tracked files, not git
      history — a secret committed and later deleted would stay exposed
      in the public repo's history while UASF-REQ-0002 claimed
      PROOF_VERIFIED. Fixed: scripts/secret-scan.mjs gained
      scanGitHistory()/listHistoricalBlobs(), scanning every unique blob
      reachable from any ref (git rev-list --objects --all), deduped by
      content hash. Tested against a real temporary git repo: a secret
      committed then `git rm`-deleted is still found; redaction verified
      (finding objects never carry the actual secret value); one
      pre-existing historical finding from before the `secret-scan:allow`
      marker existed (commit 981f0a4) is resolved via a minimal, exact
      (blob sha + line + pattern) baseline rather than rewriting public
      git history.
    - [P1] Model escalation (runtime/models/router.ts routeAndExecute) was
      computed from the risk-derived minimum tier (requiredTier) instead
      of the tier of the model actually selected. When a capability
      requirement forced a pricier model than the risk floor demanded,
      "escalation" could re-select the same model. Fixed: escalation now
      starts from initialDecision.model.tier. Regression tests construct a
      registry where only STANDARD/PREMIUM support a capability at risk 0
      and assert escalation lands on PREMIUM, not a re-selected STANDARD;
      confirmed the new tests fail against the pre-fix code and pass
      against the fix (verified by temporarily reverting router.ts).
    - [P2] scripts/secret-scan.mjs wholesale-excluded
      tests/secret-scan.test.mjs (and itself) from scanning by file path,
      creating a blind spot for any real credential pasted anywhere else
      in that file. Fixed: ALLOWLIST_SUBSTRINGS is now empty; only the
      per-line `secret-scan:allow` marker can suppress a finding.
      Regression tests prove an unmarked, real-looking credential placed
      in either file's path is still detected.
  - Requirement registry updated only from this real evidence: UASF-REQ-0002
    (secret scan), UASF-REQ-0022 (audit log), UASF-REQ-0027/0028 (router),
    UASF-REQ-0029/0030 (cost/budget) all carry updated implementation_refs/
    test_refs/notes describing exactly what changed and why. No status was
    raised without a corresponding real test.
  - 164/164 tests passing (up from 142); lint/typecheck/build/validate-
    requirements/secret-scan (now history-aware) all clean;
    `factory trace requirement` reports zero issues.

known_limitations:
  - Only ONE integrated pipeline exists (project bootstrap: Genome ->
    Organization -> Project OS -> Policy -> Routing -> State). Discovery
    engine, Decision Ledger, Assumption Register, Technology/Business-
    Capability registries, Sandbox, Artifact registry, Service catalog,
    Worker Scheduler are evidence-backed individually but not yet wired
    into that same pipeline.
  - Persistence is JSON-file-based (runtime/state/file-store.ts), not
    SQLite as baseline section 275 suggests as the initial candidate.
  - No real model provider adapters — only MockProvider (intentional at P0).
  - Budget daily/monthly windows are UTC-calendar-based (not configurable
    timezone or rolling-window); documented as a deliberate simplicity
    choice, not a hidden gap.
  - Git-history secret scanning requires a non-shallow clone (CI already
    uses fetch-depth: 0 in both jobs); a shallow clone would silently see
    less history — this is reported via the "unique historical blobs
    scanned" count in the scan output, not hidden, but there's no explicit
    assertion in CI that the clone is actually non-shallow.
  - No LICENSE file — LICENSE_DECISION_REQUIRED (baseline section 206).
  - CI pins GitHub Actions by version tag, not commit SHA. No automated
    dependency/SBOM/SCA scanning wired into CI yet.

