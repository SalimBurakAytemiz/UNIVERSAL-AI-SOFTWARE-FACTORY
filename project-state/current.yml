    P0 REOPENED (this session, round 21): a NEW independent Codex review
    found ONE real blocker after the twentieth round's CLEAN result,
    which means that CLEAN result is no longer authoritative and P0 is
    reopened until a fresh independent review confirms it clean again.
    The finding, entirely inside `runtime/cache/file-lock.ts`'s lock-
    acquisition/reclaim path: `tryReclaimStaleLock()` attempted to
    `rmSync()` an abandoned/dead-owner lock directory and, if that
    removal genuinely FAILED (a real filesystem error, not the
    already-tolerated ENOENT), swallowed the failure in a bare `catch`
    and still returned `true` (reclaim succeeded) rather than `false`.
    The caller, `acquireFileLock()`'s retry loop, treated any truthy
    reclaim result as license to `continue` the loop WITHOUT first
    checking whether the configured acquisition deadline had passed — so
    a persistent removal failure (e.g. a lock directory containing an
    entry the process cannot remove) caused the loop to `continue`
    around and around, re-detecting the same stale lock and re-attempting
    (and re-failing) the same doomed removal, forever, with the deadline
    check never reached. Codex reproduced this concretely: a configured
    `timeoutMs: 50` still required external process termination after
    roughly 2 seconds of hard spinning, instead of throwing
    `FileLockTimeoutError` at ~50ms as its own contract promises. This is
    a genuine fail-open/liveness bug — a caller's own bounded-wait
    contract could be silently defeated by nothing more than one
    unremovable file. Fixed this session with two coordinated changes,
    both required (neither alone is sufficient, confirmed by reproducing
    the bug with only one applied): (1) `tryReclaimStaleLock()` now
    returns `false` — never `true` — whenever the actual `rmSync()` call
    throws (its `force: true` option already silently tolerates ENOENT,
    so anything reaching the `catch` is a genuine, real failure:
    permission denial, a busy/non-empty directory the OS won't remove,
    etc.); (2) `acquireFileLock()`'s loop was restructured to eliminate
    its `continue` statement entirely — the `if (Date.now() >= deadline)
    throw` check is now the single, unconditional next step after every
    EEXIST-triggered contention attempt, run on every iteration
    regardless of whether staleness was detected, reclaim was attempted,
    or reclaim reported success or failure; the poll-interval sleep
    (backoff) is skipped only in the one case where reclamation is
    PROVEN to have genuinely succeeded (i.e., the real `rmSync()` call
    did not throw), so a genuinely successful reclaim can retry
    immediately while every other path — no staleness, stale-but-live-
    contention, or a failed reclaim — is deadline-checked and, if not yet
    expired, paced by `sleepSync(pollIntervalMs)` rather than busy-
    spinning. Three new regression tests were added to
    `runtime/cache/__tests__/file-cache.cross-process.test.ts` (16 tests
    total in that file now, up from 13), using a genuine real-filesystem
    mechanism to force a real, deterministic `rmSync()` failure even
    though this sandbox runs as root (root bypasses ordinary permission-
    bit tricks, but the Linux immutable file attribute, `chattr +i`, does
    not — confirmed empirically in this exact environment): (a) a
    fabricated dead-owner lock whose directory contains a `chattr +i`
    file proves acquisition still throws `FileLockTimeoutError` within
    its configured deadline (bounded tolerance, well under 2 seconds)
    instead of hanging, and the guarded write never lands; (b) the same
    scenario with a longer `pollIntervalMs` proves retries are paced by
    that interval rather than busy-spinning (measured attempt spacing
    approximates the configured interval, not near-zero); (c) once the
    immutable attribute is cleared (removal becomes possible again),
    normal reclamation and acquisition succeed on the very next attempt,
    proving the fix does not weaken genuine dead-owner recovery. All
    three tests are gated behind a defensive
    `immutableAttributeSupported()` probe (`it.skipIf`) so they skip
    gracefully rather than fail unpredictably on a filesystem where
    `chattr` isn't available. Both halves of the fix were verified via a
    temporary in-place bypass (reinstating BOTH the swallow-as-success
    return AND the old continue-before-deadline-check loop structure
    simultaneously — a partial, one-half-only bypass was tried first and
    did NOT reproduce the bug, confirming both halves of the original
    defect were necessary and that the fix correctly needed both
    counterpart changes) that reproduced the exact predicted symptom (the
    raw worker process, run outside any test harness, needed `SIGKILL`
    after a fixed external timeout to terminate — an unambiguous real
    hang, consistent with Codex's own description), then the bypass was
    fully reverted (confirmed via grep for the temp-marker) and all 16
    tests in that file re-confirmed passing across 3 repeated runs. A
    targeted audit, scoped explicitly and only to this same root class
    (continue/loop-restart before a deadline check, a swallowed
    filesystem error reported as success, a retry path that can busy-spin
    or bypass bounded-wait semantics) across every other `for (;;)`/
    `while (true)` loop in `runtime/` (`sandbox.ts`'s
    `canonicalizeNearestExisting()`, `router.ts`'s `routeAndExecute()`
    tier-escalation loop, `doctor.ts`'s `findNearestPackageJson()`/
    `findNearestPackageLock()`) found NO further genuine instance: none
    of those loops have any configured deadline/timeout concept, retry/
    backoff semantics, or a swallowed-error-treated-as-success pattern to
    begin with — they are simple, correctly-terminating upward directory-
    walks or tier-escalation loops bounded by a structural condition
    (reaching the filesystem root, or exhausting `TIER_ORDER`), not a
    time-based deadline, so this specific bug class does not apply to
    them. Per explicit instruction, this round does NOT merge, does NOT
    move to P1, and does NOT declare P0 complete — the twentieth round's
    CLEAN result and this session's own re-verification of it remain
    recorded above and in `p0_closure_record` as accurate history of what
