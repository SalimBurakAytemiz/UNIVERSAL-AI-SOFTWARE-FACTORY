  careless/malicious caller could evade.

  (2) "caller context mutation can change cost ownership during
  invocation" — `context.taskId`/`context.projectId` were read separately
  at `budget.reserve()` time and again at `budget.commit()` time (after
  the internal `await this.#rawInvoke(...)`) — mutating
  `context.projectId` from A to B while the provider call was pending
  moved the recorded cost to B despite A owning the reservation, letting
  repeated calls bypass A's own budget ceiling entirely. Fixed:
  `invoke()` now captures every ownership field (taskId, projectId, risk,
  description, model identity) into ONE frozen `executionScope` snapshot
  (`freezeRecord`) as the FIRST thing it does, and captures the
  `policy`/`budget` object references into local `const`s at the same
  time — nothing after that point ever reads `context.xxx` again. This
  holds regardless of scheduling, because JS guarantees an async
  function's synchronous prefix completes before any caller-scheduled
  microtask can interleave — proven with tests that schedule the mutation
  via `Promise.resolve().then()` BEFORE calling `invoke()`, the ordering
  most favorable to a caller actually winning such a race.

  (3) "failed reconciliation releases reservation before cost is safely
  recorded" — `BudgetGuard.commit()` deleted the reservation FIRST, then
  validated `entry.amountUsd` — a malformed (NaN/Infinity/negative)
  actual amount failed validation AFTER the reservation was already gone,
  silently restoring the protected budget capacity even though a real (or
  potentially real) provider call may already have incurred cost. Fixed
  by reversing the order: `assertValidMonetaryAmount()` and
  `costEngine.record()` now run WHILE the reservation is still open; it
  is deleted ONLY after both genuinely succeed. On failure the
  reservation is preserved (still counted via `reservedTotal()` against
  every ceiling), a new `BUDGET_RESERVATION_COMMIT_FAILED` audit event is
  recorded (never silent), and the error is re-thrown (fail closed) —
  retrying `commit()` with a corrected amount on the SAME reservation id
  is now safe by construction, since nothing was deleted to make it
  unsafe.

