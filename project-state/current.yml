    THIS SESSION (round 5) — a fifth independent Codex review confirmed all
    prior fixes (ownership, budget-limit, audit-payload, registry, policy,
    cache, approval, existing-directory symlink), then found 3 NEW blocking
    issues, each in a DIFFERENT bug class from the "mutable state" theme of
    rounds 3-4:
    - [BLOCKER] "Final-destination / dangling symlink escape": the round-4
      symlink-confinement fix (canonicalizeNearestExisting) used
      `existsSync()` to walk path ancestors — `existsSync()` FOLLOWS
      symlinks and returns false for a DANGLING one (target does not
      exist), so a dangling symlink was silently treated as "nothing here
      yet, safe to write through." But `fs.writeFileSync` on a dangling
      symlink FOLLOWS it and creates the file at the symlink's real
      (possibly outside-baseDir) target — no race required, fully
      reproducible. Separately, orchestrator.ts's three
      stateStore.write() calls (genome.json, organization.json,
      bootstrap.json) used plain `join()` with NO confinement check on the
      final file path at all, even though scaffoldProjectOs() confined the
      directories around them. Fixed: canonicalizeNearestExisting() now
      uses `lstatSync` (never follows symlinks) to detect an entry's mere
      presence at each level, then attempts `realpathSync`; if lstat finds
      something but realpath cannot resolve it (only possible for a
      dangling symlink), this now fails closed instead of being treated as
      absent. orchestrator.ts's three file writes are now each individually
