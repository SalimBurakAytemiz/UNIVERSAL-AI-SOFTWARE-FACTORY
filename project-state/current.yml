    - [P1] "Budget/limit ownership is still unsafe": BudgetGuard's
      constructor validated the caller's `limits` object but then stored
      that SAME object by reference (`this.limits = limits`) — a caller
      mutating their own limits object AFTER construction (e.g.
      `originalLimits.dailyUsd = -1`) directly corrupted the authoritative
      ceilings, since validation only ran once, at construction, before the
      mutation. Fixed: the constructor now validates, then copies the
      limits into a frozen internal object; the caller's reference is never
