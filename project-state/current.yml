known_limitations:
  - >-
    Only ONE integrated pipeline exists (project bootstrap: Genome ->
    Organization -> Project OS -> Policy -> Routing -> State). Discovery
    engine, Decision Ledger, Assumption Register, Technology/Business-
    Capability registries, Sandbox, Artifact registry, Service catalog,
    Worker Scheduler are evidence-backed individually but not yet wired
    into that same pipeline.
  - Persistence is JSON-file-based (runtime/state/file-store.ts), not
    SQLite as baseline section 275 suggests as the initial candidate.
  - No real model provider adapters — only MockProvider (intentional at P0).
  - Budget daily/monthly windows are UTC-calendar-based (not configurable
    timezone or rolling-window); documented as a deliberate simplicity
    choice, not a hidden gap.
  - >-
    Git-history secret scanning requires a non-shallow clone (CI already
    uses fetch-depth: 0 in both jobs); a shallow clone would silently see
    less history — this is reported via the "unique historical blobs
    scanned" count in the scan output, not hidden, but there's no explicit
    assertion in CI that the clone is actually non-shallow.
  - No LICENSE file — LICENSE_DECISION_REQUIRED (baseline section 206).
  - CI pins GitHub Actions by version tag, not commit SHA. No automated
    dependency/SBOM/SCA scanning wired into CI yet.
  - >-
    No agent-identity concept exists anywhere in the model-invocation/
    bootstrap execution path (ModelInvocationContext, RoutingRequest,
    BootstrapProjectInput all lack an agentId field, and none of
    gateway.invoke()/routeAndExecute()/bootstrapProject() ever supply
    one) — only the lower-level CostScope/CostEntry/BudgetGuard
    primitives support it. This means BudgetGuard.commit()'s agentId
    ownership check (added 13th independent review round) is currently a
    permanent no-op for every invocation reachable through the public
    model-invocation/bootstrap path; it only protects a caller that uses
    BudgetGuard's reserve()/commit() API directly with an explicit
    agentId. Found during that round's targeted audit and deliberately
    NOT fixed (per that review's own instruction not to expand into
    unrelated architecture work) — introducing agent-scoped model
    invocation end-to-end is a feature addition, not a bug fix within
    existing plumbing.

