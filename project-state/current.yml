      captures the `policy`/`budget` object references into local
      `const`s at the same time — nothing after that point ever reads
      `context.xxx` again. This holds regardless of scheduling, because
      JS guarantees an async function's synchronous prefix completes
      before any caller-scheduled microtask can interleave.
