    THIS SESSION (round 5) — a fifth independent Codex review confirmed all
    prior fixes (ownership, budget-limit, audit-payload, registry, policy,
    cache, approval, existing-directory symlink), then found 3 NEW blocking
    issues, each in a DIFFERENT bug class from the "mutable state" theme of
    rounds 3-4:
    - [BLOCKER] "Final-destination / dangling symlink escape": the round-4
      symlink-confinement fix (canonicalizeNearestExisting) used
      `existsSync()` to walk path ancestors — `existsSync()` FOLLOWS
      symlinks and returns false for a DANGLING one (target does not
      exist), so a dangling symlink was silently treated as "nothing here
      yet, safe to write through." But `fs.writeFileSync` on a dangling
      symlink FOLLOWS it and creates the file at the symlink's real
      (possibly outside-baseDir) target — no race required, fully
      reproducible. Separately, orchestrator.ts's three
      stateStore.write() calls (genome.json, organization.json,
      bootstrap.json) used plain `join()` with NO confinement check on the
      final file path at all, even though scaffoldProjectOs() confined the
      directories around them. Fixed: canonicalizeNearestExisting() now
      uses `lstatSync` (never follows symlinks) to detect an entry's mere
      presence at each level, then attempts `realpathSync`; if lstat finds
      something but realpath cannot resolve it (only possible for a
      dangling symlink), this now fails closed instead of being treated as
      absent. orchestrator.ts's three file writes are now each individually
      confined via assertFilesystemConfinement() immediately before the
      write. Regression tests use real temporary directories and real
      (existing and dangling) symlinks: dangling symlink at the final
      destination blocked, dangling symlink as an intermediate/parent
      component blocked, existing final-FILE symlink blocked, dangling
      final-FILE symlink blocked (outside target confirmed never created),
      no partial state left on rejection, normal creation still works, and
      a full bootstrapProject() end-to-end test proves a dangling symlink
      planted at the exact state-file path (replacing a real file from a
      prior legitimate bootstrap) is rejected on a second, idempotent
      bootstrap rather than followed. Confirmed via git-stash that these
      tests fail against the pre-fix code — the pre-fix orchestrator.ts
      genuinely resolved (did not reject) the bootstrapProject() promise,
      meaning it silently followed the dangling symlink. Per Codex's
      explicit instruction, the documented TOCTOU residual-risk language
      was strengthened to state plainly that this fix closes the
      reproducible no-race escape only, and does NOT claim protection
      against a hostile, concurrently-racing filesystem writer.
    - [P1] "Per-task budgets mix projects": BudgetGuard's perTaskUsd check
      scoped only by `taskId` — two DIFFERENT projects reusing the same
      taskId (e.g. a shared "bootstrap" task template) shared a single
      ceiling: Project A spending its full $1 allowance caused Project B's
      own, separate, unused $1 allowance to be wrongly rejected. Fixed and
      explicitly documented in code: when `projectId` is present, the
      task-budget key is `projectId + taskId`; when absent, the ceiling
      remains intentionally global by `taskId` alone (a legitimate,
      already-supported project-agnostic use case that must not break).
      Regression tests prove independent per-project allowances for a
      shared taskId, no cross-project consumption, same-project+task
      sharing still works, project-less global semantics are preserved,
      daily/monthly/per-run budgets are unaffected, and invalid monetary
      inputs are still rejected. Confirmed via git-stash with the exact
      reproduction Codex described.
    - [P1] "Repeated supersession corrupts decision history": supersede()
      never checked that the decision being superseded was currently
      ACTIVE. `A -> B` then `A -> C` created a new C record (ACTIVE) and
      silently overwrote A's supersededBy from B to C, leaving BOTH B and
      C simultaneously ACTIVE — corrupting "exactly one current decision"
      history integrity. Fixed: supersede() now throws a new
      DecisionAlreadySupersededError (naming the actual current status and
      existing supersededBy) before any mutation or new record is created,
      unless the decision being superseded is ACTIVE; evolution must go
      through the current active decision (A -> B -> C), never branch
      (A -> B and A -> C). Regression tests prove A -> B works, a second
      A -> C is rejected, the A -> B link survives unchanged, B stays the
      sole ACTIVE decision, B -> C works, the resulting A -> B -> C chain
      has exactly one ACTIVE decision, the rejected attempt creates no
      partial record, and the error reports the real current state.
      Confirmed via git-stash (5 tests failed on pre-fix code).
    - Targeted audit (as explicitly requested, narrow — only these 3
      classes): reviewed service-catalog.ts's updateStatus() (open-ended
      health toggling, no terminal/ordering invariant — not applicable),
      workers/registry.ts (no status-update method exists at all — not
      applicable), assumption-register.ts's accept()/reject()/validate()
      (no current-status guard exists, but unlike decision-ledger there is
      no explicit baseline-documented "never overwrite, only supersede"
      invariant governing assumption transitions, and no branching/
      multiple-simultaneous-terminal-state risk since these methods flip
      one record's status rather than creating replacement records —
      deliberately left unchanged rather than inventing an unspecified
      lifecycle-ordering rule), and confirmed the file-writing surface is
      exactly 4 files (sandbox.ts, scaffold.ts, orchestrator.ts,
      file-store.ts), all of which route through the now-fixed
      confinement primitive except FileStateStore itself (intentionally
      root-agnostic/generic; every current caller confines its own paths
      before calling it). No further genuine instance of these 3 exact
      classes was found. This scoping decision is recorded here so a
      future session does not re-litigate it without new evidence.
  - >-
