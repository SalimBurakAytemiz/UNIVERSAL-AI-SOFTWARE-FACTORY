      incurred cost. Fixed by reversing the order: validation and
      `costEngine.record()` now run WHILE the reservation is still open;
      it is deleted ONLY after both succeed. On failure the reservation
      is preserved (still counted via `reservedTotal()`), a new
      `BUDGET_RESERVATION_COMMIT_FAILED` audit event is recorded, and the
