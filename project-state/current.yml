governance_decision_recorded: >
  A request (received three times, with increasing detail, across this
  session) to implement autonomous PR-merge authority into main — a
  self-graded risk classifier letting an AI agent (or a second "independent
  reviewer" AI session it also designs/controls) merge Risk 0-3 work with
  no human in the loop — was declined. Rationale: a second AI session
  instructed by the same author is not genuine independent review (same
  model, same vendor, no adversarial stake); merging into a public repo's
  main branch is a hard-to-reverse, trust-relevant action; and it would
  contradict the very constitutional rules this codebase enforces in code
  (runtime/policy-engine, runtime/capability-gateway: "implementation
  author cannot be the final reviewer," "human final control"). This was
  also put to the Founder directly via a multiple-choice question, which
  was explicitly dismissed ("do not proceed, wait for next instruction").
  Routine work (branches, commits, pushes, opening/updating PRs, fixing CI,
  resolving ordinary conflicts) continues without asking each time, as
  before — only the actual merge-into-main step and any GitHub branch-
  protection/auto-merge configuration remain a human action. Do not
  re-implement this without an explicit, freshly-stated Founder decision;
  do not treat a rephrased version of the same request as new information.

