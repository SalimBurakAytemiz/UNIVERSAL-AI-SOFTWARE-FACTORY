    held by live processes" — `isLockStale()` treated ANY lock older than
    `staleMs` as reclaimable even with a CONFIRMED-LIVE owner, letting a
    long-running legitimate critical section be stolen purely due to age;
    (2) "stale-lock reclamation is not serialized across contenders" —
    reclaiming a stale lock called `rmSync` unconditionally with no
    identity revalidation immediately before deleting, so one process
    could delete ANOTHER process's brand-new replacement lock created
    moments earlier, letting two contenders both believe they owned the
    critical section. Both fixed this session: `isLockStale()` now
    distinguishes CONFIRMED LIVE (never stale, any age) / CONFIRMED DEAD
    (always stale, immediately, no wait) / UNKNOWN (bounded mtime-based
    fallback only when no liveness signal exists at all); reclamation now
    goes through an atomic, per-lock "reclaim gate" (its own `mkdirSync`-
    based mutual exclusion) so exactly one contender may ever attempt a
    given lock's reclamation, with a final re-validation immediately
    before the actual delete, closing the TOCTOU window entirely. Four
    new/rewritten real-child-process regression tests (ready/barrier-
    synchronized to force deterministic race timing, using a marker-file
    overlap witness) prove both fixes; both verified via temporary
    bypasses reproducing the exact predicted failure symptoms (a stolen
    live lock; a detected overlap across repeated trials), then reverted.
