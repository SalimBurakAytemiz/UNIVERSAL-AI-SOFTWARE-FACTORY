    `path.relative(root, target)`'s result instead of prefix
    concatenation — a strict correctness fix that is exactly as correct
    for an ordinary root as the old check, and additionally handles the
    root-is-itself-a-filesystem-root case the old check could never
    handle by construction. A narrow audit (grepped every
    `.startsWith(...+sep)`-shaped check across `runtime/`) confirmed this
    was the ONLY instance of this exact class — `assertFilesystemConfinement()`'s
    own lexical-vs-real check already used `path.relative()` equality,
    never prefix concatenation, so it was never susceptible. Fully
