      snapshot (there was no way to read back configured limits before).
      Regression tests prove: mutating the original limits object after
      construction (including to NaN/Infinity/negative) does not corrupt
      enforcement, getLimits() cannot mutate internal state and is never
      the same reference twice, and daily/monthly enforcement still works.
    - [P1] "Symlink filesystem escape still exists": the round-3 path-escape
      fix (assertWithinRoot) was purely lexical — path.resolve/startsWith
      have no concept of symlinks, so a symlink planted inside baseDir
      pointing outside it sailed through unnoticed. Fixed: added
      assertFilesystemConfinement() (runtime/sandbox/sandbox.ts), which
      canonicalizes the nearest EXISTING ancestor of both root and target
      via fs.realpathSync (resolving symlink chains, including nested
      ones) before checking containment; scaffoldProjectOs() and
      orchestrator.ts now call this instead of the lexical-only check.
      Regression tests use REAL temporary directories and real symlinks
      (not mocks): a normal project works, a symlink inside baseDir
      pointing outside is blocked (at both the project-root and
      subdirectory level), a symlinked parent directory pointing outside
      is blocked, a nested symlink chain is blocked, nothing outside
      baseDir is modified on rejection, and a direct before/after test
      shows assertWithinRoot() ALONE is fooled by the exact symlink that
      assertFilesystemConfinement() correctly rejects. Honestly documented
      residual limitation: this is a check-then-use (TOCTOU) pattern, not
      an atomic syscall-level guarantee — Node's portable fs API has no
      cross-platform equivalent of Linux's openat2 RESOLVE_NO_SYMLINKS.
    - [P1] "Audit payload mutability leak remains": the round-3 audit-log
      fix used a SHALLOW freeze (freezeRecord) — sufficient for the
      top-level record and array-level injection/deletion, but
      `payload: Record<string, unknown>` can hold arbitrary nesting, and a
      nested field on a returned record could still be mutated
      (`record.payload.detail.amount = 9999`). Worse: the ORIGINAL event
      object passed into append() was never detached at all (only a
      shallow `{...event}` copy was stored), so a caller mutating their
      own original payload object AFTER calling append() corrupted the
      "already written" record directly — no mutation of a *returned*
      value was even required. Fixed: added deepFreezeClone() (using
      `structuredClone` + a recursive deepFreeze) in
      runtime/util/immutable.ts; append() now detaches the incoming event
      via structuredClone before storing it, and append()/all() return
      full deep clones, deeply frozen. Regression tests prove: mutating
      the original payload (incl. nested objects/arrays) after append()
      does not change the stored record, mutating a returned value's
      nested field throws instead of silently succeeding, previously
      written evidence stays structurally identical across reads,
      ordering/sequence/timestamps are unaffected, and a non-serializable
      payload (e.g. a function) now fails closed via structuredClone
      instead of being silently dropped by JSON.stringify inside hashOf().
