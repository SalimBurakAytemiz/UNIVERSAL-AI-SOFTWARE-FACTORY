  - Branch pushed and PR #1 opened (via Claude Code UI) for
    claude/ai-factory-baseline-v1-seawq7 -> main.

known_limitations:
  - Only the P0 "Factory Kernel" phase (baseline section 304) has real
    implementation. P1 (general business platform), P2 (games/3D/AI-ML/
    data studios), and P3 (advanced/universal operations) are not started.
  - The requirement registry covers the P0 phase only (42 requirements);
    the full 323-section baseline has not been decomposed into individually
    tracked requirement IDs. See specification/requirements/README.md.
  - Remaining P0-listed items still only DEFINED (not implemented):
    Requirements Traceability (orphan/coverage detection over the registry
    itself), Artifact foundation, Service/Integration catalog foundation.
  - No real model provider adapters (OpenAI/Anthropic/etc.) — only
    MockProvider. Intentional at P0 (core tests must never require a paid
    API), but a real gap beyond testing routing/budget logic itself.
  - New foundation modules (decisions, assumptions, technology-registry,
    business-capability-registry, organization-composer, project-isolation)
    are in-memory only; no persistence layer yet.
  - CI pins GitHub Actions by version tag, not commit SHA.
  - No automated dependency/SBOM/SCA scanning wired into CI yet.
  - No LICENSE file — LICENSE_DECISION_REQUIRED (baseline section 206),
    pending Human Founder decision.
  - A request to implement full autonomous PR-merge authority (self-graded
    risk classification unlocking auto-merge into main for Risk 0-4, with
    only Risk 5 requiring a human) was received mid-session and was NOT
    implemented pending explicit Founder confirmation — see "governance
    question pending" below. Routine branch/commit/push/PR-open/PR-fix
    work continues without asking each time, as before.

blockers: []

governance_question_pending: >
  Whether to build infrastructure that lets an AI agent session merge its
  own pull requests into main autonomously (with only a self-assessed
  Risk-5 classification requiring a human). Concerns raised to the Founder:
  (1) the agent would be both the implementation author and, in substance,
  the "independent reviewer" for most merges, which does not satisfy
  genuine separation of duties even if a nominally separate review step is
  automated; (2) merging into a public repository's main branch is a
  hard-to-reverse, trust-relevant action; (3) actually enabling GitHub's
  native auto-merge requires repository-admin-level branch protection
  changes that were not made unilaterally. Awaiting an explicit decision.
  In the meantime: PRs continue to be opened/updated/driven-to-green
  autonomously; the final merge click is left to the Founder or an actual
  independent reviewer.

exact_next_action: >
  1) Get the Founder's answer on the autonomous-merge governance question
  above before building any merge automation. 2) Independently of that:
  implement Requirements Traceability (orphan/coverage checks over
  specification/requirements/), Artifact foundation, and Service/
  Integration catalog foundation to close out the remaining P0-listed
  items, OR get an explicit Founder decision to close P0 with the current
  scope and move to P1. 3) Obtain a Founder licensing decision (section
  206). 4) Consider commit-SHA pinning for GitHub Actions.
