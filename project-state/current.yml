governance_decision_recorded: >
  A request (received three times, with increasing detail) to implement
  autonomous PR-merge authority into main — including a variant using a
  second "independent reviewer" AI session — was declined. Rationale: a
  second AI session instructed by the same author is not genuine
  independent review; merging into a public repo's main branch is a
  human decision; it would contradict this codebase's own enforced rules
  ("implementation author cannot be the final reviewer," "human final
  control"). This was also put to the Founder via a direct question,
  which was dismissed without selecting an option. Routine work (branches,
  commits, pushes, opening/updating PRs, fixing CI, resolving ordinary
  conflicts) continues without asking each time. Do not re-implement
  autonomous merge authority without an explicit, freshly-stated Founder
  decision.

