      mutating `context.projectId` while the provider call was pending
      could redirect the recorded cost to a different project than the
      one the reservation actually protected, letting repeated calls
      bypass a project's own ceiling entirely. Fixed: `invoke()` now
      captures every ownership field (taskId, projectId, risk,
