    Sixteenth independent Codex P0 closure review (all required
    verification — lint, typecheck, build, 610/610 tests, requirement
    validation, secret scanning, required P0 checks — confirmed passing
    beforehand) reproduced TWO remaining findings. [P1] "outstanding
    budget reservations are not shared across guards using one cost
    ledger": two `BudgetGuard` instances constructed over the SAME
    `CostEngine` each kept a PRIVATE `Map` of outstanding reservations,
    invisible to each other — two concurrent $0.60 `reserve()` calls, one
    per guard, both independently saw zero outstanding reservations
    against a shared $1.00 ceiling and both succeeded, reintroducing the
    exact race the 10th round's reservation model was meant to make
    structurally impossible, one layer up (across guard instances rather
    than within one guard). [P2] "durable cache read-modify-write is not
    safe across processes": `FileCache.set()`'s read-modify-write cycle
    (load the whole persisted map, mutate a copy, atomically replace the
    file) protected each individual write from partial content but not
    the full transaction — two real, independent processes could both
    read the same snapshot, both mutate their own copy, and the second
    process's atomic replace would silently erase the first process's
    already-successful write (classic cross-process lost-update race);
    the same race could hit `get()`'s expired-entry cleanup racing a
    concurrent `set()`. Both fixed this session (see below): reservation
    storage moved onto the shared `CostEngine` ledger itself (so every
    `BudgetGuard` bound to one ledger enforces ceilings against the SAME
    outstanding reservations, regardless of which guard created any of
    them), and a new dependency-free cross-process file-lock
    (`runtime/cache/file-lock.ts`, built on `mkdirSync`'s atomicity, with
    bounded-wait timeout, PID-liveness-based instant dead-lock recovery,
    and age-based stale-lock reclaim gated by a token so a reclaimed lock
    can never be deleted out from under its new owner) now serializes
    `FileCache`'s entire read-modify-write transaction, always re-reading
    latest state AFTER the lock is held. Both fixes verified via
    temporary in-place bypasses reproducing the exact predicted failure
    symptoms (25 budget tests failing with "expected to throw but didn't"
    when `CostEngine.reservedTotal()` was forced to always return 0;
    consistent lost-update counts — 58, 53, 66 instead of 75 — across 3
    separate runs when `FileCache`'s lock was bypassed entirely), then
    reverted. Regression evidence: 12 new budget.test.ts cases (shared-
    ledger exact reproduction, concurrent-reservation rejection,
    committed+reserved enforcement, cross-guard release/protected-
    reconciliation/commit-visibility, ownership isolation across every
    dimension, independent-ledger isolation, no-double-accounting,
    construction-order independence) and a NEW file,
    `runtime/cache/__tests__/file-cache.cross-process.test.ts`, with 9
    tests using REAL, separately-spawned Node.js child processes (via
    `tsx`, not multiple in-process FileCache instances) covering
    concurrent-different-key writes, 5-process/75-key high-contention
    safety, expiration-cleanup-vs-set() racing, crash-while-holding-the-
    lock recovery, stale-lock reclaim safety, same-process correctness,
    restart persistence, and malformed-write state preservation. Two
    narrow targeted audits performed (budget construction paths across
